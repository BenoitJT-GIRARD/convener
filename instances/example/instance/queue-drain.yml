# When the example instance's submission queue is late enough to be a
# problem. Read by `tools/convener_ops/maintenance/queue_watch.py`; bounded by
# `registration-lanes.yml` beside it, which is why the two are edited
# together and why the operators' own settings screen is the right home
# for both.
owner: instance
v: 1
alarm_after_hours: 48
max_silent_days: 2
