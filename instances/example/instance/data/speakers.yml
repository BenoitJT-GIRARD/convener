# The example instance's own speakers and editions (unified schema v6 --
# see docs/reference/schema.md). The same file `instance/data/speakers.yml` is for
# the instance that runs this repository, written for one that does not
# exist.
#
# Nobody here is real. Every address is under `.test`, which RFC 2606
# reserves and no registry will ever delegate; every affiliation names an
# institution that does not exist; every board login is prefixed
# `example-`. That combination is what makes a record unmistakably
# synthetic even if a name it invents happens to be somebody's somewhere.
#
# `edition_code` is `MRG-N`: this instance's own prefix, declared once in
# `../instance/config.json` as `edition_prefix` and written nowhere else.
# It is deliberately not `identity.short_name` (`TEC`) -- the two are free
# to differ, which is the whole reason the prefix has a key of its own --
# and `validate.validate_speakers` builds its pattern from the declaration
# rather than fixing one shape for every instance there will ever be.
#
# Five records, chosen to exercise states rather than to be plausible: a
# delivered edition with a recording and a granted consent, a delivered one
# whose speaker refused publication, a scheduled edition with a room and a
# survey, a confirmed record still choosing between dates, and a lead in a
# script other than Latin.
