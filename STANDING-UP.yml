# The sequence that turns nothing into a running instance, declared once.
#
# Everything else in this repository is written for an instance that already
# exists. This file is the other half: what somebody with no repositories and
# no accounts does, in order, to have one -- and it is a declaration rather
# than a page, because two things read it. `docs/reference/standing-up.md` is
# generated from it by `scripts/generate_standing_up_doc.py`, and an agent
# that carries the same sequence out reads these rows directly. Two documents
# describing one procedure diverge; this repository has paid for that with
# three palettes, five addresses and two path lists, and a corrected page
# beside a forgotten agent is the same defect with a longer fuse.
#
# At the repository root, and deliberately not in `config/`
# ---------------------------------------------------------
# `config/` already holds two files the product owns (`boundary.yml` and
# `integrations.yml`), so precedent alone would have allowed a third. The
# argument against it is `NOTICE.json`'s, and it holds here for the same two
# reasons and one more.
#
# First, `config/` is the directory an operator opens to *configure an
# instance*, and a file filed among the settings is a file somebody
# eventually edits. Nothing here is an instance's to change: an instance that
# disagrees with this sequence is not configured differently, it is not
# standing up.
#
# Second, everything `config/boundary.yml` does not hand to the instance
# belongs to the product, so a file at the root is the product's without
# anybody declaring it -- which is why there is no `owner:` key below, and
# why adding one would have been the copy this file exists to refuse.
#
# Third, and the one that settles it: the two files in `config/` are read by
# the running product to decide what it does. `boundary.py` reads the
# boundary on every sweep; `integrations.py` reads the integrations on every
# `convener-check-config`. This file is read by neither, and cannot be -- it
# describes the acts that bring a repository into existence, which is to say
# it is read *before* there is anything to configure, by a person with a
# browser and by whatever helps them. It is a statement the product makes
# about itself, like `NOTICE.json` and `CITATION.cff`, not a setting.
#
# What a step carries, and why each field is required
# ---------------------------------------------------
# `actor` is `human` or `agent`, and the distinction is operational rather
# than a preference about who ought to do the work. A step is `human` when a
# person must carry it out: either the flow exists only in a browser and has
# no API at all (creating a mailbox, registering a GitHub App, minting a
# fine-grained personal access token), or the value it produces must never
# exist anywhere but in the hands of the person who minted it (the
# certificate signing key, which `docs/reference/operations.md` already
# refuses to let anything automated near). Everything else is `agent`: a file
# edit, a command, or an API call something can make with credentials it has
# been handed. Minting is a person's act; setting what was minted is not, and
# a step never mixes the two.
#
# `check` is what proves the step is done, stated so that a browser is enough
# to read it, with `command` beside it where a command genuinely helps. A
# step with no check is a step nobody can tell they have finished, which is
# how a sequence turns into a list somebody reads once.
#
# `degraded` is what an instance loses by skipping the step -- and a step
# that completes an integration does not carry one. It names the rows in
# `config/integrations.yml` instead, and the generated page renders what
# `convener-check-config` already prints for them. That report is most of
# this verification machinery already built, and restating one of its
# paragraphs here would be a second source for the one fact it is the
# authority on.
#
# `walkthrough` is required of a `human` step and forbidden of an `agent`
# one: those sections are handed to a person verbatim, so they have to be
# complete on their own, with no step left implicit because the surrounding
# prose covered it.
#
# No secret value appears anywhere below, and none ever may. What is declared
# is which secret exists, which repository or worker it belongs to, and the
# menu path a person sets it through.
v: 1

# The two repositories an instance runs on. Their asymmetry is the whole of
# D-15 and the reason this sequence has a shape at all.
repositories:
  - id: cockpit
    visibility: private
    what: >-
      The instance itself: the code, the workflows, the participant records,
      and every secret. Private because `data/speakers.yml` and the per-event
      registration files hold personal data, and a repository holding those
      cannot be public. Created as a new repository of your own, never as a
      fork — repositories in one fork network share an object store, so a
      commit pushed to a private-looking fork stays reachable from the public
      parent for ever, and no setting inside the fork closes that route.
  - id: showcase
    visibility: public
    what: >-
      The publication target, and nothing else. GitHub Pages will not serve a
      private repository without a paid plan, which the no-cost constraint
      rules out, so continuous integration in the cockpit builds `site/` and
      `app/` and pushes the result into this repository's root. Nobody edits
      anything here. Every byte is reproducible from the cockpit, so losing
      it costs a rebuild.

# The eight stages, in order. Each one ends somewhere a person can stop.
stages:
  - id: accounts
    title: Nothing exists yet
    purpose: >-
      Three things that have to be somebody's before anything can be created
      under them, and one rule that governs all three: no account this
      instance depends on is ever created with a personal address.
  - id: repositories
    title: The two repositories
    purpose: >-
      Both, in this order, with the visibility each one needs from its first
      commit. A repository created public and made private afterwards has
      already published whatever it held.
  - id: identity
    title: The three files a duplicate edits
    purpose: >-
      What makes the instance yours rather than the worked example's. Until
      these are done the showcase prints a band above its masthead and the
      cockpit prints one above its sign-in screen, naming the keys still to
      fill in.
  - id: publishing
    title: Getting a public site
    purpose: >-
      The first real deployment, and the first honest answer to whether any
      of the stage above is right. Nothing until now has been verified
      against anything a visitor can open.
  - id: relays
    title: The three workers
    purpose: >-
      Sign-in, registration intake and proposal intake each need an edge
      worker, and all three deploy to one free Cloudflare account. Two of
      them also need a storage namespace, which does not exist until it is
      created and cannot be shipped filled in.
  - id: intake
    title: The public proposal form
    purpose: >-
      The one surface a stranger reaches without being invited. It is built
      from code rather than clicked together, so that it can be rebuilt if
      the account is ever lost.
  - id: records
    title: What protects a participant's record
    purpose: >-
      Three credentials that are not features. Two are minted once and never
      rotated; the third is what makes this project's central promise — a key
      destroyed on a deadline — happen without anybody remembering to do it.
  - id: optional
    title: What is left, and what each costs to skip
    purpose: >-
      Every remaining integration degrades visibly and none of them breaks
      anything. An instance that stops here is a working instance, and this
      stage is a menu rather than a queue.

# The sequence itself. Order is the order of this list, and it is load-bearing
# in five places: a repository is private before it holds anything, a public
# key is published before the private half that reads it exists, a worker is
# deployed before the form whose webhook points at it is published, an origin
# is corrected before the worker carrying it is deployed, and the first
# publish happens before anything else is verified against it.
steps:
  - id: mail_account
    stage: accounts
    title: An address the organisation owns
    actor: human
    does: >-
      Create an email address that belongs to the series rather than to a
      person, and use it for every account this sequence creates. Any provider
      with a free tier will do; nothing here depends on which one.
    check: >-
      Sign in to it from a private browser window using only what is written
      in the shared store below, and have a second Board member do the same.
      An address only one person can reach has not been created yet, whatever
      it says on the mailbox.
    degraded: >-
      Every account below ends up tied to one person's own mailbox, and the
      series continues only for as long as that person stays reachable and
      willing. This is the mechanism behind D-11, and it is the one step in
      this sequence that cannot be corrected later without recreating
      everything downstream of it: password resets go to the mailbox, so
      whoever holds the mailbox holds the instance.
    walkthrough:
      - Choose a provider with a free tier. Nothing in this project reads the
        mailbox; it receives password resets and it is what other accounts are
        created under.
      - Create the address under the series' own name, not a person's — the
        form organisers would put on a poster.
      - Set recovery to something the organisation controls too. A recovery
        address belonging to one volunteer reintroduces exactly the dependency
        this step removes.
      - Write the address and its password into the shared store, in the next
        step, before creating anything else with it.

  - id: credential_store
    stage: accounts
    title: A store two people can open
    actor: human
    does: >-
      Create the shared password store that every credential below is written
      into — a file in the organisation's existing shared drive, or a password
      manager the Board already uses. Never in this repository, and never in
      one person's browser.
    check: >-
      A second Board member opens it, unaided, and finds the mailbox
      credentials from the step above already in it.
    degraded: >-
      Credentials survive only in the browser profile of whoever created them.
      A handover then loses the workers, the public form and the mailbox at
      once, and none of the three can be recovered from this repository,
      because nothing about them is in it. D-11 rejects storing them here even
      in the private repository, and that ruling is what leaves this step
      with no alternative.
    walkthrough:
      - Decide where it lives — the organisation's shared drive, or a password
        manager the Board already pays nothing for. Do not open a new
        subscription; there is nothing here a plain encrypted file cannot do.
      - Create it, and set a master password that is not any individual's own.
      - Share that master password out of band with two or three Board
        members, not one, and not over the mailbox the store protects.
      - Never commit it. It is not in `.gitignore` because it is never in this
        directory tree at all.

  - id: github_owner
    stage: accounts
    title: The GitHub account or organisation the repositories sit under
    actor: human
    does: >-
      Create the GitHub account, or the organisation, that will own both
      repositories, using the address from the first step. The free tier is
      the tier this project is designed for; nothing below needs a paid plan.
    check: >-
      Signed in as that account, the *New repository* button offers it as an
      owner. If a team of people will run the series, an organisation is what
      makes that possible without sharing one login.
    degraded: >-
      There is nothing to create the two repositories under, so the sequence
      stops here. An organisation rather than a personal account also decides
      whether the Board can ever be a team rather than a list of names: the
      board-notification step below needs an organisation team, and a personal
      account has none.
    walkthrough:
      - Sign up at github.com with the address from the first step, or sign in
        if it already has an account.
      - If more than one person will ever run this series, create an
        organisation as well — Settings → Organizations → New organisation,
        and choose the free plan.
      - Store both logins and their recovery codes in the shared store.
      - Turn on two-factor authentication. GitHub requires it, and the
        recovery codes belong in the store beside the password.

  - id: private_cockpit
    stage: repositories
    title: The private repository, duplicated and never forked
    actor: agent
    does: >-
      Create a new private repository of your own and put this repository's
      contents in it, with no fork relationship to the product. GitHub offers
      *Fork* as the obvious action and it is the wrong one here: a fork of a
      public repository cannot be made private, and repositories in one fork
      network share an object store, so a commit pushed to a fork stays
      reachable from the public parent permanently and after the fork is
      deleted.
    check: >-
      The repository's own page shows *Private* and carries no *forked from*
      line under its name. Both have to be true; either one alone is not the
      thing being checked.
    command: >-
      gh repo create <owner>/<name> --private --source=. --remote=origin --push
    degraded: >-
      Nothing else in this sequence has anywhere to live. Done as a fork
      instead, or created public and made private afterwards, it publishes
      participants' names and addresses by a route nobody would think to check
      — and no setting inside the repository closes that route once it is
      open. D-15 has the reasoning in full.

  - id: public_showcase
    stage: repositories
    title: The public repository the site is published into
    actor: agent
    does: >-
      Create a second repository, public and empty. Nothing is authored in it
      ever: two workflows in the private repository push into its root, each
      touching a subtree the other never reads. Do not initialise it with a
      README — Pages will serve that README rather than the site until the
      first real publish lands, which is a failure that returns 200.
    check: >-
      The repository exists, is public, and its file list is empty.
    command: >-
      gh repo create <owner>/<name> --public
    degraded: >-
      Both publishing workflows have nowhere to push, so there is no public
      site: no registration page, no certificate verification page, and no
      cockpit for anyone to sign in to. The deploy token in the publishing
      stage below also has nothing to be scoped to.

  - id: pages_source
    stage: repositories
    title: Pages, on the public repository only
    actor: agent
    does: >-
      Turn GitHub Pages on for the public repository, serving from a branch
      rather than from an action: Settings → Pages → Source = *Deploy from a
      branch*, branch `main`, folder `/ (root)`. Pages stays off on the
      private repository, and there is nothing to enable there.
    check: >-
      Settings → Pages names `main` and `/ (root)`, and shows the address the
      site will be served at. That address, with its trailing slash, is what
      the next stage writes into `config/instance.json`.
    degraded: >-
      Nothing is served, or — worse, and this is the failure this project has
      already met once — the wrong thing is served with no sign of it. A push
      that reaches a branch Pages is not configured to serve leaves Pages
      rendering the repository's own README instead, and a bare request
      answers 200 over a site that does not exist. Read the served page's
      source, not its status code.

  - id: instance_declaration
    stage: identity
    title: Who is publishing, and where
    actor: agent
    does: >-
      Edit `config/instance.json`: the published address and its trailing
      slash, the edition prefix your talks are numbered under, and the nine
      identity values a stranger reads — the organisation and its short form,
      the series, its strapline and its tagline, the forum, the contact
      address, the proposal form, and the cockpit's own repository. Leave
      `proposal_form` as it is for now; the intake stage writes it once the
      form exists. Then correct the one product file carrying a value derived
      from this one that nothing can derive for it: `.github/CODEOWNERS` names
      the team every review request goes to as
      `@<organisation>/editorial-board`, and `<organisation>` is the owner
      half of the repository just declared. GitHub parses that file itself,
      before any code of this project's can run, which is why it holds a
      literal at all.
    check: >-
      After the first publish, open any page of the showcase and the cockpit's
      sign-in screen: the band naming unfilled keys is gone from both. The
      band compares each value against the worked example's own declaration,
      value by value, so a half-filled file still shows it and names exactly
      which keys are left. `.github/CODEOWNERS` has a check of its own, and it
      answers long before the first publish: the command below refuses any
      organisation but the declared one.
    command: cd tools && uv run pytest tests/test_published.py -k literals
    degraded: >-
      The showcase and the cockpit both announce that they are not configured,
      on every page, which is correct and is the point. Worse than the band is
      what the band exists to prevent: the published address is what every
      other address in this project is derived from, so a duplicate that
      renames the organisation and leaves that address alone publishes under
      somebody else's prefix while every page reads as its own. An
      uncorrected `.github/CODEOWNERS` degrades the other way, quietly: every
      review request goes to a team in an organisation this repository does
      not own, GitHub resolves it to nobody, and the pull request waits for a
      review that cannot arrive.

  - id: board_and_thresholds
    stage: identity
    title: The Board, the season and the bar a vote is measured against
    actor: agent
    does: >-
      Edit `data/config.yml`: the Editorial Board's GitHub logins, the season,
      and the thresholds a vote is counted against. Logins, not names — the
      cockpit asks GitHub who is signed in, and a first name is not an answer
      to that question.
    check: >-
      `convener-validate` exits 0, and the *Validate data* workflow is green
      on the commit that changed the file.
    command: cd tools && uv run convener-validate
    degraded: >-
      The Board screen has nobody on it, no ballot can reach a threshold, and
      both gates — approving a speaker, publishing a recording — are
      unpassable, so the pipeline stops at its first decision. An identifier
      that is not a GitHub login is the specific half-done state this
      repository has met before: the file is valid, the person exists, and the
      cockpit still does not recognise them when they sign in.

  - id: own_records
    stage: identity
    title: Your own records, starting empty
    actor: agent
    does: >-
      Empty `data/speakers.yml`. A duplicate starts with no speakers and no
      events; the file that ships holds the worked example's invented reading
      group, which exists to prove the product can be built as somebody else
      and for nothing else.
    check: >-
      `convener-validate` exits 0 on the emptied file, and the showcase's
      archive page lists nothing.
    command: cd tools && uv run convener-validate
    degraded: >-
      Your showcase publishes an invented series' sessions as though they were
      yours: three events with dates, an archive page, and a feed announcing
      them. Nothing warns about it, because a file full of well-formed records
      is exactly what this file is supposed to hold.

  - id: vitrine_deploy_token
    stage: publishing
    title: The token that lets the cockpit push into the showcase
    actor: human
    does: >-
      Mint a fine-grained personal access token scoped to the public
      repository alone, with *Contents: read and write* and nothing else, and
      set it as a repository secret on the private repository. GitHub offers
      no API that mints one, which is why this is a person's step.
    check: >-
      The secret is listed under the private repository's Actions secrets. Its
      value cannot be read back — GitHub shows only that it is set, and that
      is the check.
    sets:
      - VITRINE_DEPLOY_TOKEN
    degraded: >-
      Neither publishing workflow fails. Each logs a line and exits cleanly at
      its own first push step, so the Actions tab shows green runs while
      nothing is pushed anywhere and there is no public site at all. There is
      no fallback publishing route, and nothing about the green run says so.
    walkthrough:
      - Signed in as the account that owns both repositories, open Settings →
        Developer settings → Personal access tokens → Fine-grained tokens →
        Generate new token.
      - Name it for what it does, so the next person can tell what breaks if
        they revoke it.
      - Under *Repository access*, choose *Only select repositories* and pick
        the public one. Not the private one — this token pushes the built site
        outward, and giving it the repository holding the records would hand a
        write credential to the data.
      - Under *Repository permissions*, set *Contents* to *Read and write*.
        Leave every other permission alone.
      - Set an expiry you will actually notice, and put the renewal date in
        the shared store beside the token.
      - Generate it, copy it once, and paste it into the private repository's
        Settings → Secrets and variables → Actions → Secrets → New repository
        secret, named `VITRINE_DEPLOY_TOKEN`. Then paste it into the shared
        store. GitHub will not show it again.

  - id: first_publish
    stage: publishing
    title: The first publish, and reading it in a browser
    actor: agent
    does: >-
      Run *Publish vitrine* and *Deploy app* from the private repository's
      Actions tab, and then open what they produced. This is the first moment
      anything in this sequence has been checked against a deployment rather
      than against a local run.
    check: >-
      All four addresses answer, and the showcase's page source carries no
      Jekyll generator tag. A build served from a bare local root is not a
      preview of this — the path prefix is baked in at build time, so a page
      that resolves locally and 404s once published is the defect D-26 exists
      to catch, and only the deployed page can catch it.
    degraded: >-
      Every later step in this sequence is verified against a site nobody has
      opened. The two failures this stage is here to surface — a Pages source
      pointing at a branch nothing pushes to, and an address written into
      `config/instance.json` that does not match the one Pages serves — both
      look like success from inside the repository, and both are obvious from
      one browser tab.

  - id: github_app
    stage: relays
    title: The GitHub App that signs volunteers in
    actor: human
    does: >-
      Register a GitHub App under the account or organisation from the first
      stage, with device flow enabled and *Contents: read and write* on the
      private repository and nothing else. There is no API for registering an
      App: it is a browser form, start to finish, which is why this step is
      written out in full.
    check: >-
      The App's own settings page shows *Enable Device Flow* ticked, one
      repository permission, and a client id beginning `Iv`. The client id is
      not a secret — it ships inside the browser bundle by construction — and
      it is what the next steps set as a repository variable.
    sets:
      - VITE_GITHUB_APP_CLIENT_ID
    degraded: >-
      Half of the sign-in relay is missing, so the relay row stays absent
      whatever else is deployed, and every volunteer signs in with a personal
      access token they have to mint themselves. Nothing is broken; onboarding
      is simply slower, and each volunteer ends up holding a credential the
      organisation did not issue and cannot revoke centrally.
    walkthrough:
      - Open Settings → Developer settings → GitHub Apps → New GitHub App. Use
        the organisation's settings if the repositories are owned by an
        organisation, so the App belongs to the organisation and not to you.
      - Give it a name — it appears on the sign-in screen — and set the
        homepage URL to the published address from the publishing stage. This
        is a setting no test and no workflow will ever notice drifting, so it
        is worth getting right now.
      - Leave the callback URL empty and tick *Enable Device Flow*. The device
        flow is what lets a static page sign somebody in without a server; it
        is D-03's whole subject.
      - Untick *Webhook → Active*. This App receives nothing.
      - Under *Repository permissions*, set *Contents* to *Read and write*.
        Set nothing else, and in particular not *Issues*. The board
        notifications are posted by the workflow's own token, so *Issues* here
        would be a permission nobody uses on a repository holding personal
        data.
      - Under *Where can this GitHub App be installed*, choose *Only on this
        account*.
      - Create it, then use *Install App* to install it on the private
        repository alone.
      - Copy the client id from the App's settings page into the shared store.
        Generate no client secret. The device flow does not need one, and the
        relay is deliberately secret-free.

  - id: cloudflare_account
    stage: relays
    title: The Cloudflare account, and the token CI deploys with
    actor: human
    does: >-
      Create a free Cloudflare account with the organisation address, and mint
      an API token that can edit Workers. All three workers deploy to this one
      account. Creating the account and minting the token are both browser
      flows.
    check: >-
      The token is listed on Cloudflare's API Tokens page as active, and it is
      set as a repository secret on the private repository.
    sets:
      - CLOUDFLARE_API_TOKEN
    degraded: >-
      None of the three workers can be deployed by continuous integration, and
      each *Deploy* workflow reports that it is skipping rather than failing —
      a normal state until the account exists, and indistinguishable from a
      quiet day unless you read the job log. Deploying by hand instead needs
      Node and a browser login on the machine doing it, which is exactly the
      dependency the rest of this project avoids.
    walkthrough:
      - Sign up at cloudflare.com with the address from the first stage. The
        Workers free plan is what this project is sized for; add no domain and
        no paid plan.
      - Open My Profile → API Tokens → Create Token.
      - Use the *Edit Cloudflare Workers* template. It grants exactly what
        `wrangler deploy` needs and nothing that touches DNS.
      - Under *Account Resources*, restrict it to this one account.
      - Create the token, copy it once, and paste it into the private
        repository's Settings → Secrets and variables → Actions → Secrets →
        New repository secret, named `CLOUDFLARE_API_TOKEN`. Then paste it
        into the shared store; Cloudflare will not show it again either.

  - id: relay_bindings
    stage: relays
    title: The one value in the workers a duplicate has to fill in
    actor: agent
    does: >-
      Two of the three workers keep a counter in a KV namespace, and a
      namespace does not exist until somebody creates it: Cloudflare
      allocates the id, per account, so it cannot be shipped filled in.
      Create the two namespaces the form relay and the signup relay bind to,
      pasting each printed id over the placeholder in that worker's own
      `wrangler.toml`. Nothing else in those workers is yours to correct.
      Two values were, and neither is written down anywhere but
      `config/instance.json` now: the origin each relay answers cross-origin
      requests for, and the repository the form relay and the signup relay
      dispatch into. Each deploy workflow derives what its worker needs and
      hands it to `wrangler deploy`.
    check: >-
      No `wrangler.toml` still holds a placeholder id, and no worker names
      either value — an origin written back into a configuration or a
      repository written back into a worker's source is refused by
      `tools/tests/test_published.py`, on the Python suite, with no worker's
      suite run. Both greps below are anchored on what an assignment looks
      like rather than on the name: every one of these files explains in a
      comment why the value is not there, so a search for the bare word
      matches the explanation and can never come back empty.
    command: >-
      grep -RE "REPLACE_WITH_|^ALLOWED_ORIGIN" services/*/wrangler.toml ; grep -RE "github.com/repos/[A-Za-z0-9]" services/*/src/index.js
    degraded: >-
      A failure that is not loud. A KV id left at its placeholder makes
      *Deploy form relay* and *Deploy signup relay* skip the deploy and end
      green, so nothing is deployed and the Actions tab says everything is
      fine.

  - id: relay_tokens
    stage: relays
    title: The two dispatch tokens the relays hold
    actor: human
    does: >-
      Mint two separate fine-grained personal access tokens, both scoped to
      the private repository with *Contents: read and write*, one for the form
      relay and one for the signup relay. Two, not one reused: each worker
      spends GitHub API calls against the same hourly budget, and a shared
      token couples the two workers' quotas so that a flood of registrations
      silences the proposal form.
    check: >-
      Two tokens are listed on the fine-grained tokens page, each naming the
      private repository and no other, and both are in the shared store. They
      are set on the workers themselves in the two steps below, not here.
    degraded: >-
      Neither the registration path nor the proposal path can reach the
      repository. A worker without its token cannot turn a submission into
      anything, so a participant's registration is accepted by the browser,
      encrypted, and then goes nowhere.
    walkthrough:
      - Open Settings → Developer settings → Personal access tokens →
        Fine-grained tokens → Generate new token.
      - Name the first one for the form relay. Under *Repository access*
        choose *Only select repositories* and pick the private repository.
      - Under *Repository permissions*, set *Contents* to *Read and write*.
        Nothing else. The relay sends a repository dispatch and reads one
        published key file; neither needs more.
      - Generate it, copy it once, and paste it into the shared store.
      - Repeat the whole form for the second token, named for the signup
        relay. Do not reuse the first — the reason is a quota, not a
        permission, so nothing will ever warn you that you have.
      - Set an expiry you will notice, and record both renewal dates beside
        the tokens.

  - id: auth_relay
    stage: relays
    title: The sign-in relay, deployed and pointed at
    actor: agent
    does: >-
      Deploy the worker in `services/auth-proxy/` — run *Deploy auth relay*
      from the Actions tab now that the Cloudflare token is set — and then set
      two repository variables on the private repository: the deployed
      worker's URL, and the client id of the App from two steps above. Both
      are variables rather than secrets, and that is not an oversight: a relay
      URL and an OAuth client id ship inside the browser bundle, so a secret
      would be a secret in name only.
    check: >-
      Run the configuration report and read the *Authentication relay* row: it
      moves from `absent` to `production`. In a browser, sign out of the
      cockpit and reload — the screen offers a short code rather than a field
      asking for a token.
    command: cd tools && uv run convener-check-config
    sets:
      - VITE_AUTH_PROXY_URL
      - VITE_GITHUB_APP_CLIENT_ID
    integrations:
      - auth_proxy

  - id: signup_relay
    stage: relays
    title: The relay a registration passes through
    actor: agent
    does: >-
      Deploy the worker in `services/signup-relay/` and set its dispatch token
      as a Wrangler secret, then set the deployed URL as a repository variable
      on the private repository. This worker cannot read what it forwards: the
      body is ciphertext the participant's own browser produced under the
      event's public key, and the worker holds no private half. Its second
      route carries the post-event survey, on the same deployment, with no
      second variable and no second secret.
    check: >-
      Run the configuration report and read the *Registration relay* row: it
      moves from `absent` to `production`. Then the browser check, which is
      the one that exercises the worker itself: with the variable set and the
      application rebuilt, submit the registration form for an event that has
      a published key, and the worker answers 204. Seeing no workflow run at
      all can be correct: a registration further from its event than the queue
      threshold is written to a queue branch and confirmed on the next daily
      drain.
    command: cd tools && uv run convener-check-config
    sets:
      - VITE_SIGNUP_RELAY_URL
      - CONVENER_DISPATCH_TOKEN
    integrations:
      - signup_relay

  - id: tally_account
    stage: intake
    title: The form account, and the key that builds from code
    actor: human
    does: >-
      Create a free Tally account with the organisation address and copy its
      API key. The key is used once, from a shell, to build the public
      proposal form; it is never a repository secret and never reaches CI.
    check: >-
      The key is in the shared store, and Tally's dashboard shows no form yet.
    sets:
      - TALLY_API_KEY
    degraded: >-
      The proposal form has to be clicked together by hand instead, which
      works and cannot be recovered: a form built in the editor cannot be
      recreated if the account is lost, and its field labels are matched
      against this project's own reader by text, so a label reworded in the
      editor silently stops resolving. Building it from code is D-03's
      argument applied to something other than code.
    walkthrough:
      - Sign up at tally.so with the address from the first stage. The free
        plan is what this project uses.
      - Open the workspace settings and find the API key section.
      - Generate a key and paste it into the shared store. It is a credential
        like any other; it simply never leaves an operator's own machine.

  - id: form_relay
    stage: intake
    title: The relay between the public form and the repository
    actor: agent
    does: >-
      Deploy the worker in `services/form-relay/` and set its dispatch token
      as a Wrangler secret. It is a second worker rather than a route on the
      first because turning a form submission into a repository dispatch needs
      a GitHub token, and the sign-in relay's whole claim is that it holds
      none. Its shared signing secret is set in the step below, once the form
      exists to produce one.
    check: >-
      *Deploy form relay* ends green with a *Deploy* step that actually ran —
      not the skip message, which is what it prints while a placeholder id
      stands — and the worker answers on its own root path.
    sets:
      - CONVENER_DISPATCH_TOKEN
    degraded: >-
      The public form has nowhere to send a submission. No proposal becomes a
      lead, and *Handle proposal* is never triggered, so the intake a visitor
      can see is the one part of this project that fails silently on the
      visitor's side and leaves nothing on yours.

  - id: tally_form
    stage: intake
    title: The form, built from this repository rather than clicked together
    actor: agent
    does: >-
      Run the one-shot script that builds the public proposal form on Tally,
      with the API key in the environment. It removes the whole of the manual
      path: every question, its label, whether it is required, and the closed
      vocabularies behind *Gender* and *Career stage* are read from this
      project's own reader rather than retyped, so a label renamed on one side
      breaks a test rather than breaking the live form. Re-running it finds
      the form by its title and updates it in place. The key reaches the
      command through a `.env` file at the repository root rather than through
      the command line, which a shell keeps in its history and every terminal
      recording keeps for ever; `.gitignore` already refuses that file, and
      the command below deletes it whether the run succeeded or not, so it
      exists for one command and no longer. It is the only credential in this
      sequence ever put in a file on the machine running these commands: every
      other one is typed into a browser or into a prompt that reads it without
      showing it.
    check: >-
      Tally's dashboard shows one form, in `DRAFT`, whose questions match the
      reader's own field list. The script creates it as a draft deliberately —
      publishing is the next step, and it is a person's. `.env` is gone
      afterwards, whichever way the run ended.
    command: >-
      cd tools && set -a && . ../.env && set +a && uv run python
      ../scripts/create_tally_form.py; rm -f ../.env
    degraded: >-
      The form is built by hand, which is slower and, more to the point,
      unverifiable: the two dropdown questions deliver a closed vocabulary the
      reader compares literally, and a respondent whose answer does not match
      one of those tokens is recorded as undisclosed, silently, with no log
      line and at a steady rate rather than as an edge case.

  - id: proposal_form_live
    stage: intake
    title: Publishing the form, pointing its webhook, and naming it
    actor: human
    does: >-
      Open the draft in Tally, confirm the hint text renders under the two
      dropdowns, publish it, point its webhook at the deployed form relay, set
      the signing secret Tally shows in the two places that verify it, and
      write the published form's address into `config/instance.json`.
    check: >-
      Submit the form yourself. A new lead appears in `data/speakers.yml`
      shortly afterwards, committed by *Handle proposal*, and the showcase's
      propose page links the form instead of saying it is not open yet.
    sets:
      - TALLY_WEBHOOK_SECRET
    degraded: >-
      A form that exists and reaches nobody. A webhook pointed at any path but
      the worker's root answers 404 and the submission is lost with no error
      anyone sees, and a signing secret set on one side only makes the worker
      refuse every request outright. Left unpublished, the showcase's propose
      page offers the contact address instead, which is a working fallback and
      not a failure.
    walkthrough:
      - Open the draft form in Tally's dashboard and read the two dropdown
        questions. Their hint text is placed on each dropdown's first option,
        a location inferred from Tally's own schema rather than confirmed
        against a worked example — if it does not render as a hint, the
        answers still resolve correctly, but a respondent sees a bare token
        with no explanation. Reword the question itself if so.
      - Publish the form. A later run of the build script never touches its
        published state, so this is a one-time check.
      - Do not rename the form in Tally's editor. The script finds it again by
        its title, so a rename makes the next run create a second form beside
        the first rather than update it.
      - Open the form's Integrations → Webhooks and add a webhook pointing at
        the form relay's URL with no path after it. The worker's only route is
        its root; anything else answers 404 and the submission is silently
        lost.
      - Copy the signing secret Tally shows for that webhook. Set it as a
        Wrangler secret named `TALLY_WEBHOOK_SECRET` on the form relay, and as
        a repository secret of the same name on the private repository. The
        worker verifies it before forwarding anything, and the workflow
        verifies it again on arrival.
      - Copy the published form's address into `config/instance.json` as
        `identity.proposal_form`, and commit. Until that value is a real
        address, the showcase's propose page reads as not yet open.

  - id: retention_token
    stage: records
    title: The credential that destroys a key on its deadline
    actor: human
    does: >-
      Mint a fine-grained personal access token scoped to the private
      repository with *Secrets: read and write* and nothing else, and set it
      as a repository secret. Destroying an event's key means deleting a
      repository secret, and the token a workflow is issued by default cannot
      delete one whatever permissions that workflow grants itself.
    check: >-
      Run the configuration report: *Retention sweep credential* moves from
      `absent` to `production`. Until it does, the scheduled retention job is
      red every single day.
    command: cd tools && uv run convener-check-config
    sets:
      - CONVENER_RETENTION_TOKEN
    integrations:
      - retention_token
    walkthrough:
      - Open Settings → Developer settings → Personal access tokens →
        Fine-grained tokens → Generate new token.
      - Under *Repository access*, choose *Only select repositories* and pick
        the private repository.
      - Under *Repository permissions*, set *Secrets* to *Read and write*.
        Set nothing else at all — this is the one credential in this project
        that can delete a secret, and every other permission on it is
        unnecessary reach.
      - Generate it, copy it once, and paste it into the private repository's
        Settings → Secrets and variables → Actions → Secrets → New repository
        secret, named `CONVENER_RETENTION_TOKEN`. Then paste it into the
        shared store.
      - Put its expiry date in the calendar. This token expiring turns the
        retention job red every day until it is replaced, which is the right
        way round, but somebody has to be the one to notice.

  - id: signing_key
    stage: records
    title: The key that signs a certificate, minted by a person and only once
    actor: human
    does: >-
      Generate the certificate signing key pair yourself, interactively,
      commit its public half, and paste its private half straight into the
      repository's secrets. This is not an automated step and not one to
      delegate: it mints the one key every certificate this series ever issues
      depends on, and it is minted exactly once by somebody who then holds the
      only copy of its private half until it is pasted in and never printed
      again.
    check: >-
      Run the configuration report: *Certificate signing key* moves from
      `absent` to `production`, and `keys/signing/` holds one public half
      named for the day it was generated.
    command: cd tools && uv run convener-check-config
    sets:
      - CONVENER_SIGNING_KEY
    integrations:
      - signing_key
    walkthrough:
      - Open a Python shell inside `tools/` with `uv run python`, and generate
        the pair with `from convener_ops.signing import generate; private_pem,
        public_pem = generate()`.
      - Commit the public half first, as `keys/signing/` plus the day it was
        generated and a `.pub` suffix. The order is load-bearing, because a
        private secret set before its public half is published lets a job sign
        a certificate nothing can yet verify.
      - Paste the private half directly from that terminal into the private
        repository's Settings → Secrets and variables → Actions → Secrets →
        New repository secret, named `CONVENER_SIGNING_KEY`. Never write it to
        a file, not a temporary one and not an ignored one.
      - Confirm the paste, then close the terminal that generated it. Nothing
        else should retain a copy, including the shared store — the public
        half is what a stranger verifies against, and the private half exists
        to be usable by one workflow and nobody else.
      - Never remove a published public half later. Verification is handed
        every one of them and tries each in turn, so deleting one is what
        would make an already-issued certificate stop verifying.

  - id: matching_salt
    stage: records
    title: The salt behind a matching code and a register's fingerprint
    actor: human
    does: >-
      Generate one long random value and set it as a repository secret. One
      secret, two unrelated derivations: the code a participant types into the
      meeting room's display name, and the certificate register's own salted
      trace of an address. It is never per-event, and it must never be rotated
      once registrations exist under it.
    check: >-
      Run the configuration report: *Registration matching salt* and
      *Certificate register fingerprint* both move from `absent` to
      `production`. Two rows, one secret — they are separate rows because
      their absences mean different things, not because there are two values.
    command: cd tools && uv run convener-check-config
    sets:
      - CONVENER_MATCHING_SALT
    integrations:
      - matching_salt
      - certificate_fingerprint
    walkthrough:
      - Generate a long random value on your own machine. `openssl rand
        -base64 32` is enough; so is anything that produces thirty-odd bytes
        nobody could guess.
      - Paste it into the private repository's Settings → Secrets and
        variables → Actions → Secrets → New repository secret, named
        `CONVENER_MATCHING_SALT`, and into the shared store.
      - Do not rotate it afterwards. Rotating changes every matching code
        already given to a participant, so a resent confirmation no longer
        matches what they were told — and it changes every past attendee's
        fingerprint too, so certificate issuance stops recognising them and
        mints each a second certificate on its next run.

  - id: board_notifications
    stage: optional
    title: Where the Board is told what happened
    actor: agent
    does: >-
      Open a standing issue in the private repository to serve as the
      notification thread, create an organisation team named `editorial-board`
      and put the Board in it, and set the issue's number and the team's
      handle as repository secrets. No external service and no account: GitHub
      itself is the delivery mechanism.
    check: >-
      Run the configuration report: *Board notifications* moves from `absent`
      to `production`. Reading the day's message without sending it is a
      command of its own.
    command: cd tools && uv run convener-notify-digest --dry-run
    sets:
      - CONVENER_NOTIFY_THREAD
      - CONVENER_NOTIFY_MENTION
    integrations:
      - board_notifications

  - id: outbound_email
    stage: optional
    title: Sending a confirmation, a certificate and a survey invitation
    actor: human
    does: >-
      Give the workflows a way to send mail as the organisation's own address
      over ordinary SMTP — five values, on whatever mailbox the first stage
      created. No transactional-email service and no subscription: D-07
      arbitrated that, and the mailbox already exists.
    check: >-
      Run the configuration report: *Outbound email* moves from `absent` to
      `production`.
    command: cd tools && uv run convener-check-config
    sets:
      - CONVENER_SMTP_HOST
      - CONVENER_SMTP_PORT
      - CONVENER_SMTP_USER
      - CONVENER_SMTP_PASSWORD
      - CONVENER_SMTP_FROM
    integrations:
      - email_transport
    walkthrough:
      - Find the provider's SMTP settings for the mailbox from the first
        stage. Most want port 587 with STARTTLS; some want 465 with implicit
        TLS. Either works — the port itself is what decides which is used, so
        there is no code change to make.
      - If the provider offers application-specific passwords, mint one for
        this and not the mailbox's own password. That is a browser flow with
        no API, which is why this step is a person's.
      - Set all five as repository secrets on the private repository, under
        Settings → Secrets and variables → Actions → Secrets. Four of them are
        not secret in any real sense; they are set alongside the password
        because a partially-set transport is worse than an unset one.
      - Put the application password in the shared store.

  - id: video_channel
    stage: optional
    title: Where a recording is published
    actor: human
    does: >-
      Create the video channel with the organisation's address and record its
      identifier as a repository secret. The channel belongs to the
      organisation and not to a volunteer, which is also what makes the
      Board's publication gate mean anything.
    check: >-
      Run the configuration report: *Video channel* moves from `absent` to
      `production`.
    command: cd tools && uv run convener-check-config
    sets:
      - CONVENER_VIDEO_CHANNEL_ID
    integrations:
      - video_publishing
    walkthrough:
      - Create the channel with the address from the first stage, on whichever
        platform the series will publish to.
      - Copy its channel identifier from the channel's own settings.
      - Set it as a repository secret named `CONVENER_VIDEO_CHANNEL_ID` on the
        private repository, and put the channel's credentials in the shared
        store.

  - id: meeting_platform
    stage: optional
    title: The room the webinar happens in
    actor: human
    does: >-
      Create the meeting account with the organisation's address and set its
      current access token as a repository secret. This one is not a one-time
      value: the token expires and is renewed roughly monthly, which makes it
      a step of the event journey rather than a step of standing up.
    check: >-
      Run the configuration report: *Meeting platform* moves from `absent` to
      `production`.
    command: cd tools && uv run convener-check-config
    sets:
      - CONVENER_MEETING_API_TOKEN
    integrations:
      - meeting_provider
    walkthrough:
      - Create the account with the address from the first stage. A permanent
        room on one account is what the manual path already assumes, so this
        step is worth doing even if the token never is.
      - Find the current access token in the provider's own developer area and
        copy it. It is the token itself that is set here, not a client id and
        secret.
      - Set it as a repository secret named `CONVENER_MEETING_API_TOKEN` on the
        private repository.
      - Put the renewal in the calendar. An expired token falls back to the
        manual path, which is a working state, so nothing will interrupt to
        tell you it has lapsed.

# Every credential this sequence sets, where it belongs, and the menu path a
# person reaches it by. Names and homes only: no value is written here, and
# none ever may be -- not even one shaped like a real one.
#
# `kind` decides what `home` means. A repository kind names one of the two
# repositories above, and every one of them is the private repository: the
# public one holds no secret and no variable at all, because nothing runs in
# it. A worker kind names the directory the worker deploys from. The two
# `VITE_` variables and the relay URL are variables rather than secrets by
# construction rather than by choice -- each ships inside the browser bundle,
# so calling one a secret would only hide it from the people maintaining it.
#
# A name appears more than once when one value is set in more than one place,
# which is a real shape here rather than a slip: `TALLY_WEBHOOK_SECRET` is
# read by the form itself, by the worker that verifies the signature, and
# again by the workflow on arrival, and `CONVENER_DISPATCH_TOKEN` is two
# different tokens under one name on two different workers, deliberately not
# shared.
secrets:
  - name: VITRINE_DEPLOY_TOKEN
    kind: repository-secret
    home: cockpit
    set_through: >-
      Settings → Secrets and variables → Actions → Secrets → New repository
      secret
    why: >-
      Lets the two publishing workflows push the built showcase and the built
      cockpit into the public repository. Scoped to the public repository, not
      this one.
  - name: CLOUDFLARE_API_TOKEN
    kind: repository-secret
    home: cockpit
    set_through: >-
      Settings → Secrets and variables → Actions → Secrets → New repository
      secret
    why: >-
      Lets all three *Deploy* workflows deploy their worker. One token, one
      account, three workers.
  - name: VITE_AUTH_PROXY_URL
    kind: repository-variable
    home: cockpit
    set_through: >-
      Settings → Secrets and variables → Actions → Variables → New repository
      variable
    why: >-
      Where the cockpit sends a device-flow sign-in. Read only at build time,
      so setting it changes nothing until the application is rebuilt.
  - name: VITE_GITHUB_APP_CLIENT_ID
    kind: repository-variable
    home: cockpit
    set_through: >-
      Settings → Secrets and variables → Actions → Variables → New repository
      variable
    why: >-
      Which App the device flow is for. Public by construction: it ships in
      the bundle.
  - name: VITE_SIGNUP_RELAY_URL
    kind: repository-variable
    home: cockpit
    set_through: >-
      Settings → Secrets and variables → Actions → Variables → New repository
      variable
    why: >-
      Where a registration and a survey response are sent. Also read by the
      showcase's own content policy, so that the relay's origin is admitted
      only once one is configured.
  - name: CONVENER_DISPATCH_TOKEN
    kind: worker-secret
    home: services/form-relay
    set_through: >-
      Cloudflare dashboard → Workers & Pages → the form relay → Settings →
      Variables and Secrets → Add
    set_command: >-
      cd services/form-relay && npx wrangler secret put CONVENER_DISPATCH_TOKEN
    why: >-
      Lets the form relay turn a verified submission into a repository
      dispatch. Its own token, never the signup relay's.
  - name: TALLY_WEBHOOK_SECRET
    kind: worker-secret
    home: services/form-relay
    set_through: >-
      Cloudflare dashboard → Workers & Pages → the form relay → Settings →
      Variables and Secrets → Add
    set_command: >-
      cd services/form-relay && npx wrangler secret put TALLY_WEBHOOK_SECRET
    why: >-
      What the worker verifies a submission's signature against. Without it
      the worker refuses every request outright, which is the right failure
      for the one thing standing between this chain and the public internet.
  - name: TALLY_WEBHOOK_SECRET
    kind: repository-secret
    home: cockpit
    set_through: >-
      Settings → Secrets and variables → Actions → Secrets → New repository
      secret
    why: >-
      The same value again, checked a second time on arrival. Unset, that
      second check is skipped and any dispatch is accepted — an ordinary
      absent state, because the worker has already refused everything
      unsigned.
  - name: CONVENER_DISPATCH_TOKEN
    kind: worker-secret
    home: services/signup-relay
    set_through: >-
      Cloudflare dashboard → Workers & Pages → the signup relay → Settings →
      Variables and Secrets → Add
    set_command: >-
      cd services/signup-relay && npx wrangler secret put CONVENER_DISPATCH_TOKEN
    why: >-
      Lets the signup relay read an event's published key, check the survey
      switch, and send the dispatch. A separate token from the form relay's,
      so that the two workers do not share one hourly budget.
  - name: CONVENER_RETENTION_TOKEN
    kind: repository-secret
    home: cockpit
    set_through: >-
      Settings → Secrets and variables → Actions → Secrets → New repository
      secret
    why: >-
      The only credential here that can delete a repository secret, which is
      what destroying an event's key means.
  - name: CONVENER_SIGNING_KEY
    kind: repository-secret
    home: cockpit
    set_through: >-
      Settings → Secrets and variables → Actions → Secrets → New repository
      secret
    why: >-
      The private half of the certificate signing key. Pasted straight from
      the terminal that generated it, and held nowhere else.
  - name: CONVENER_MATCHING_SALT
    kind: repository-secret
    home: cockpit
    set_through: >-
      Settings → Secrets and variables → Actions → Secrets → New repository
      secret
    why: >-
      Salts a participant's matching code and the certificate register's
      fingerprint. Two derivations, one value, never rotated.
  - name: CONVENER_NOTIFY_THREAD
    kind: repository-secret
    home: cockpit
    set_through: >-
      Settings → Secrets and variables → Actions → Secrets → New repository
      secret
    why: >-
      The issue number the Board's digest is posted on. Not a secret in any
      real sense; it lives here because it is set the same way its companion
      is.
  - name: CONVENER_NOTIFY_MENTION
    kind: repository-secret
    home: cockpit
    set_through: >-
      Settings → Secrets and variables → Actions → Secrets → New repository
      secret
    why: >-
      The team handle a digest addresses. A team, never a person — the channel
      has to keep working when any one volunteer stops reading.
  - name: CONVENER_SMTP_HOST
    kind: repository-secret
    home: cockpit
    set_through: >-
      Settings → Secrets and variables → Actions → Secrets → New repository
      secret
    why: The mail server the organisation's mailbox is sent through.
  - name: CONVENER_SMTP_PORT
    kind: repository-secret
    home: cockpit
    set_through: >-
      Settings → Secrets and variables → Actions → Secrets → New repository
      secret
    why: >-
      Which port, and by consequence which of the two transport layers is
      used. There is no separate switch.
  - name: CONVENER_SMTP_USER
    kind: repository-secret
    home: cockpit
    set_through: >-
      Settings → Secrets and variables → Actions → Secrets → New repository
      secret
    why: The account the mail is sent as.
  - name: CONVENER_SMTP_PASSWORD
    kind: repository-secret
    home: cockpit
    set_through: >-
      Settings → Secrets and variables → Actions → Secrets → New repository
      secret
    why: >-
      Its password, or the application-specific password minted for this
      alone. The one value of the five that genuinely is a secret.
  - name: CONVENER_SMTP_FROM
    kind: repository-secret
    home: cockpit
    set_through: >-
      Settings → Secrets and variables → Actions → Secrets → New repository
      secret
    why: The address a participant sees a message arrive from.
  - name: CONVENER_VIDEO_CHANNEL_ID
    kind: repository-secret
    home: cockpit
    set_through: >-
      Settings → Secrets and variables → Actions → Secrets → New repository
      secret
    why: Which channel a recording is published to.
  - name: CONVENER_MEETING_API_TOKEN
    kind: repository-secret
    home: cockpit
    set_through: >-
      Settings → Secrets and variables → Actions → Secrets → New repository
      secret
    why: >-
      The meeting provider's current access token. Renewed roughly monthly,
      which makes it the one value here that is not set once.
  - name: TALLY_API_KEY
    kind: operator-shell
    home: the operator's own machine
    set_through: >-
      Not set anywhere at all — passed in the environment of the one command
      that builds the public form, and never committed, never a repository
      secret and never read by continuous integration.
    why: >-
      Lets the build script create and update the public proposal form. It is
      in this list because it is a credential somebody has to hold and store,
      not because anything here reads it.

# Secrets that exist and are deliberately not part of standing an instance
# up. Each one is here so that a row added to `config/integrations.yml` has
# to be decided about rather than quietly left out of the sequence: the
# binding test refuses an integration secret that is neither set by a step
# above nor named here.
not_at_setup:
  - secret: CONVENER_EVENT_KEY_<ID>
    reason: >-
      One per event, not one per instance. The pair is generated when an event
      opens for registration, its public half is committed first so that the
      registration page can encrypt, and the private half is deleted at the
      end of that event's retention window — which is the destruction this
      whole project is built around. Setting one at standing-up time would
      mean naming an event that does not exist yet.
