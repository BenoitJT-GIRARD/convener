site_name: TEC Monthly Reading Group — Handbook
site_description: Operating handbook for The Example Collective Monthly Reading Group
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.action.edit
    - search.suggest
    - toc.follow

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Start here:
      - Overview: start-here/index.md
      - Glossary: start-here/glossary.md
      - Your first webinar: start-here/first-webinar.md
  - Workflow:
      - Overview: workflow/overview.md
      - 1 · Sourcing & selection: workflow/1-sourcing-selection.md
      - 2 · Preparation (T-minus runbook): workflow/2-preparation.md
      - 3 · Hosting day: workflow/3-hosting.md
      - 4 · After the webinar: workflow/4-after.md
  - Checklists:
      - Day-of (DO-CONFIRM): checklists/day-of.md
      - Post-event: checklists/post-event.md
  - Roles & ownership: roles.md
  - Templates:
      - Overview: templates/index.md
      - Email · Invitation: templates/emails/invitation.md
      - Email · Talk details: templates/emails/talk-details.md
      - Email · Zoom request: templates/emails/zoom-request.md
      - Email · Reminder: templates/emails/reminder.md
      - Email · Thank-you: templates/emails/thank-you.md
      - Email · Registration confirmation: templates/emails/registration-confirmation.md
      - Email · Decision (declined): templates/emails/decision-declined.md
      - Email · Decision (parked): templates/emails/decision-parked.md
      - Email · Outreach sourcing: templates/emails/outreach-sourcing.md
      - Forum post · Announce: templates/forum-post-announce.md
      - Forum post · Summary: templates/forum-post-summary.md
      - LinkedIn post: templates/linkedin-post.md
      - Intro scripts: templates/intro-scripts.md
  - Governance:
      - Editorial line: governance/editorial-line.md
      - Editorial Board: governance/editorial-board.md
      - Selection criteria: governance/selection-criteria.md
      - Conflict of interest: governance/conflict-of-interest.md
      - Decision log: governance/decisions.md
  - Reference:
      - Tools & access: reference/tools.md
      - Contacts: reference/contacts.md
