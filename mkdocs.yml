site_name: TEC Monthly Reading Group — Handbook
site_description: Operating handbook for The Example Collective Monthly Reading Group
repo_url: https://github.com/example-instance/workshop-series
repo_name: example-instance/workshop-series
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.action.edit
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  font:
    text: Archivo
    code: JetBrains Mono

hooks:
  - .github/scripts/mkdocs_hook.py

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Team app: team-app.md
  - Start here:
      - Overview: start-here/index.md
      - Roles: roles.md
      - Glossary: start-here/glossary.md
      - Your first webinar: start-here/first-webinar.md
  - Workflow:
      - Overview: workflow/overview.md
      - 1 · Finding & validating speakers: workflow/1-sourcing-selection.md
      - 2 · Preparing the webinar: workflow/2-preparation.md
      - 3 · Hosting day: workflow/3-hosting.md
      - 4 · After the webinar: workflow/4-after.md
  - Templates:
      - Overview: toolkit/index.md
      - Emails:
          - Invitation: toolkit/emails/invitation.md
          - Talk details: toolkit/emails/talk-details.md
          - Zoom request: toolkit/emails/zoom-request.md
          - Reminder: toolkit/emails/reminder.md
          - Thank-you: toolkit/emails/thank-you.md
          - Registration confirmation: toolkit/emails/registration-confirmation.md
          - Decision (declined): toolkit/emails/decision-declined.md
          - Decision (parked): toolkit/emails/decision-parked.md
          - Outreach sourcing: toolkit/emails/outreach-sourcing.md
      - Posts & scripts:
          - Forum announcement: toolkit/forum-post-announce.md
          - Forum summary: toolkit/forum-post-summary.md
          - LinkedIn post: toolkit/linkedin-post.md
          - Intro scripts: toolkit/intro-scripts.md
  - Governance:
      - Editorial line: governance/editorial-line.md
      - The Editorial Board: governance/editorial-board.md
      - How we validate speakers: governance/selection-criteria.md
      - Conflicts of interest: governance/conflict-of-interest.md
      - Decision log: governance/decisions.md
  - Reference:
      - Tools & access: reference/tools.md
      - Contacts: reference/contacts.md
