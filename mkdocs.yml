site_name: TEC Monthly Reading Group — Handbook
site_description: Operating handbook for The Example Collective Monthly Reading Group
repo_url: https://github.com/example-instance/workshop-series
repo_name: example-instance/workshop-series
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.action.edit
    - search.suggest
    - toc.follow

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Start here:
      - Overview: start-here/index.md
      - Glossary: start-here/glossary.md
      - Your first webinar: start-here/first-webinar.md
  - Workflow:
      - Overview: workflow/overview.md
      - 1 · Sourcing & selection: workflow/1-sourcing-selection.md
      - 2 · Preparation (T-minus runbook): workflow/2-preparation.md
      - 3 · Hosting day: workflow/3-hosting.md
      - 4 · After the webinar: workflow/4-after.md
  - Checklists:
      - Day-of (DO-CONFIRM): checklists/day-of.md
      - Post-event: checklists/post-event.md
  - Roles & ownership: roles.md
  - Templates:
      - Overview: toolkit/index.md
      - Email · Invitation: toolkit/emails/invitation.md
      - Email · Talk details: toolkit/emails/talk-details.md
      - Email · Zoom request: toolkit/emails/zoom-request.md
      - Email · Reminder: toolkit/emails/reminder.md
      - Email · Thank-you: toolkit/emails/thank-you.md
      - Email · Registration confirmation: toolkit/emails/registration-confirmation.md
      - Email · Decision (declined): toolkit/emails/decision-declined.md
      - Email · Decision (parked): toolkit/emails/decision-parked.md
      - Email · Outreach sourcing: toolkit/emails/outreach-sourcing.md
      - Forum post · Announce: toolkit/forum-post-announce.md
      - Forum post · Summary: toolkit/forum-post-summary.md
      - LinkedIn post: toolkit/linkedin-post.md
      - Intro scripts: toolkit/intro-scripts.md
  - Governance:
      - Editorial line: governance/editorial-line.md
      - Editorial Board: governance/editorial-board.md
      - Selection criteria: governance/selection-criteria.md
      - Conflict of interest: governance/conflict-of-interest.md
      - Decision log: governance/decisions.md
  - Reference:
      - Tools & access: reference/tools.md
      - Contacts: reference/contacts.md
