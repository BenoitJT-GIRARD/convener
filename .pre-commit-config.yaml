repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=2048']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
        files: ^tools/
      - id: ruff-format
        files: ^tools/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.0.1
    hooks:
      - id: cspell
        # Every page this product writes in its own prose. The
        # authority is cspell.json's own `files` list, which CI reads
        # and test_prose_language.py holds against what is tracked at
        # the root; this hook is the local convenience beside it.
        files: '^(docs|instances|README|INFORMATION-ARCHITECTURE|TRADEMARK|SECURITY|CONTRIBUTING).*\.md$'
