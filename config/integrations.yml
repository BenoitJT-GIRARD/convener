# Every external dependency the *application code* (tools/convener_ops and
# app/src) reads at runtime, and what happens without it. Absent is a normal
# state for most of them: the feature degrades visibly, nothing breaks --
# with three exceptions, event_keys, retention_token and
# certificate_fingerprint below, each of which declares
# `absent_is_normal: false` rather than relying on its absent_behaviour text
# alone: a boolean `convener-check-config` can act on, not only a paragraph a
# reader might skip.
#
# That sentence read "with one exception, event_keys" for a long time,
# by which point two more rows had declared themselves the same way -- true
# when it was written, and quietly false afterwards. The rows themselves
# were pinned as data all along (test_integrations.py::test_exactly_these_
# three_rows_declare_themselves_an_exception); what nothing read was the
# count in this paragraph, which is exactly why nothing noticed. It is read
# now, by test_integrations.py::test_this_declarations_own_header_names_
# every_exception, which fails naming the row a fourth exception would add.
# tools/convener_ops/integrations.py carried the same wrong sentence in its
# module docstring and in Integration.absent_is_normal's own comment. All
# three are corrected.
#
# This deliberately excludes secrets that only CI ever reads (a workflow
# step's `env:`, never something convener-check-config's own process sees) --
# TALLY_WEBHOOK_SECRET, VITRINE_DEPLOY_TOKEN, CLOUDFLARE_API_TOKEN. Declaring
# them here would make `convener-check-config` report them permanently "absent"
# on every machine that isn't the CI runner, which is noise, not
# information. They are documented instead in docs/reference/operations.md,
# with what each is for and where it is set.
#
# event_keys is deliberately not excluded by that same reasoning, even
# though it is also per-event and CI-only in practice: its absence is not
# ordinary noise the way the three above are, and burying it in the
# CI-only-secrets section of the handbook would make it too easy to miss.
# See tools/convener_ops/eventkeys.py for the reason its absence is not a normal
# state at all.
#
# signing_key is CI-only too (CONVENER_SIGNING_KEY, read only inside the job
# that issues a certificate) and, despite sitting right next to event_keys
# and sharing its cryptographic-key shape, its own absence *is*
# ordinary D-13 noise: no certificate is issued, nothing else happens, and
# nothing personal is at risk the way an undecryptable registration would
# be. It earns its own row rather than living only in
# docs/reference/operations.md for the same reason matching_salt does,
# below: "is CONVENER_SIGNING_KEY actually set" is a structural fact
# convener-check-config and its tests can see, not only a sentence a future edit
# could silently stop being true under. See tools/convener_ops/signing.py for
# why this key's lifecycle -- and therefore its absent_is_normal value --
# runs opposite to event_keys'.
#
# matching_salt is CI-only too, and is two
# rows sharing one secret rather than one row describing two behaviours in
# prose.
# CONVENER_MATCHING_SALT has two independent consumers with two different shapes
# of absence: registration.py::matching_code's own absence *is* ordinary
# noise -- a documented, working fallback cascade -- and nothing
# there needs to fail closed over it; certificate.py::fingerprint
# reads the same secret for a second, unrelated derivation (the certificate
# register's salted fingerprint) whose absence is *not* ordinary -- see the
# certificate_fingerprint row's own absent_behaviour below, and
# tools/convener_ops/certificate.py for the reasoning in full. A single row could
# only carry `absent_is_normal` once, so it necessarily lied about whichever
# consumer disagreed with that one value -- `convener-check-config` reported this
# secret as ordinary D-13 noise even after certificate.py made half of its
# absence a fail-closed requirement, and test_integrations.py actively
# enforced that the row stay that way. A
# secret documented only in prose, as the three excluded above are, is a
# promise nothing checks -- and one row here had quietly become exactly
# that promise again for its second consumer). Two rows sharing one
# `secrets` entry -- nothing in `resolve_states` keys on secret uniqueness
# across rows -- makes both consumers' `absent_is_normal` a structural fact
# `convener-check-config` and its tests can see, not only a sentence a future
# edit could silently stop being true under.
# Product, as `config/boundary.yml` beside it also is -- this line read "the
# only file in `config/` that is" and had not been true since that
# declaration was written. Every row below is a
# mirror of a module under `tools/convener_ops/`: the secret names the code
# reads, and the degradation the code actually implements when they are
# unset. A duplicate cannot change a row here and have it mean anything --
# the behaviour it describes lives in Python, not in this file -- so
# changing one would be changing the product, which is the definition
# `config/boundary.yml` gives. What *is* the instance's is whether each
# secret is set, and that lives in the repository's own Actions secrets,
# never in a tracked file.
owner: product

integrations:
  - name: auth_proxy
    label: Authentication relay
    secrets:
      - VITE_AUTH_PROXY_URL
      - VITE_GITHUB_APP_CLIENT_ID
    absent_behaviour: >-
      Sign-in falls back to a personal access token. The team app stays fully
      usable; onboarding is simply slower.

  - name: signup_relay
    label: Registration relay
    secrets:
      - VITE_SIGNUP_RELAY_URL
    absent_behaviour: >-
      One variable with two consumers in app/src, and one row rather than
      two because -- unlike CONVENER_MATCHING_SALT below -- both consumers
      have the same shape of absence.
      app/src/islands/signup/SignupForm.tsx reads it for a registration and
      app/src/islands/survey/SurveyForm.tsx for a post-event response, the
      second posting to the same worker's own /survey route instead of a
      second deployment, so there is no second variable to declare. Neither
      island degrades before a participant meets it: the event page still
      fetches that event's published public key, still renders real fields,
      and the browser still encrypts what was typed under that key. The
      absence is met at submit -- after the encryption, before any request --
      so the form reports "Registration is not open for this event yet" (the
      survey: "Submitting answers is not available yet"), the typed fields
      are left exactly as typed for a later attempt, and nothing at all
      leaves the browser. It never falls back to sending anything in the
      clear, and there is nothing queued behind it: a registration attempted
      while this is unset is a registration that was never made, and the
      participant is told so rather than left to assume otherwise. Ordinary
      D-13 in shape, and the widest of these rows in reach -- every
      registration this project takes passes through this one address. The
      worker's own dispatch credential (CONVENER_DISPATCH_TOKEN) is
      deliberately not a second secret here: it is a Wrangler secret held by
      the deployed worker, never a name any code in this repository reads,
      and declaring it would report it permanently absent everywhere, which
      is the noise the three CI-only secrets are excluded for above.
      site/src/_data/csp.js reads this same variable at build time to admit
      the relay's origin into the showcase's connect-src and omits it when
      unset, so the policy and the islands agree by construction rather than
      by a second decision.

  - name: meeting_provider
    label: Meeting platform
    secrets:
      - CONVENER_MEETING_API_TOKEN
    absent_behaviour: >-
      The manual adapter (tools/convener_ops/platform.py::ManualPlatform) is used.
      The room and recording links are typed by hand into instance/data/speakers.yml's
      existing zoom_link and youtube_url, join instructions into
      instance/data/config.yml's instructions (one value for the whole series -- the
      account is the permanent room), and attendance is imported from
      instance/data/events/<id>/attendance-import.csv, a file that is never committed.
      No room link is published automatically, and no recording storage is
      managed on our side. Once set, tools/convener_ops/platform_fcc.py::PlatformFCC
      is used instead (selected by platform_fcc.py::platform_from_env, D-13):
      real per-person attendance is read from the provider's own calls
      endpoint -- undocumented by the vendor, but verified empirically -- and
      the recording is reported and deleted through its own API instead of
      being tracked by hand. The value is the current access token itself,
      not a client id and secret; it expires and must be renewed roughly
      monthly, a step of the event journey rather than a one-time secret --
      see docs/reference/operations.md's "Meeting platform" section.

  - name: email_transport
    label: Outbound email
    secrets:
      - CONVENER_SMTP_HOST
      - CONVENER_SMTP_PORT
      - CONVENER_SMTP_USER
      - CONVENER_SMTP_PASSWORD
      - CONVENER_SMTP_FROM
    absent_behaviour: >-
      Three consumers, all reported rather than retained -- none ever
      prints a composed message, sent or not,
      and none writes one to a file or a build artefact either.
      tools/convener_ops/confirmation.py: the registration
      confirmation, carrying a participant's address and matching code,
      used to be written to a local, .gitignore'd file and uploaded as a
      short-retention build artefact instead of being sent -- removed once
      docs/governance/traitement-donnees.md's own Recipients section
      turned out to call that artefact a documented exception, when with
      this row absent (this project's default state) it was the path
      every registration took, not an exception. Every attempt is folded
      into a bare sent/not-sent count instead, and convener-resend-confirmation
      reproduces the identical message from the stored registration and
      the same deterministic matching code, so nothing is ever the only
      copy of anything. tools/convener_ops/delivery.py: the
      certificate document this row would carry is never written
      anywhere at all, not even to a private artefact, from the day this
      module was written -- see that module's own docstring for why a
      signed, nominative document must never land in any Actions surface,
      a stricter constraint than the registration confirmation was held to
      at first. tools/convener_ops/survey_invite.py:
      the post-event survey invitation, reusing confirmation.py's own
      transport rather than a third copy of it, degrades the same
      bare-count way delivery.py does -- and for a related but distinct
      reason: a survey invitation carries no identifier at all to keep an
      unsent copy filed against, unlike a certificate, which at least has
      a public one.

  - name: video_publishing
    label: Video channel
    secrets:
      - CONVENER_VIDEO_CHANNEL_ID
    absent_behaviour: >-
      Recording URLs are entered by hand after publishing. No upload is
      attempted.

  - name: board_notifications
    label: Board notifications
    secrets:
      - CONVENER_NOTIFY_THREAD
      - CONVENER_NOTIFY_MENTION
    absent_behaviour: >-
      Nothing is sent. The digest and the immediate events are still composed
      and printed to the job log, where any volunteer can read them, but they
      are addressed to nobody: a message needs both a thread to be posted on
      and a team to mention, and without them no postable message is
      constructed at all. Both are needed because a thread with no mention
      posts into a page nobody is watching, and a mention with no thread has
      nowhere to be written.

  - name: event_keys
    label: Event registration encryption
    secrets:
      - CONVENER_EVENT_KEY_<ID>
    absent_is_normal: false
    absent_behaviour: >-
      Unlike every other row here, this is not a normal state to degrade out
      of. CONVENER_EVENT_KEY_<ID> is set once per event -- <ID> stands for the
      event's own identifier, never a literal name -- so this row reports
      absent everywhere, on every day no event's secret happens to be named
      exactly that; its real check is per event, inside the job that
      decrypts that event's registrations. Without the matching private key
      that job fails closed and exits in error: it does not fall back to
      writing personal data to disk unencrypted. See
      tools/convener_ops/eventkeys.py for the reasoning.

  - name: retention_token
    label: Retention sweep credential
    secrets:
      - CONVENER_RETENTION_TOKEN
    absent_is_normal: false
    absent_behaviour: >-
      The third exception to D-13, and the strongest one in this
      project. Destroying an event's key means deleting a repository
      secret, which the default GITHUB_TOKEN cannot do no matter what
      permissions: a workflow grants it -- this needs a fine-grained
      personal access token, scoped to this repository, with the
      Secrets permission set to read and write and nothing else. Unlike
      every other row here, and unlike CONVENER_EVENT_KEY_<ID> above, this
      absence is loud on every single scheduled run, whether or not any
      event is actually due for destruction that day: a retention job
      that exits 0 having destroyed nothing must never look, from the
      Actions tab, identical to one that genuinely had nothing to do --
      a promise with legal weight deserves a red job every day until the
      credential is set, not a quiet skip. See
      tools/convener_ops/cli.py::retention_sweep and
      docs/reference/operations.md, 'Retention and early erasure'.

  - name: signing_key
    label: Certificate signing key
    secrets:
      - CONVENER_SIGNING_KEY
    absent_behaviour: >-
      No certificate is issued in this run. The job that would sign one
      (tools/convener_ops/certificate.py) cannot, and does not fall
      back to anything -- there is no partially-written document, and
      nothing sensitive is exposed by the absence, because signing attests
      rather than conceals: unlike CONVENER_EVENT_KEY_<ID> above, there is no
      confidentiality risk this row exists to prevent. This is an ordinary
      D-13 absence, the same shape as video_publishing's "entered by hand"
      or board_notifications' "printed instead of sent" -- a feature that
      degrades, not a failure this repository fails closed over. Unlike
      CONVENER_EVENT_KEY_<ID>, there is exactly one of these at a time (not one
      per event), and it is never destroyed: see tools/convener_ops/signing.py
      for why a certificate signing key's lifecycle runs opposite to an
      event key's.

  - name: matching_salt
    label: Registration matching salt
    secrets:
      - CONVENER_MATCHING_SALT
    absent_behaviour: >-
      tools/convener_ops/registration.py::matching_code returns nothing: no
      matching code is derived, printed, or put in the confirmation email.
      Attendance falls back to its own cascade -- exact address,
      then normalised name -- instead of the typed code. convener-match-
      attendance's own unmatched-attendance.md
      degrades the same way: with no salt, no salted record
      identifier can be computed for an unmatched connection or a tied
      candidate either, so the host's list falls back to naming each entry
      by its own position in the run instead. An ordinary D-13 absence: the
      salt exists so the code and the report cannot be forged,
      guessed or reversed by anyone who knows an address, not so a job can
      refuse to run without it, and every fallback it degrades to is
      documented and working, never personal data landing somewhere it
      should not. The same secret has a second, unrelated consumer with a
      different, non-ordinary shape of absence -- see the
      certificate_fingerprint row below, which declares that difference
      structurally rather than in this row's own prose.

  - name: certificate_fingerprint
    label: Certificate register fingerprint
    secrets:
      - CONVENER_MATCHING_SALT
    absent_is_normal: false
    absent_behaviour: >-
      tools/convener_ops/certificate.py::fingerprint reads the same
      CONVENER_MATCHING_SALT as the matching_salt row above, for a second,
      domain-separated purpose: the certificate register's own salted trace
      of an address. Here the absence is *not* ordinary: a fingerprint that
      cannot be salted cannot be written to a register that must never
      carry an address in the clear, so convener-issue-certificates and
      convener-reissue-certificate issue nothing this run rather than write one
      unsafely. Outwardly this still degrades the same way as an ordinary
      absence (a printed line, a clean exit, nothing partially written) --
      only the reason differs, named in each job's own message. This is one
      of this project's rare exceptions to D-13's "an absent integration is
      a normal state": an absent secret here forbids writing, it does not
      license writing insecurely.
