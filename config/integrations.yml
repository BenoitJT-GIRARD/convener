# Every external dependency the *application code* (tools/convener_ops and
# app/src) reads at runtime, and what happens without it. Absent is a normal
# state: the feature degrades visibly, nothing breaks -- with one exception,
# event_keys below, whose absent_behaviour says so explicitly.
#
# This deliberately excludes secrets that only CI ever reads (a workflow
# step's `env:`, never something convener-check-config's own process sees) --
# TALLY_WEBHOOK_SECRET, VITRINE_DEPLOY_TOKEN, CLOUDFLARE_API_TOKEN. Declaring
# them here would make `convener-check-config` report them permanently "absent"
# on every machine that isn't the CI runner, which is noise, not
# information. They are documented instead in docs/reference/operations.md,
# with what each is for and where it is set.
#
# event_keys is deliberately not excluded by that same reasoning, even
# though it is also per-event and CI-only in practice: its absence is not
# ordinary noise the way the three above are, and burying it in the
# CI-only-secrets section of the handbook would make it too easy to miss.
# See tools/convener_ops/eventkeys.py for the reason its absence is not a normal
# state at all.
integrations:
  - name: auth_proxy
    label: Authentication relay
    secrets:
      - VITE_AUTH_PROXY_URL
      - VITE_GITHUB_APP_CLIENT_ID
    absent_behaviour: >-
      Sign-in falls back to a personal access token. The team app stays fully
      usable; onboarding is simply slower.

  - name: meeting_provider
    label: Meeting platform
    secrets:
      - CONVENER_MEETING_API_TOKEN
    absent_behaviour: >-
      The manual adapter is used: room links are typed by hand and attendance
      is imported from a file. No room link is published automatically.

  - name: email_transport
    label: Outbound email
    secrets:
      - CONVENER_SMTP_HOST
      - CONVENER_SMTP_PORT
      - CONVENER_SMTP_USER
      - CONVENER_SMTP_PASSWORD
      - CONVENER_SMTP_FROM
    absent_behaviour: >-
      Outbound messages are written to an inspectable log instead of being
      sent, and the interface says so. Nothing is silently dropped.

  - name: video_publishing
    label: Video channel
    secrets:
      - CONVENER_VIDEO_CHANNEL_ID
    absent_behaviour: >-
      Recording URLs are entered by hand after publishing. No upload is
      attempted.

  - name: board_notifications
    label: Board notifications
    secrets:
      - CONVENER_NOTIFY_THREAD
      - CONVENER_NOTIFY_MENTION
    absent_behaviour: >-
      Nothing is sent. The digest and the immediate events are still composed
      and printed to the job log, where any volunteer can read them, but they
      are addressed to nobody: a message needs both a thread to be posted on
      and a team to mention, and without them no postable message is
      constructed at all. Both are needed because a thread with no mention
      posts into a page nobody is watching, and a mention with no thread has
      nowhere to be written.

  - name: event_keys
    label: Event registration encryption
    secrets:
      - CONVENER_EVENT_KEY_<ID>
    absent_behaviour: >-
      Unlike every other row here, this is not a normal state to degrade out
      of. CONVENER_EVENT_KEY_<ID> is set once per event -- <ID> stands for the
      event's own identifier, never a literal name -- so this row reports
      absent everywhere, on every day no event's secret happens to be named
      exactly that; its real check is per event, inside the job that
      decrypts that event's registrations. Without the matching private key
      that job fails closed and exits in error: it does not fall back to
      writing personal data to disk unencrypted. See
      tools/convener_ops/eventkeys.py for the reasoning.
