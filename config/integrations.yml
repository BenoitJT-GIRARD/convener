# Every external dependency the *application code* (tools/convener_ops and
# app/src) reads at runtime, and what happens without it. Absent is a normal
# state: the feature degrades visibly, nothing breaks -- with one exception,
# event_keys below, which declares `absent_is_normal: false` rather than
# relying on its absent_behaviour text alone: a boolean `convener-check-config`
# can act on, not only a paragraph a reader might skip.
#
# This deliberately excludes secrets that only CI ever reads (a workflow
# step's `env:`, never something convener-check-config's own process sees) --
# TALLY_WEBHOOK_SECRET, VITRINE_DEPLOY_TOKEN, CLOUDFLARE_API_TOKEN. Declaring
# them here would make `convener-check-config` report them permanently "absent"
# on every machine that isn't the CI runner, which is noise, not
# information. They are documented instead in docs/reference/operations.md,
# with what each is for and where it is set.
#
# event_keys is deliberately not excluded by that same reasoning, even
# though it is also per-event and CI-only in practice: its absence is not
# ordinary noise the way the three above are, and burying it in the
# CI-only-secrets section of the handbook would make it too easy to miss.
# See tools/convener_ops/eventkeys.py for the reason its absence is not a normal
# state at all.
#
# signing_key is CI-only too (CONVENER_SIGNING_KEY, read only inside the job
# that issues a certificate) and, despite sitting right next to event_keys
# and sharing its "phase 4 cryptographic key" shape, its own absence *is*
# ordinary D-13 noise: no certificate is issued, nothing else happens, and
# nothing personal is at risk the way an undecryptable registration would
# be. It earns its own row rather than living only in
# docs/reference/operations.md for the same reason matching_salt does,
# below: "is CONVENER_SIGNING_KEY actually set" is a structural fact
# convener-check-config and its tests can see, not only a sentence a future edit
# could silently stop being true under. See tools/convener_ops/signing.py for
# why this key's lifecycle -- and therefore its absent_is_normal value --
# runs opposite to event_keys'.
#
# matching_salt is CI-only too, and unlike event_keys its own absence *is*
# ordinary noise -- registration.py::matching_code has a documented,
# working fallback (S:5's cascade) and nothing here needs to fail closed
# over it. It earns a row anyway, for a narrower reason than event_keys':
# a secret documented only in prose (as the three excluded above are) is a
# promise nothing checks, and the requirement this secret exists to satisfy
# is precisely that the matching code's salt must never quietly become a
# hard-coded constant. Declaring it here makes "is this actually a secret,
# not a literal" a structural fact `convener-check-config` and its tests can
# see, not only a sentence a future edit could silently stop being true
# under.
integrations:
  - name: auth_proxy
    label: Authentication relay
    secrets:
      - VITE_AUTH_PROXY_URL
      - VITE_GITHUB_APP_CLIENT_ID
    absent_behaviour: >-
      Sign-in falls back to a personal access token. The team app stays fully
      usable; onboarding is simply slower.

  - name: meeting_provider
    label: Meeting platform
    secrets:
      - CONVENER_MEETING_API_TOKEN
    absent_behaviour: >-
      The manual adapter (tools/convener_ops/platform.py::ManualPlatform) is used.
      The room and recording links are typed by hand into data/speakers.yml's
      existing zoom_link and youtube_url, join instructions into
      data/config.yml's instructions (one value for the whole series -- the
      account is the permanent room), and attendance is imported from
      data/events/<id>/attendance-import.csv, a file that is never committed.
      No room link is published automatically, and no recording storage is
      managed on our side. Once set, tools/convener_ops/platform_fcc.py::PlatformFCC
      is used instead (selected by platform_fcc.py::platform_from_env, D-13):
      real per-person attendance is read from the provider's own calls
      endpoint -- undocumented by the vendor, but verified empirically -- and
      the recording is reported and deleted through its own API instead of
      being tracked by hand. The value is the current access token itself,
      not a client id and secret; it expires and must be renewed roughly
      monthly, a step of the event journey rather than a one-time secret --
      see docs/reference/operations.md's "Meeting platform" section.

  - name: email_transport
    label: Outbound email
    secrets:
      - CONVENER_SMTP_HOST
      - CONVENER_SMTP_PORT
      - CONVENER_SMTP_USER
      - CONVENER_SMTP_PASSWORD
      - CONVENER_SMTP_FROM
    absent_behaviour: >-
      Outbound messages are composed and kept for inspection instead of
      being sent, and the interface says so. Nothing is silently dropped --
      but "kept for inspection" does not mean the job's own stdout here,
      the way it does for board_notifications below. The one message this
      row's absence affects that carries personal data is the registration
      confirmation (task 7): every copy of it names a participant's address
      and their matching code, and printing either into a GitHub Actions
      log would write them somewhere this project never puts personal
      data, on purpose, for as long as the log is retained. So
      tools/convener_ops/confirmation.py never prints a composed message, sent
      or not; a message that could not be sent is written to a single
      local, .gitignore'd file inside the job's own workspace instead, and
      .github/workflows/registration.yml uploads that file as a short-
      retention, access-controlled build artefact when it exists, which is
      what "inspectable" means for this row specifically. Fourteen days,
      not longer for safety's own sake: a resend reproduces the identical
      message from the stored registration and the same deterministic
      matching code, so nothing here is ever the only copy of anything.

  - name: video_publishing
    label: Video channel
    secrets:
      - CONVENER_VIDEO_CHANNEL_ID
    absent_behaviour: >-
      Recording URLs are entered by hand after publishing. No upload is
      attempted.

  - name: board_notifications
    label: Board notifications
    secrets:
      - CONVENER_NOTIFY_THREAD
      - CONVENER_NOTIFY_MENTION
    absent_behaviour: >-
      Nothing is sent. The digest and the immediate events are still composed
      and printed to the job log, where any volunteer can read them, but they
      are addressed to nobody: a message needs both a thread to be posted on
      and a team to mention, and without them no postable message is
      constructed at all. Both are needed because a thread with no mention
      posts into a page nobody is watching, and a mention with no thread has
      nowhere to be written.

  - name: event_keys
    label: Event registration encryption
    secrets:
      - CONVENER_EVENT_KEY_<ID>
    absent_is_normal: false
    absent_behaviour: >-
      Unlike every other row here, this is not a normal state to degrade out
      of. CONVENER_EVENT_KEY_<ID> is set once per event -- <ID> stands for the
      event's own identifier, never a literal name -- so this row reports
      absent everywhere, on every day no event's secret happens to be named
      exactly that; its real check is per event, inside the job that
      decrypts that event's registrations. Without the matching private key
      that job fails closed and exits in error: it does not fall back to
      writing personal data to disk unencrypted. See
      tools/convener_ops/eventkeys.py for the reasoning.

  - name: signing_key
    label: Certificate signing key
    secrets:
      - CONVENER_SIGNING_KEY
    absent_behaviour: >-
      No certificate is issued in this run. The job that would sign one
      (tools/convener_ops/certificate.py, task 12/14) cannot, and does not fall
      back to anything -- there is no partially-written document, and
      nothing sensitive is exposed by the absence, because signing attests
      rather than conceals: unlike CONVENER_EVENT_KEY_<ID> above, there is no
      confidentiality risk this row exists to prevent. This is an ordinary
      D-13 absence, the same shape as video_publishing's "entered by hand"
      or board_notifications' "printed instead of sent" -- a feature that
      degrades, not a failure this repository fails closed over. Unlike
      CONVENER_EVENT_KEY_<ID>, there is exactly one of these at a time (not one
      per event), and it is never destroyed: see tools/convener_ops/signing.py
      for why a certificate signing key's lifecycle runs opposite to an
      event key's.

  - name: matching_salt
    label: Registration matching salt
    secrets:
      - CONVENER_MATCHING_SALT
    absent_behaviour: >-
      tools/convener_ops/registration.py::matching_code returns nothing: no
      matching code is derived, printed, or put in the confirmation email
      (task 7). Attendance falls back to task 8's cascade -- exact address,
      then normalised name -- instead of the typed code. Unlike
      CONVENER_EVENT_KEY_<ID> above, this row is an ordinary D-13 absence: the
      salt exists so the code cannot be forged or guessed by anyone who
      knows an address, not so a job can refuse to run without it, and the
      cascade it degrades to is a documented, working fallback rather than
      personal data landing somewhere it should not.
