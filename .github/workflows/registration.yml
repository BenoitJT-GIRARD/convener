name: Handle registration

on:
  repository_dispatch:
    types: [registration-submitted]

# Two registrations landing at once is the ordinary case here -- every
# submission dispatches its own run, with no batching -- not an edge case
# to shrug off. `queue: single`, this workflow's implicit default without
# this block, keeps only the most recently *queued* run and cancels any
# others still waiting behind whichever run is already in progress: three
# submissions arriving while one is being processed would silently cancel
# two of them, not merely delay them. `queue: max`
# (docs.github.com/en/actions/using-jobs/using-concurrency, checked
# 2026-08-20 -- "Up to 100 jobs or workflow runs can be pending in the
# concurrency group") queues up to 100 pending runs instead of 1 -- not
# "none dropped" without limit, as an earlier version of this comment
# claimed: the same page continues "When the queue is full, any additional
# runs are canceled." At the relay's own per-event burst limiter (30/minute,
# services/signup-relay/README.md) and roughly a minute per run end to end,
# a sustained blast against one hot event can approach that ceiling within
# several minutes -- this does not remove the limit, it only stops one such
# event from starving every other event's queue too, which is why the group
# is scoped per event below rather than left global. `cancel-in-progress`
# stays false, its own default: it cannot combine with `queue: max` by
# GitHub's own validation, and a run mid-decrypt must finish, never be cut
# off mid-write.
concurrency:
  group: registration-${{ fromJSON(github.event.client_payload.body).event_id }}
  cancel-in-progress: false
  queue: max

jobs:
  handle:
    runs-on: ubuntu-latest
    # A serialised queue (above) means one run that never finishes blocks
    # every other registration for the same event behind it, up to
    # GitHub's own six-hour default. Ten minutes is generous for a job that
    # is checkout, `uv sync`, one decrypt/re-encrypt/commit, and -- once
    # that has landed (`if: success()` below) -- one more decrypt and one
    # send attempt. See the retry loop below for the one part of this job
    # with any real variance, bounded at three attempts.
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # Read once, used twice: by `actions/checkout` below (so this job
      # reads the branch *tip*, not the commit `repository_dispatch`
      # pinned `github.sha` to at the moment the event was created -- with
      # `queue: max` genuinely serialising runs, a later run in the same
      # group starts only after an earlier one has already pushed, and
      # checking out a fixed SHA would read the tree from *before* that
      # push, silently reverting it) and by the retry loop, so the two can
      # never name different branches.
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.5.x'
          # H3 (2026-08-23 security audit): the useful question was not
          # "limit harder" -- 30 requests/minute and 500 total per event
          # are already the relay's own advertised, deliberately generous
          # limits (services/signup-relay/README.md) -- but "what should
          # one accepted dispatch cost". At roughly a minute per run
          # (this file's own concurrency comment) and PER_EVENT_CEILING's
          # own 500, a sustained blast against one public event stayed
          # entirely within those limits while still spending close to a
          # quarter of the monthly 2,000-minute budget on one event. This
          # does not change what a run does, only how much of `uv sync`'s
          # own dependency install it has to redo: cached and keyed on
          # tools/uv.lock, restored in seconds instead of resolved and
          # downloaded fresh on every one of those runs.
          enable-cache: true
      - name: Resolve the event's key secret
        id: resolve
        working-directory: tools
        env:
          # services/signup-relay forwards the browser's whole POST body,
          # byte for byte, as client_payload.body -- see
          # convener_ops.registration.to_registration's own docstring for why
          # this step and the next both read it whole rather than
          # stripping event_id out of it first. Set as env, never inlined
          # into `run:`, so this attacker-reachable text is never
          # substituted into a shell script -- the same discipline
          # candidate-form.yml already applies to PROPOSAL_PAYLOAD.
          REGISTRATION_PAYLOAD: ${{ github.event.client_payload.body }}
        run: uv run convener-registration-secret-name
      - name: Decrypt, store and commit the registration
        id: handle
        env:
          REGISTRATION_PAYLOAD: ${{ github.event.client_payload.body }}
          # GitHub Actions can only select a secret through an expression
          # evaluated in the workflow file itself, never from inside a
          # running step -- so the *name* to look up here is the previous
          # step's own output, not something this step computes. Resolves
          # to an empty string, not an error, when no secret by that name
          # is set; convener-handle-registration treats that exactly like
          # eventkeys.py's own "absent is not a normal D-13 state here"
          # exception and exits in error rather than doing anything with
          # the ciphertext it was handed.
          EVENT_PRIVATE_KEY: ${{ secrets[steps.resolve.outputs.secret_name] }}
          EVENT_ID: ${{ steps.resolve.outputs.event_id }}
        # A hung `set -e` script with no output can look like it is still
        # working; every branch below prints something before it exits, so
        # a run's own log always says which of "nothing to do", "saved" or
        # "gave up" happened.
        #
        # The retry, on a rejected push, is a fetch-and-reset-hard followed
        # by *re-running the handler*, not `git pull --rebase`. Rebasing a
        # JSON array is the defect this replaces: two concurrent writers'
        # hunks both rewrite the closing lines of `registrations.enc`'s
        # array, the rebase conflicts, `git pull --rebase` returns 1, and
        # `set -e` kills the step before the retry loop's own `::error::`
        # line is ever reached -- the record is gone and the tree is left
        # mid-rebase. Discarding the local commit and re-deriving instead
        # is safe specifically because `convener_ops.registration.upsert` is
        # idempotent on the same address: re-running against the tip
        # someone else just pushed reproduces this registration's own
        # entry (fresh ciphertext, since AES-GCM never reuses a key or
        # nonce, but the same logical content) beside whatever that other
        # push added, rather than merging two conflicting edits to one
        # array by hand.
        run: |
          set -e
          git config user.name "convener-registration"
          git config user.email "convener-registration@users.noreply.github.com"

          for attempt in 1 2 3; do
            (cd tools && uv run convener-handle-registration)
            git add "data/events/$EVENT_ID/registrations.enc"
            if git diff --staged --quiet; then
              echo "no change to commit"
              exit 0
            fi
            git commit -m "data: record a registration for $EVENT_ID"
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- re-deriving against the latest $TARGET_BRANCH and retrying"
            git fetch origin "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"
          done
          echo "::error::push failed after 3 attempts -- this registration was not saved"
          exit 1
      - name: Send the registration confirmation
        # `if: success()` -- the default for a step with no `if:` at all,
        # spelled out here because what it buys is the point of this step
        # existing on its own (review round 1, Important 2): the step
        # above retries on a rejected push, so a step that both stored and
        # sent would send once per attempt, and could send a confirmation
        # for a registration a later, failed attempt then discarded. This
        # step runs at most once, and only once the record has actually
        # landed on the branch.
        if: success()
        working-directory: tools
        env:
          # The workflow already holds both of these for the step above;
          # re-reading them here needs no new secret. See
          # `convener_ops.cli.send_confirmation`'s own docstring for why
          # re-decrypting is correct, not wasted work.
          REGISTRATION_PAYLOAD: ${{ github.event.client_payload.body }}
          EVENT_PRIVATE_KEY: ${{ secrets[steps.resolve.outputs.secret_name] }}
          # The R-9 diff `convener-handle-registration` already worked out --
          # field labels, never values, so this is not personal data
          # travelling through a build log's own output mechanism.
          CHANGED_FIELDS: ${{ steps.handle.outputs.changed }}
          # `email_transport` (config/integrations.yml) and
          # `matching_salt`: absent here is D-13's ordinary state, handled
          # by `convener-send-confirmation` itself -- see
          # `tools/convener_ops/confirmation.py`'s module docstring.
          CONVENER_MATCHING_SALT: ${{ secrets.CONVENER_MATCHING_SALT }}
          # Fix round 1, M1: `_send_confirmation` calls `platform_from_env`
          # to resolve the room link (`confirmation.event_details`) --
          # without this, an FCC-configured event silently falls back to
          # the manual `zoom_link` for the confirmation's own room link
          # even though the API-resolved room is available everywhere
          # else. Absent here is ordinary D-13, same as everywhere else
          # this token is read.
          CONVENER_MEETING_API_TOKEN: ${{ secrets.CONVENER_MEETING_API_TOKEN }}
          CONVENER_SMTP_HOST: ${{ secrets.CONVENER_SMTP_HOST }}
          CONVENER_SMTP_PORT: ${{ secrets.CONVENER_SMTP_PORT }}
          CONVENER_SMTP_USER: ${{ secrets.CONVENER_SMTP_USER }}
          CONVENER_SMTP_PASSWORD: ${{ secrets.CONVENER_SMTP_PASSWORD }}
          CONVENER_SMTP_FROM: ${{ secrets.CONVENER_SMTP_FROM }}
        run: uv run convener-send-confirmation
