# Tell the board what moved, without any external service (D-07).
#
# The platform is the whole delivery mechanism: this workflow posts a comment
# on a repository thread and mentions the editorial team, and GitHub is what
# turns that into email for everyone watching. No mail provider, no webhook,
# no subscription, and nothing tied to one volunteer's account -- the mention
# is a *team*, so the channel keeps working when any individual stops reading.
#
# How "unconfigured sends nothing" works here
# -------------------------------------------
# There is no on/off switch in this file. `convener-notify-*` composes the message
# and then asks `notify.dispatch` for an address; without both
# CONVENER_NOTIFY_THREAD and CONVENER_NOTIFY_MENTION there is no address, so no postable
# message is built and `notify-body.md` is never written. The Post step looks
# for that file and finds nothing. A quiet day and an unconfigured repository
# therefore reach exactly the same end, which is what stops the absent case
# from turning into an error path somebody later "fixes" with a default.
#
# Today, with no secrets set, both jobs run green and post nothing, and the
# composed text is visible in the job log for anyone who wants to check what
# the channel would have said.

name: Notify the board

on:
  push:
    branches: [main]
    paths:
      - 'data/speakers.yml'
  schedule:
    # 06:00 UTC: after *Sweep elapsed events* (05:00) has written whatever
    # transitions the night produced, so the digest reports the same day the
    # sweep just recorded rather than lagging it by twenty-four hours.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  # Spec section 7 reserves this for what calls for a quick reaction: a lead
  # from the public form, a vote reaching its threshold, an objection on a
  # publication. Everything else waits for the digest.
  immediate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Minor 2 (fix round 1, task 16): closes the project-wide gap
    # test_workflows.py::test_every_job_declares_a_timeout now guards.
    timeout-minutes: 10
    permissions:
      # Read-only, and only so actions/checkout can fetch the repository.
      contents: read
      # The one thing this workflow is allowed to do to the outside world.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole history. The immediate events are a difference between
          # two revisions of data/speakers.yml -- the working tree's and the
          # one the branch was at before this push -- and a push carrying
          # several commits moved the branch by more than one, so the parent
          # of HEAD is not that revision. With the revision unreachable the
          # tool says nothing rather than reading the whole file as new.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.5.x'
      - name: Compose
        working-directory: tools
        env:
          CONVENER_NOTIFY_THREAD: ${{ secrets.CONVENER_NOTIFY_THREAD }}
          CONVENER_NOTIFY_MENTION: ${{ secrets.CONVENER_NOTIFY_MENTION }}
          # Where the branch was before this push, so every commit it carried
          # is covered rather than only the last. The all-zero name GitHub
          # sends for a branch's first push falls back to the parent of HEAD.
          BEFORE: ${{ github.event.before }}
        run: uv run convener-notify-immediate
      - name: Post
        if: hashFiles('notify-body.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          THREAD: ${{ secrets.CONVENER_NOTIFY_THREAD }}
        run: gh issue comment "$THREAD" --body-file notify-body.md

  digest:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.5.x'
      - name: Compose
        working-directory: tools
        env:
          CONVENER_NOTIFY_THREAD: ${{ secrets.CONVENER_NOTIFY_THREAD }}
          CONVENER_NOTIFY_MENTION: ${{ secrets.CONVENER_NOTIFY_MENTION }}
        run: uv run convener-notify-digest
      - name: Post
        # No file means the day was quiet, or no channel is configured. Both
        # are ordinary, and both post nothing.
        if: hashFiles('notify-body.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          THREAD: ${{ secrets.CONVENER_NOTIFY_THREAD }}
        run: gh issue comment "$THREAD" --body-file notify-body.md
