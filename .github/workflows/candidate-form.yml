name: Handle proposal

on:
  repository_dispatch:
    types: [proposal-submitted]

# C4 (2026-08-23 security audit): this workflow had no concurrency block at
# all, so two proposals landing at once could each read data/speakers.yml,
# append their own lead, and race the "Commit" step's own `git pull
# --rebase` below -- L2 of the same audit already names that rebase as a
# real, if low-frequency, defect and defers fixing it; serialising runs
# here removes the race that would otherwise trigger it, whichever comes
# first. One shared group, not one per submitter: unlike the certificate
# workflows or registration.yml, there is no per-submission identifier
# safe to key on here (a submitter names no id at all, and the form's own
# secret binds every call to the same one repository_dispatch type) --
# every run touches the same file, so every run must queue behind the
# last, the same "queue: max" reasoning registration.yml's own comment
# gives for its per-event group, applied globally because there is only
# one queue here to have.
concurrency:
  group: candidate-form
  cancel-in-progress: false
  queue: max

jobs:
  handle:
    runs-on: ubuntu-latest
    # Minor 2 (fix round 1, task 16): no job in this repository declared
    # timeout-minutes before this sweep -- see test_workflows.py's own
    # test_every_job_declares_a_timeout for the guard this closes.
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.5.x'
      - name: Process payload
        working-directory: tools
        env:
          # The relay (services/form-relay) sends client_payload as exactly
          # {"body": <raw Tally body>, "signature": <base64 signature>}. What
          # is verified below must be identical to what Tally signed, so the
          # raw body is passed through untouched -- never the whole
          # client_payload, which would include this very signature field and
          # so could never verify against itself. Set as env, not inlined
          # into `run:`, so untrusted payload text is never substituted into
          # the shell script.
          PROPOSAL_PAYLOAD: ${{ github.event.client_payload.body }}
          PROPOSAL_SIGNATURE: ${{ github.event.client_payload.signature }}
          TALLY_WEBHOOK_SECRET: ${{ secrets.TALLY_WEBHOOK_SECRET }}
        run: uv run convener-handle-proposal
      - name: Commit
        run: |
          set -e
          git config user.name "convener-form"
          git config user.email "convener-form@users.noreply.github.com"
          git add data/speakers.yml
          if git diff --staged --quiet; then
            echo "no new lead"
            exit 0
          fi
          git commit -m "data: new lead from public form"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- rebasing onto latest and retrying"
            git pull --rebase
          done
          echo "::error::push failed after 3 attempts -- this lead was not saved"
          exit 1
