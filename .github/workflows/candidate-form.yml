name: Handle proposal

on:
  repository_dispatch:
    types: [proposal-submitted]

# This workflow had no concurrency block at
# all, so two proposals landing at once could each read instance/data/speakers.yml,
# append their own lead, and race the "Commit" step's own `git pull
# --rebase`. That rebase was a real, if low-frequency, defect, known and
# left unfixed for a while.
#
# Both are closed together here, and not with a
# concurrency group. `actionlint` (2026-08-24) found the `queue: max` this
# block used to carry is not a valid `concurrency` key at all, and what a
# `group` plus `cancel-in-progress: false` leaves behind cancels a
# *waiting* run rather than queuing it -- a lost proposal, not a delayed
# one, for a workflow whose every run carries one submitter's own lead. A
# cancelled run never starts, so the retry loop below (fetch, reset
# --hard, re-run the handler) can never save it. This workflow stays
# ungrouped instead: the step below re-derives on a rejected push rather
# than rebasing, and `convener_ops.journey.proposal.skip_reason` already refuses a
# duplicate submission by email -- re-running the handler against
# whatever another run just pushed is safe on its own, with nothing to
# queue behind.
jobs:
  handle:
    runs-on: ubuntu-latest
    # No job in this repository declared
    # timeout-minutes at all once -- see test_workflows.py's own
    # test_every_job_declares_a_timeout for the guard that closed it.
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # Read once, used twice -- see registration.yml's own comment for
      # why the retry loop below must re-derive against the branch *tip*,
      # never the (possibly stale) commit this run's own checkout started
      # from.
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.5.x'
          # Caches uv's own download/resolve step, keyed on tools/uv.lock --
          # part of holding this project's self-inflicted Actions-minute
          # cost down. Reduces run time only; changes nothing this job
          # checks.
          enable-cache: true
      - name: Process and commit the proposal
        env:
          # The relay (services/form-relay) sends client_payload as exactly
          # {"body": <raw Tally body>, "signature": <base64 signature>}. What
          # is verified below must be identical to what Tally signed, so the
          # raw body is passed through untouched -- never the whole
          # client_payload, which would include this very signature field and
          # so could never verify against itself. Set as env, not inlined
          # into `run:`, so untrusted payload text is never substituted into
          # the shell script.
          PROPOSAL_PAYLOAD: ${{ github.event.client_payload.body }}
          PROPOSAL_SIGNATURE: ${{ github.event.client_payload.signature }}
          TALLY_WEBHOOK_SECRET: ${{ secrets.TALLY_WEBHOOK_SECRET }}
        # The retry, on a rejected push, is a fetch-and-reset-hard followed
        # by *re-running the handler* (`uv run convener-handle-proposal`), not
        # `git pull --rebase` -- see registration.yml's own comment for why
        # replaying a diff over instance/data/speakers.yml's own array conflicts
        # instead of applying. Re-running is safe specifically because
        # `convener_ops.journey.proposal.skip_reason` refuses a submission whose email
        # already matches an existing `lead`: re-running against the tip
        # someone else just pushed reproduces this proposal's own new
        # entry beside whatever that other push added, never a duplicate.
        run: |
          set -e
          git config user.name "convener-form"
          git config user.email "convener-form@users.noreply.github.com"

          for attempt in 1 2 3; do
            (cd tools && uv run convener-handle-proposal)
            git add instance/data/speakers.yml
            if git diff --staged --quiet; then
              echo "no new lead"
              exit 0
            fi
            git commit -m "data: new lead from public form"
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- re-deriving against the latest $TARGET_BRANCH and retrying"
            git fetch origin "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"
          done
          echo "::error::push failed after 3 attempts -- this lead was not saved"
          exit 1
