name: Visuals

# Renders the announcement composition on a pinned engine
# and compares it against a versioned reference image, so a visual
# regression fails loudly in CI instead of shipping unnoticed.
# See `tools/visuals/render-and-compare.mjs`'s own module comment
# for the full argument: the comparison only means something because
# the engine that renders it is pinned by this repository's own lockfile,
# not whatever Chrome happens to be on the machine that runs it.
#
# Why a path filter, and why this exact list (D-25: a filter that silently
# omits a path means a real regression ships green, so every entry below
# names the thing that made it necessary -- read this before adding or
# removing one, and prefer adding a path you are unsure about over leaving
# it out):
#
# - `tools/convener_ops/publication/visual.py` -- the composition itself (the HTML/CSS
#   `render_announcement` builds) and `FIXTURE_ANNOUNCEMENT`, the fixed
#   identity the reference images are rendered from.
# - `tools/convener_ops/publication/motifs/**` -- the registry a charter names
#   a drawing through, and each family's own path; painted last, on top of
#   everything else.
# - `tools/convener_ops/publication/registration_code.py` -- the QR code generator;
#   its own pixels are part of every rendered format.
# - `tools/convener_ops/publication/formats.py` -- the three named canvas sizes and
#   the registration-slot geometry it shares with `visual.py`.
# - `tools/convener_ops/governance/rule.py` -- `PARIS`, the one `ZoneInfo` the date
#   line's own text is computed from (`visual.paris_standing_start`); a
#   change here can change what the date line reads without touching
#   `visual.py` itself.
# - `tools/convener_ops/cli/publication.py` -- `render_visual_fixtures` lives here (that
#   module's own docstring: "the only module that touches the disk"), so a
#   bug in how the three pages are actually written to disk is a real way
#   this check could start comparing the wrong thing -- accepted even
#   though this is a large file most of whose other commands have nothing
#   to do with rendering, because a path filter has no finer grain than a
#   file, and the alternative is silently not re-checking the one function
#   in it this job depends on.
# - `examples/the-example-collective/instance/config.json` -- the declaration the
#   fixture is rendered from. The composition reads
#   one: the wordmark band is `identity.forum_host`, the hero band is
#   `identity.strapline`, and two of the three "what to expect" rows name
#   the forum. Editing any of those changes every rendered pixel of the
#   top third of the poster, so leaving this out of the filter would let
#   exactly the change this job exists to catch ship without the job
#   running at all.
#
#   The *example's* declaration, and not `instance/config.json`:
#   the committed reference images used to be a frozen
#   photograph of whichever instance ran this repository -- its palette,
#   its ribbon, its strapline, its wordmark, and its published address
#   inside the QR code -- sitting in `tools/visuals/`, which is the product's.
#   They are the example's now, and two things follow. The images carry no
#   real instance's identity, which is the byte-level half of a charter
#   staying with its instance; and this job stops going red for a
#   duplicate that has done nothing but choose its own colours, which it
#   did before, on the first push, against images of somebody else's
#   poster.
# - `tools/convener_ops/declaration/published.py` -- the reader that turns that file into
#   the values above, `forum_host` included (a derivation, not a declared
#   key). Same argument as `brand.py` two lines down: the file and the
#   reader of it are two ways for the same render to change.
# - `tools/convener_ops/journey/registration.py` -- `signup_url`, which is what the
#   registration QR encodes. Its modules are pixels this job compares like
#   any others, and they are the one part of the composition no text sweep
#   anywhere in this repository can read.
# - `examples/the-example-collective/instance/data/brand.json` -- the charter the fixture is
#   rendered from, reached through `tools/convener_ops/publication/brand.py` by
#   `visual.py`'s `_load_colours` and `brand.py`'s `motif`. The
#   example's, for the reason two entries up.
# - `tools/convener_ops/publication/brand.py` -- the reader itself: which charter is in
#   force, and which `motif` is drawn when that charter declares none.
# - `assets/brand/*/brand.json` -- every charter the product ships, as a glob and
#   not a list, for the reason `templates.yml`'s own filter is one. The
#   fixture reads none of them today: the example writes a complete
#   charter of its own, so `brand.py` answers with that and never reaches
#   `assets/brand/`. It reads one the moment the example's charter file goes away
#   or the example's declaration names a charter instead of writing one
#   (`published.CHARTER_KEY`, which exists since 2026-08-31). Both of
#   those files are already in this filter, so the commit that moves the
#   answer does run this job -- and then every later commit to the charter
#   it had begun rendering would not have, which is a real regression
#   shipping green off a filter that reads correct. A glob costs an
#   occasional run against a warm cache instead, and covers a charter
#   added under `assets/brand/` on the commit that adds it, with no entry to make
#   here.
#
# Deliberately absent, and a decision rather than an omission:
# `instance/config.json` and `instance/data/brand.json`, this instance's own
# declaration and charter, which this job does not render -- reacting to
# them would be running a comparison whose result cannot change. The
# glob two entries up does not weaken that: what it adds is every charter
# the *product* ships, each of which this fixture can come to render;
# what stays out is the one charter belonging to whoever runs this
# repository, which it cannot. That is the byte-level half of a charter
# staying with its instance, and it is what stopped this job going red
# for a duplicate that had done nothing but choose its own colours.
# `visuals-production.yml` carries both, and must: that job renders *real*
# editions, as this instance.
# - `assets/fonts/**` -- the self-hosted web fonts every rendered glyph comes from.
# - `tools/uv.lock` -- pins `segno` (the QR renderer) among everything
#   else Python depends on; a version bump there can change rendered
#   pixels without any file above changing. Accepted knowingly that this
#   also re-runs the check for an unrelated dev-tool bump elsewhere in the
#   same lock -- there is no finer-grained filter than the file, and an
#   occasional unnecessary run against a warm cache costs little next to
#   silently skipping the rare bump that does matter.
# - `tools/visuals/**` -- the render/compare script itself, its pinned
#   `puppeteer` version and lockfile, and the committed reference images:
#   changing any of these is exactly the case this job exists to exercise
#   (a deliberate `--update` of a reference is not verified until this job
#   has actually read it back).
# - `.github/workflows/visuals.yml` -- this file.
#
# Deliberately absent: `instance/data/speakers.yml`, the real per-edition data, and
# `tools/convener_ops/publication/public_data.py`, the module that gates it (`to_public`,
# `_gate_closed`, the consent check). `render_visual_fixtures` never
# reads any of the three -- this check renders one fixed, fictional
# fixture (Ada Lovelace, no photograph, `FIXTURE_ANNOUNCEMENT` built by
# hand) that never goes through `to_public` at all, so a change to real
# speaker data or to the gate that filters it has nothing for this job to
# see. `visuals-production.yml` is where the *production* pipeline (real
# editions, real portraits under consent) gets its own trigger, with
# `public_data.py` in its own path filter for exactly that reason
# (see that workflow's own comment); this one stays a pure regression
# check against a fixture that never changes on its own.
#
# example-cockpit is private (D-15): Actions minutes are metered, not
# unlimited the way a public repository's would be (2,000/month on the
# free plan). A path filter plus the `actions/cache` step below (keyed on
# `tools/visuals/package-lock.json`, restoring the ~430MB Chrome-for-Testing
# download `puppeteer` would otherwise re-fetch on every run) is what
# keeps a job this heavy affordable at zero cost -- do not "simplify" this
# away to a plain `on: push`, and do not drop the cache step because the
# job passes without it; both exist for the budget, not for tidiness.
on:
  push:
    branches: [main]
    # Written out again for `pull_request` below, not shared through a
    # YAML anchor and alias: GitHub Actions' own workflow parser does not
    # support them -- a long-standing, documented limitation of that
    # parser, not a version question. PyYAML expands `&anchor`/`*alias`
    # without complaint (every test in this repository that reads a
    # workflow's YAML goes through PyYAML), which is exactly why an
    # earlier version of this file, bound with `&visual_paths`/
    # `*visual_paths`, parsed clean in every local check and would still
    # have failed to *trigger* the very first time this workflow ran for
    # real -- no workflow in this repository has ever executed. The two
    # copies below are bound instead by
    # tools/tests/repository/test_visuals_workflow.py::
    # test_the_two_path_filters_are_identical_lists, which fails the
    # moment they drift apart -- if you are tempted to "simplify" this
    # back into an anchor, read that test first, and see
    # tools/tests/repository/test_workflows.py::test_no_workflow_uses_a_yaml_anchor_or_alias
    # for the sweep that refuses one anywhere else in this repository too.
    paths:
      - 'tools/convener_ops/publication/visual.py'
      - 'tools/convener_ops/publication/motifs/**'
      - 'tools/convener_ops/publication/registration_code.py'
      - 'tools/convener_ops/publication/formats.py'
      - 'tools/convener_ops/governance/rule.py'
      - 'tools/convener_ops/cli/publication.py'
      - 'examples/the-example-collective/instance/config.json'
      - 'tools/convener_ops/declaration/published.py'
      - 'tools/convener_ops/journey/registration.py'
      - 'examples/the-example-collective/instance/data/brand.json'
      - 'tools/convener_ops/publication/brand.py'
      - 'assets/brand/*/brand.json'
      - 'assets/fonts/**'
      - 'tools/uv.lock'
      - 'tools/visuals/**'
      - '.github/workflows/visuals.yml'
  pull_request:
    # Kept identical to push's own list above, by hand: GitHub Actions'
    # parser cannot resolve the anchor/alias that used to bind these (see
    # that list's own comment for the full reasoning). A mismatch here
    # fails test_the_two_path_filters_are_identical_lists in
    # tools/tests/repository/test_visuals_workflow.py.
    paths:
      - 'tools/convener_ops/publication/visual.py'
      - 'tools/convener_ops/publication/motifs/**'
      - 'tools/convener_ops/publication/registration_code.py'
      - 'tools/convener_ops/publication/formats.py'
      - 'tools/convener_ops/governance/rule.py'
      - 'tools/convener_ops/cli/publication.py'
      - 'examples/the-example-collective/instance/config.json'
      - 'tools/convener_ops/declaration/published.py'
      - 'tools/convener_ops/journey/registration.py'
      - 'examples/the-example-collective/instance/data/brand.json'
      - 'tools/convener_ops/publication/brand.py'
      - 'assets/brand/*/brand.json'
      - 'assets/fonts/**'
      - 'tools/uv.lock'
      - 'tools/visuals/**'
      - '.github/workflows/visuals.yml'

# A newer push to a pull request supersedes
# the commit an older run is still checking, so that run is cancelled --
# grouped by the source branch, `github.head_ref`. That field is empty
# for anything that is not a pull request, so a push to `main` falls
# through to `github.run_id`, which is unique per run: nothing else can
# join that group, so nothing can cancel it, and every commit reaching
# production stays verified for itself. See quality.yml's own copy of
# this block for the full reasoning, and why `github.ref` would be the
# wrong expression.
#
# This is easy to miss when counting the pull-request workflows by hand,
# and it pays a real browser download per superseded push -- the most
# expensive run of the six to leave running for nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  visuals:
    runs-on: ubuntu-latest
    # Render + compare alone measures under 5 seconds on a warm machine;
    # this allowance covers a cold cache miss
    # that has to fetch the ~430MB Chrome-for-Testing build besides.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.5.x'
      # `uv run` syncs the environment itself on first use (the same
      # one-step idiom `a11y.yml`'s own "Generate throw-away event keys"
      # step already relies on) -- no separate `uv sync` needed for a
      # job that only ever calls this one command.
      - name: Render the visual fixtures (pure Python/HTML, no browser yet)
        run: |
          uv run --project tools convener-render-visual-fixtures "${{ runner.temp }}/visual-fixtures"
      # Restored *before* `npm ci` so its own postinstall download
      # (`puppeteer`'s pinned Chrome-for-Testing build) can be skipped
      # entirely on a cache hit -- keyed on this package's own lockfile,
      # so a version bump changes the key and fetches the new build
      # exactly once.
      - name: Cache the pinned Chrome-for-Testing download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('tools/visuals/package-lock.json') }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # `.nvmrc` at the repository root, which every job here reads
          # the same way -- this one was the first on 22 while the rest
          # were still on 20, and a version named in a workflow is a
          # version a workflow can be left behind on
          # (tools/tests/repository/test_workflows.py::
          # test_every_workflow_reads_the_node_version_from_the_one_file).
          # What this package's isolation buys is unchanged and unrelated:
          # only this workflow and visuals-production.yml pay for the
          # bundled Chrome-for-Testing download, because only they install
          # `tools/visuals/`.
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: tools/visuals/package-lock.json
      - name: Install the pinned renderer
        working-directory: tools/visuals
        run: npm ci
      # Every surface with a lockfile
      # gets an audit in this same quality chain -- this package is a new
      # surface with a new lockfile, so it gets one too rather than
      # becoming the one exception.
      - name: Dependency audit
        working-directory: tools/visuals
        run: npm audit
      - name: Render and compare against the versioned references
        working-directory: tools/visuals
        run: |
          node render-and-compare.mjs \
            --fixtures "${{ runner.temp }}/visual-fixtures" \
            --actual "${{ runner.temp }}/visual-actual"
      # Only on a failing comparison -- see render-and-compare.mjs's own
      # reporting for the pixel-level detail already printed to the log;
      # this is for a human who wants to actually look at what rendered.
      - name: Upload the rendered images for inspection
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visuals-actual
          path: ${{ runner.temp }}/visual-actual
          retention-days: 14
