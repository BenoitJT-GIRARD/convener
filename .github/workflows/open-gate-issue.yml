name: Open gate issues

on:
  push:
    branches: [main]
    paths:
      - 'data/speakers.yml'
      - 'data/events.yml'
      - '.github/scripts/open_gate_issue.py'

permissions:
  issues: write
  contents: read

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pyyaml
      - run: python .github/scripts/open_gate_issue.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHITECT_USERNAME: ${{ vars.ARCHITECT_USERNAME }}
          APP_URL: ${{ vars.APP_URL }}
