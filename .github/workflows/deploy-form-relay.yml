name: Deploy form relay

on:
  push:
    branches: [main]
    paths:
      - 'services/form-relay/**'
      - '.github/workflows/deploy-form-relay.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Every job in this repository declares a ceiling --
    # test_workflows.py::test_every_job_declares_a_timeout guards that.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: services/form-relay/package-lock.json
      - name: Install
        working-directory: services/form-relay
        run: npm ci
      - name: Test
        working-directory: services/form-relay
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: services/form-relay/package-lock.json
      # For the one derivation the Deploy step below makes. The relay's own
      # tests need no Python at all.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.5.x'
      - name: Check whether the integration is configured
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN not set - form relay deploy skipped. This is a normal state until the Cloudflare account is connected."
          elif grep -q "REPLACE_WITH_" services/form-relay/wrangler.toml; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "services/form-relay/wrangler.toml still has a placeholder id - form relay deploy skipped until the KV namespace is created and its id filled in. See services/form-relay/README.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: steps.gate.outputs.configured == 'true'
        working-directory: services/form-relay
        run: npm ci
      - name: Deploy
        if: steps.gate.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          # The one repository this worker dispatches into.
          # `services/form-relay/src/index.js` names no repository at all --
          # see `services/form-relay/wrangler.toml`'s header for why the
          # literal that used to be there is gone -- so it is derived here,
          # from `instance/config.json`, through the Python reader that
          # owns the derivation (`published.Identity.repository`). The same
          # `uv run --project tools python -c` shape `deploy.yml` already
          # uses for the repository it pushes a built site into, rather
          # than a second parser written in shell.
          repository="$(uv run --project tools python -c \
            'from convener_ops.declaration.published import load_identity; print(load_identity().repository)')"
          if [ -z "$repository" ]; then
            echo "::error::instance/config.json yielded no repository - refusing to deploy a relay that would dispatch nowhere"
            exit 1
          fi
          # --var reaches src/index.js as env.REPOSITORY exactly as a
          # [vars] entry would, and wrangler clears every var it is not
          # given, so this deploy leaves the worker holding this one and
          # nothing a previous deploy set.
          cd services/form-relay
          npx wrangler deploy --var "REPOSITORY:$repository"
