name: Security

# Considered for a path filter alongside
# a11y.yml and preview.yml, and deliberately left unfiltered on `push` and
# `pull_request` -- stated here rather than by omission. The `secrets`
# job (gitleaks) exists to catch a real secret pasted into *any* file, not
# only one whose type or directory usually carries code. This project's
# earlier secret sweep already relied on hand-picked patterns and named
# its own limit; a path
# filter narrowing which pushes even get scanned would be a second,
# broader version of the same limit, self-inflicted this time. A stray
# credential pasted into a documentation file is exactly the shape this
# job is for, and no filter list can name "wherever a human might paste
# one next". The `codeql` job's own weekly schedule (below) is
# unaffected either way -- `schedule:` triggers ignore `paths:` entirely,
# so this is a trade-off about the `push`/`pull_request` runs only, not
# about the scheduled sweep, whose cost this file already carries either
# way.
on:
  push:
    branches: [main]
    # A write under these paths is data, and this workflow checks code.
    #
    # Measured on the instance this product was derived for, on 2026-09-13:
    # one volunteer walking the runbook for two seminars made 53 commits in
    # 47 minutes, each of them a write to `instance/data/speakers.yml`, and
    # each of them woke nine workflows. The account's whole monthly
    # allowance -- 2000 minutes, the GitHub Free ceiling for a private
    # repository -- was gone before the session ended.
    #
    # This workflow was 51 of the 1175 billed minutes, all of it in the
    # `secrets` job: the CodeQL jobs below skip themselves on a private
    # repository, so what a data write actually bought here was a secret
    # scan of source nothing had touched.
    #
    # The handful of tests that genuinely read the shipped `instance/`
    # tree are marked `shipped_data` and run by `validate-data.yml`, which
    # already watches these very paths. Which tests those are was measured
    # rather than assumed: three plausible hand-edits to the shipped
    # `speakers.yml`, the whole suite run after each, and exactly one test
    # noticed. `tools/tests/repository/test_shipped_data_marker.py` holds
    # both halves -- that the marker covers every such test, and that this
    # list still excludes them here.
    #
    # `paths-ignore:`, never `paths:`. A run is skipped only when *every*
    # changed file matches, so a commit touching code and data still runs
    # this in full; and a path forgotten from this list merely runs a check
    # that did not have to run, where a path forgotten from a `paths:` list
    # would skip one that did. For a workflow whose *absence* is the
    # defect, that is the only safe direction -- the same argument
    # `deploy.yml`'s own trigger spends twenty lines on.
    paths-ignore:
      - 'instance/data/**'
      - 'instance/public-data/**'
      - 'instance/keys/**'
  # Not narrowed on a pull request, deliberately -- see quality.yml.
  pull_request:
  schedule:
    - cron: '0 4 * * 1'

# A newer push to a pull request supersedes
# the commit an older run is still checking, so that run is cancelled --
# grouped by the source branch, `github.head_ref`. That field is empty
# for anything that is not a pull request, so a push to `main` falls
# through to `github.run_id`, which is unique per run: nothing else can
# join that group, so nothing can cancel it, and every commit reaching
# production stays verified for itself. See quality.yml's own copy of
# this block for the full reasoning, and why `github.ref` would be the
# wrong expression.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    # Every job in this repository declares a ceiling --
    # test_workflows.py::test_every_job_declares_a_timeout guards that.
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks version
      - name: Scan for secrets
        run: ./gitleaks git -v --exit-code 1

  codeql:
    # Code scanning is free on a public repository and needs GitHub Advanced
    # Security on a private one. An instance's cockpit is private by D-15 and
    # its account is the free tier `declarations/standing-up.yml` declares
    # this project is designed for, so in a duplicate `analyze` cannot upload
    # a result: it ends "Resource not accessible by integration" and this
    # workflow's own conclusion is failure from the duplicate's first commit
    # onwards.
    #
    # That is what this condition is for, and it is not about tidiness. The
    # `secrets` job above runs in this same workflow, and it is the one that
    # catches a credential pasted into a repository holding participants'
    # records. A workflow that has been red since its first commit for a
    # reason nobody can fix is a workflow nobody reads -- including on the
    # day gitleaks finds something real. A red that never means anything is
    # worse than no check at all.
    #
    # Upstream is public, so this leaves CodeQL running exactly where it can
    # run, and stops it exactly where it cannot.
    #
    # Written as "not private" rather than "is public", because the two
    # differ exactly where this cannot be measured before the fact: a
    # `schedule:` run carries its own event payload, and a condition that
    # reads a field missing from it would be false. `== 'public'` would
    # then take the Monday sweep off a public repository silently and for
    # good -- the failure this repository calls a check that cannot fail --
    # while "not private" fails the other way, loudly, in a duplicate, once,
    # where somebody can see it and say so.
    if: github.event.repository.visibility != 'private'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
