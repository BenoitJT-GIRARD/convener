name: Security

# H4 (2026-08-23 security audit): considered for a path filter alongside
# a11y.yml and preview.yml, and deliberately left unfiltered on `push` and
# `pull_request` -- stated here rather than by omission. The `secrets`
# job (gitleaks) exists to catch a real secret pasted into *any* file, not
# only one whose type or directory usually carries code -- S-9 of the
# audit's own spec is explicit that this project's prior secret sweep
# already relied on hand-picked patterns and named its own limit; a path
# filter narrowing which pushes even get scanned would be a second,
# broader version of the same limit, self-inflicted this time. A stray
# credential pasted into a documentation file is exactly the shape this
# job is for, and no filter list can name "wherever a human might paste
# one next". The `codeql` job's own weekly schedule (below) is
# unaffected either way -- `schedule:` triggers ignore `paths:` entirely,
# so this is a trade-off about the `push`/`pull_request` runs only, not
# about the scheduled sweep this file already carries in H4's own
# scheduled-cost figure.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'

jobs:
  secrets:
    runs-on: ubuntu-latest
    # Minor 2 (fix round 1, task 16): closes the project-wide gap
    # test_workflows.py::test_every_job_declares_a_timeout now guards.
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks version
      - name: Scan for secrets
        run: ./gitleaks git -v --exit-code 1

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
