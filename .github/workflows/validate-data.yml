name: Validate data

on:
  push:
    paths:
      - 'data/**.yml'
      - 'tools/**'
      - '.github/workflows/validate-data.yml'
  pull_request:
    paths:
      - 'data/**.yml'
      - 'tools/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.5.x'
      - name: Validate
        working-directory: tools
        run: uv run convener-validate
