name: Validate data

on:
  push:
    # `main` only. Without a branch filter, a
    # push to a branch with an open pull request fires this workflow
    # twice -- once for `push`, once for `pull_request` -- on the same
    # commit, the same tree and the same command, and the second run can
    # only ever agree with the first.
    #
    # What that costs, named rather than left to be discovered: a push to
    # a branch with *no* pull request open is no longer validated the
    # moment it lands. It is validated when the pull request opens, which
    # is before anything it carries can reach `main` -- the coverage that
    # actually gates the merge is untouched.
    branches: [main]
    paths:
      - 'data/**.yml'
      - 'tools/**'
      - '.github/workflows/validate-data.yml'
  pull_request:
    paths:
      - 'data/**.yml'
      - 'tools/**'

# A newer push to a pull request supersedes
# the commit an older run is still checking, so that run is cancelled --
# grouped by the source branch, `github.head_ref`. That field is empty
# for anything that is not a pull request, so a push to `main` falls
# through to `github.run_id`, which is unique per run: nothing else can
# join that group, so nothing can cancel it, and every commit reaching
# production stays verified for itself. See quality.yml's own copy of
# this block for the full reasoning, and why `github.ref` would be the
# wrong expression.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # Every job in this repository declares a ceiling --
    # test_workflows.py::test_every_job_declares_a_timeout guards that.
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.5.x'
          # Caches uv's own download/resolve step, keyed on tools/uv.lock --
          # part of holding this project's self-inflicted Actions-minute
          # cost down. Reduces run time only; changes nothing this job
          # checks.
          enable-cache: true
      - name: Validate
        working-directory: tools
        run: uv run convener-validate
