name: Accessibility

# AA conformance, verified
# automatically on every push, and by a manual keyboard pass this
# workflow cannot replace (tab order, field labels, how an error message
# is announced -- none of which a checker can see).
#
# This job builds the real showcase -- both the statically generated
# pages (`site/`) and the two islands mounted on them
# (`app/dist/islands/signup`, `app/dist/islands/verify`) -- and sweeps
# every page axe-core (Deque's rule engine, MIT-licensed, no account, no
# third-party call at run time) can reach in a real, JavaScript-executing
# browser. D-26: checked at the address and in the topology it will
# actually be served at (`instance/config.json`'s own published path
# prefix, read by the checker itself), never a bare `localhost` root
# -- see `site/scripts/check-a11y.mjs`'s own module comment for the full
# reasoning, including why the two islands are covered here at all
# rather than left entirely to the manual pass (a checker that only ever
# saw the server-rendered HTML would report them empty and pass -- D-25).
# This workflow was unfiltered once, and paid
# a full site+app build and a real Chrome-driven axe-core
# sweep on every push and every pull request, including one touching only
# `docs/`, `instance/data/`, or an unrelated relay -- none of which this check can
# possibly have anything to say about. Path-filtered now, the same
# deliberate, path-by-path discipline `visuals.yml`'s own header comment
# already applies (D-25: a filter that silently omits a path means a real
# accessibility regression ships green, so read that comment's own
# reasoning before adding or removing an entry here, and prefer including
# a path you are unsure about over leaving it out):
#
# - `site/**` -- every template and page this check builds and sweeps.
# - `app/**` -- both islands (`app/dist/islands/signup`,
#   `app/dist/islands/verify`) this check mounts on the built pages.
# - `tools/convener_ops/**` -- the "Generate throw-away event keys" step below
#   runs `convener_ops.journey.eventkeys.generate()` (imported through `paths.py`, and
#   transitively whatever that module itself imports); a path filter has
#   no finer grain than "the package", so the whole package is watched
#   rather than the two files this step names directly.
# - `tools/pyproject.toml`, `tools/uv.lock` -- what that same step's own
#   `uv run --project tools` resolves and installs.
# - `.github/workflows/a11y.yml` -- this file.
#
# Deliberately absent: `instance/data/speakers.yml` and every other real,
# per-edition data file -- this check builds from `site/src/_data/
# events.json`, a committed fixture (site/README.md), and never reads real
# event data at all, the same reasoning `quality.yml`'s own `site` job
# already relies on for its identical fixture-based build.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      # Both builds resolve their published
      # address from here, and D-26 is about checking at the address
      # a build is actually served under.
      - 'instance/config.json'
      - 'app/**'
      - 'tools/convener_ops/**'
      - 'tools/pyproject.toml'
      - 'tools/uv.lock'
      - '.github/workflows/a11y.yml'
  pull_request:
    # Kept identical to push's own list above, by hand: GitHub Actions'
    # workflow parser does not support YAML anchors or aliases (a
    # documented limitation, not a version question) -- see
    # visuals.yml's own header comment for how this was discovered
    # the hard way, and test_the_two_path_filters_are_identical_lists
    # in tools/tests/test_path_filters.py for what actually holds these
    # two copies together.
    paths:
      - 'site/**'
      # Both builds resolve their published
      # address from here, and D-26 is about checking at the address
      # a build is actually served under.
      - 'instance/config.json'
      - 'app/**'
      - 'tools/convener_ops/**'
      - 'tools/pyproject.toml'
      - 'tools/uv.lock'
      - '.github/workflows/a11y.yml'

# A newer push to a pull request supersedes
# the commit an older run is still checking, so that run is cancelled --
# grouped by the source branch, `github.head_ref`. That field is empty
# for anything that is not a pull request, so a push to `main` falls
# through to `github.run_id`, which is unique per run: nothing else can
# join that group, so nothing can cancel it, and every commit reaching
# production stays verified for itself. See quality.yml's own copy of
# this block for the full reasoning, and why `github.ref` would be the
# wrong expression.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  a11y:
    runs-on: ubuntu-latest
    # Building both site/ and app/, then rendering 14 pages at two
    # viewports each in a real browser, comfortably fits inside the same
    # 15-minute allowance publish-showcase.yml's own mixed Python/Node job
    # already gets for a lighter build.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.5.x'
          # Caches uv's own download/resolve step, keyed on tools/uv.lock --
          # part of holding this project's self-inflicted Actions-minute
          # cost down. Reduces run time only; changes nothing this job
          # checks.
          enable-cache: true
      # The registration island only renders its real <input>/<label>
      # markup once it reaches its own 'ready' key state
      # (`app/src/islands/signup/SignupForm.tsx`) -- otherwise this run
      # would see only the "registration is not available" fallback, and
      # a future label regression in the form itself could pass this job
      # unnoticed. A throw-away RSA key pair per fixture event, generated
      # fresh on every run and never committed (this job never pushes
      # anything): real enough for the browser's own WebCrypto import to
      # accept, and provably not a key this project ever ships --
      # `eventkeys.py`'s own module docstring already establishes that
      # the private half never touches disk outside a CI job either, and
      # this one is discarded with the runner at the end of the job.
      - name: Generate throw-away event keys for accessibility testing
        run: |
          uv run --project tools python -c '
          import json

          from convener_ops.journey import eventkeys
          from convener_ops.declaration.paths import repo_root

          root = repo_root()
          events = json.loads(
              (root / "site" / "src" / "_data" / "events.json").read_text(encoding="utf-8")
          )
          keys_dir = root / "instance" / "keys" / "events"
          keys_dir.mkdir(parents=True, exist_ok=True)
          for event in events:
              event_id = str(event["id"]).lower()
              _, public_pem = eventkeys.generate()
              (keys_dir / f"{event_id}.pub").write_text(public_pem, encoding="utf-8")
          print(f"generated {len(events)} throw-away event key(s) for accessibility testing")
          '
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            site/package-lock.json
            app/package-lock.json
      # site/src/_data/events.json is committed as a build
      # fixture (site/README.md) -- built from it directly, the same
      # fixture-based build quality.yml's own `site` job already uses,
      # rather than the real, currently-private event data: this check
      # is about the templates and the islands' own markup, which the
      # fixture already exercises in full (an upcoming edition and a
      # past one both appear in it).
      - name: Install site
        working-directory: site
        run: npm ci
      - name: Build site
        working-directory: site
        run: npm run build
      - name: Install app
        working-directory: app
        run: npm ci
      - name: Build app
        working-directory: app
        run: npm run build
      # `puppeteer-core` (site/package.json) has no bundled Chromium of
      # its own -- nothing is ever downloaded here beyond the npm
      # registry packages `npm ci` already fetched. `ubuntu-latest`
      # ships Google Chrome preinstalled for exactly this kind of job
      # (confirmed against that runner image's own published software
      # list); this step only ever locates it, on the off chance the
      # image ever drops it, this fails loudly rather than falling back
      # to downloading a browser of its own (D-25).
      - name: Locate the pre-installed browser
        id: chrome
        run: |
          set -e
          path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || true)"
          if [ -z "$path" ]; then
            echo "::error::no Chrome/Chromium executable found on this runner -- this checker never downloads one of its own, see site/scripts/check-a11y.mjs's own module comment"
            exit 1
          fi
          echo "found $path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Check AA accessibility
        working-directory: site
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: npm run check:a11y -- --app-dir ../app/dist
