# D-25 makes every control inside a
# run fail loudly. It says nothing about a run that never starts --
# `retention.yml` is exactly the job whose silence has legal weight
# (D-22): it is what makes an event's registrations permanently
# unreadable once the retention window has elapsed. GitHub disables a
# workflow's own `schedule:` trigger after 60 days without any activity in
# the repository, and an exhausted Actions minute budget simply stops
# work, either way with no red badge anywhere -- a job that never runs
# never turns anything red.
#
# What this workflow catches, honestly
# -------------------------------------
# `retention.yml`'s own last step, "Record that the retention workflow ran
# today", commits `instance/data/retention-last-run.yml` unconditionally, every day
# its schedule fires -- regardless of whether that day's actual sweep
# succeeded (a separate concern, already loud on its own: that job's own
# red status on the Actions tab, and GitHub's own failure e-mail to the
# repository's watchers, already cover "did it run correctly"; the record
# only ever answers "did it run at all"). This workflow reads that one
# committed fact, on its own independent daily schedule, and fails loudly
# -- an `::error::` annotation, a red run -- once it has gone more than
# `tools/convener_ops/maintenance/retention_liveness.py::MAX_SILENT_DAYS` days without
# moving. It therefore catches: `retention.yml`'s schedule quietly
# disabled while the rest of the repository stays active, its own runs
# failing before they ever reach that last step (a checkout failure, a
# `uv sync` failure), the Actions minute budget running out specifically
# during its own scheduled slot on multiple consecutive days, or a human
# accidentally deleting or disabling the workflow file itself.
#
# What this workflow cannot catch, and why nothing at zero cost can
# ---------------------------------------------------------------------
# This is itself a scheduled GitHub Actions workflow. If the exact failure
# it exists to detect ever actually happens in full -- the whole
# repository goes inactive for 60 days and GitHub disables every schedule
# in it, or the account exhausts its Actions minutes for the month before
# this workflow's own slot -- this workflow is disabled or starved at the
# same moment `retention.yml` is, for the same reason. A watchdog that
# lives in the same scheduler it is watching cannot report on that
# scheduler going dark; nothing running inside GitHub Actions can, at zero
# cost (a hosted external monitor is a paid account, ruled out by the same
# constraint that shapes every other fix in this audit). What survives
# that scenario regardless is `instance/data/retention-last-run.yml` itself: a
# person who opens this repository -- no workflow run required -- can read
# the date it names and draw the same conclusion this workflow would have
# reported, by hand. That is the residue this fix leaves, stated rather
# than hidden: a committed record legible without any CI running, plus a
# second, independent schedule that reports on it for as long as any
# schedule in this repository still runs at all.
# A second record, watched the same way
# --------------------------------------
# This job now asks the same question twice, about two different daily
# jobs. The second is `instance/data/actions-usage.yml`, written at the bottom of
# `sweep-and-notify.yml`'s own daily job (05:00 UTC, so a healthy day's
# record is already written by the time this checks it at 12:00, exactly
# as with retention.yml's 06:11). That job is where the Actions *budget*
# alarm lives, and an alarm hosted inside the job it watches cannot report
# its own silence -- least of all when an exhausted minute budget, the
# thing the alarm exists to warn about, is one of the reasons a scheduled
# job stops running at all.
#
# A third record, and the reason it is here and not there
# --------------------------------------------------------
# `instance/data/queue-watch.yml` is what the public submission queue still held the
# last time a drain looked at it. A survey response and a
# far-off registration no longer start a run each: they wait in a branch,
# and one drain a day -- steps of `sweep-and-notify.yml`'s daily job again
# -- handles everything waiting. Every failure *inside* a drain is already
# loud. The failure that is not is a submission that entered the queue and
# was never handled at all, because nothing looked: the submitter has their
# answer from the relay and believes they are registered, and the
# repository has nothing red. For a registration that is a person who never
# receives the room link or the matching code, cannot join, and can never
# be issued a certificate.
#
# That failure has two halves and they cannot live in one place. An entry
# that is *known* to be stuck can only be known by something that read the
# queue -- which is the drain, which is therefore running -- so that alarm
# belongs in the daily job, which is also the only place already holding
# the board's thread and team mention; it is there, and it posts and goes
# red there. **The other half is the drain having stopped running at all,
# and a control hosted inside the job that stopped reports nothing.** That
# is this step: the daily job rewrites `instance/data/queue-watch.yml` every day
# whatever it found, and this reads its freshness, here, on a different
# schedule.
#
# It deliberately does not re-report the entries the daily job has already
# named. Two red runs a day saying the same thing is how an operator learns
# to ignore both.
#
# One overlap, named rather than quietly relied on: `instance/data/actions-usage.yml`
# above is written by the *same* daily job, so "that job died" is detected
# twice today. That is an accident of two records sharing a job and not a
# contract -- this one is written by the queue steps and that one by the
# steps after them, so a day when the queue steps stop and the rest of the
# job carries on is visible here and nowhere else -- and the two messages
# name different failures with different fixes, which is the whole point of
# a control.
#
# The name below still says "retention" because the file is still
# `retention-watchdog.yml` and every reference to it in this repository
# uses that name. What it actually is, and has been since the second check
# landed, is the one place that reports a daily record having gone quiet --
# and the paragraph above about what a watchdog inside its own scheduler
# cannot catch applies to the third record exactly as it does to the first
# two. If the whole repository goes dark, this workflow is disabled or
# starved at the same moment the drain is, and every queued submission
# waits with nothing anywhere saying so. What survives even that is the
# committed record itself: a person who opens this repository, with no run
# log and no CI at all, can read the date it names and the entries it lists.
name: Retention liveness watchdog

on:
  schedule:
    # Later than retention.yml's own 06:11 UTC cron, so a healthy day's
    # record is always already written by the time this checks it -- this
    # is never a same-day race against the job it watches.
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Read-only: this job only reads a committed file and reports on it.
      # It carries no secret and reaches no network beyond checking out
      # this repository -- see the header comment above for why it must
      # not, and cannot, do anything about the failure it detects.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.5.x'
          enable-cache: true
      - name: Check that the retention sweep ran recently
        id: retention
        working-directory: tools
        run: uv run --frozen convener-check-retention-liveness
      # The Actions budget alarm lives inside
      # sweep-and-notify.yml's own daily job, and a control hosted inside
      # the job it watches cannot report that job going quiet -- least of
      # all when the thing it exists to warn about, an exhausted minute
      # budget, is one of the reasons a job stops running at all. This is
      # the second independent schedule that reads its committed record,
      # exactly as the step above reads retention.yml's.
      #
      # A step, not a job and not a workflow: this job already runs, so
      # the extra question is free. Its `permissions:` stay
      # `contents: read` because this reads one committed file and calls
      # nothing -- the API work happens over in the daily job.
      #
      # `always()`, guarded on nothing: a stale retention record and a
      # dead budget alarm are two separate findings, and the first must
      # not hide the second. Each step keeps its own red mark, so the run
      # says which one it is.
      - name: Check that the Actions budget is still being watched
        if: always() && steps.retention.conclusion != 'skipped'
        working-directory: tools
        run: uv run --frozen convener-check-actions-usage-liveness
      # See this file's own header for why the "an entry
      # is stuck" half of that control lives in the daily job and only this
      # half can live out here.
      #
      # A step, not a job and not a workflow: this job already runs, so the
      # extra question is free. Its `permissions:` stay `contents: read`
      # and it carries no secret, because it reads one committed file and
      # calls nothing -- the posting happens over in the daily job, which
      # already holds the channel.
      #
      # The same guard and the same `always()` as the step above, for the
      # same reason: a stale retention record, a dead budget alarm and a
      # queue nobody is draining are three separate findings, and none of
      # them may hide the others. Each step keeps its own red mark, so the
      # run says which one it is.
      - name: Check that the public submissions are still being drained
        if: always() && steps.retention.conclusion != 'skipped'
        working-directory: tools
        run: uv run --frozen convener-check-queue-liveness
