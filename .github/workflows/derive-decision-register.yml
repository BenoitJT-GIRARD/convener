# `docs/handbook/governance/register.md` is derived, never authored: this job rewrites
# it in full from the commit history, so a row added by hand does not survive
# the next push. It commits only when the derivation actually changed.

name: Derive the decision register

on:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time, and the newest wins.
#
# **Why cancelling is right here and wrong three files away.** This
# workflow publishes a *state*, not an event: whatever it is part way
# through producing, a run started since is producing a newer version of
# the same thing. A superseded run has nothing left to say.
#
# The first reason is correctness, not cost. Two overlapping runs here each derive the
# register from history and commit it, and the older one's commit
# can land last.
# That is precisely what `deploy.yml` cancels for -- see
# `test_deploy_workflow_cancels_stale_runs_of_itself`, which spells out
# that an unserialised loser's rebase either conflicts or "replays
# cleanly and lets the older build silently overwrite the newer one".
# This file had no concurrency block at all, so that case was open.
#
# The minutes are real and secondary, and worth stating at their true
# size rather than a flattering one: on 2026-09-13 this file billed
# 47 minutes across 31 jobs, against `deploy.yml`'s 32 across 30 jobs with cancellation on.
# Both are short jobs and GitHub rounds every job up to a whole minute,
# so cancelling saves tens of minutes here, not hundreds. The hundreds
# were in what *woke* nine workflows for one runbook tick.
#
# `sweep-and-notify.yml` is the counter-example and the reason this is
# spelled out rather than copied: its `immediate` job composes a message
# from `github.event.before`, so each run holds a window no other run
# holds, and cancelling one loses that window's notification for good.
# Cancellation belongs to workflows that publish the latest state, never
# to workflows that send something.
#
# The group is a constant. `${{ github.ref }}` would read like "one
# run per branch" and would be the same constant here -- every trigger
# this file has resolves to the default branch -- but written as a
# constant it cannot quietly become per-something-else later.
concurrency:
  group: derive-decision-register
  cancel-in-progress: true

jobs:
  register:
    runs-on: ubuntu-latest
    # Every job in this repository declares a ceiling --
    # test_workflows.py::test_every_job_declares_a_timeout guards that.
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The register is a function of the whole history, not of the push
          # that triggered this run. A shallow clone would silently derive a
          # truncated register and commit it as if it were complete.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.5.x'
          # Caches uv's own download/resolve step, keyed on tools/uv.lock --
          # part of holding this project's self-inflicted Actions-minute
          # cost down. Reduces run time only; changes nothing this job
          # checks.
          enable-cache: true
      - name: Derive and commit
        # On a rejected push, re-derive against the
        # refreshed tip rather than `git pull --rebase` -- the same shape
        # registration.yml's own retry loop uses, and for the identical
        # reason. `docs/handbook/governance/register.md` is a generated file
        # (this file's own header comment): two runs racing each other
        # both rewrite it in full, so their diffs both touch the same
        # lines and a rebase between them conflicts instead of applying.
        # Discarding the local commit, fetching the tip and re-running
        # `convener-register` against it is what keeps "the register is a
        # function of the whole history" true after a race. The version
        # earlier version of this step rebased first and only then
        # re-derived, which still risked the same conflict on the rebase
        # itself before the re-derivation ever ran.
        run: |
          set -e
          git config user.name "convener-register"
          git config user.email "convener-register@users.noreply.github.com"

          for attempt in 1 2 3; do
            (cd tools && uv run --frozen convener-register)
            git add docs/handbook/governance/register.md
            if git diff --staged --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -m "docs: regenerate the decision register"
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- re-deriving against the latest $GITHUB_REF_NAME and retrying"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
          done
          echo "::error::push failed after 3 attempts -- the register was not saved"
          exit 1
