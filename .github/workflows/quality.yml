name: Quality

# No path filter, and that is a decision rather than an oversight. It is
# written here rather than left to be read out of its absence: a11y.yml
# and preview.yml were filtered, this file was weighed alongside them and
# deliberately left alone.
#
# A path filter here would either cover so much of the repository that it
# saved nothing, or risk exactly the "regression ships green" failure a
# path filter exists to avoid: the `python` job's own "Decision register" step
# (`uv run convener-register --check`) compares `docs/governance/register.md`
# against the *entire* commit history, not against any one file's diff --
# a decision-grammar commit whose only change sits outside whatever a
# filter watched would still need this check to run, and there is no path
# expression that names "the message of the next commit, whichever files
# it touches". The same job's own `pytest` suite is close to as broad in
# practice, not by design flaw but because it reads the repository as
# its own fixtures: `test_entry_docs.py` follows every relative link out
# of `README.md` and `docs/architecture.md`, including into
# `docs/decisions/**`; `test_workflows.py` parses every file under
# `.github/workflows/`; the schema and brand-token checks derive from
# `app/src/data/types.ts`, `docs/reference/schema.md` and
# `data/brand.json`. A filter list built to be honestly safe here would
# have to include most of the tree, which is not a filter, it is a
# larger diff with the same risk of a missed entry and none of the
# saving. `enable-cache: true` below still reduces this job's own run
# time without touching what it checks -- see that step's own comment.
#
# ---------------------------------------------------------------------
# Eight jobs became four, and nothing was removed.
#
# GitHub bills a job by the minute, rounded *up*: a job doing twenty
# seconds of useful work still bills a whole minute, and eight of them
# bill eight. The four jobs below carry exactly the steps the eight
# carried, regrouped by what they already shared -- one runner, one
# checkout, one Node installation -- so the saving costs no check.
#
#   `python`          unchanged; the heaviest, and the only one needing `uv`.
#   `web`             was `typescript` + `site` + `spelling`: one Node 20,
#                     and `app/`'s own `npm ci` was previously run twice
#                     (once by `typescript`, again by `site` for the
#                     performance budget's island bundles). Now once.
#   `relays`          was `auth-proxy` + `form-relay` + `signup-relay`:
#                     one runner. Two `setup-node` steps, not one --
#                     `signup-relay` is on Node 22 and stays there.
#   `workflow-schema` unchanged, and deliberately *not* merged: two tests
#                     in tools/tests/test_workflows.py pin a job *named*
#                     `workflow-schema` whose only `uses:` is
#                     `actions/checkout`. Merging it would mean rewriting
#                     the two guards that are the point of it, to win one
#                     minute of rounding. A bad trade.
#
# **The saving does not appear in the ceilings, and looking for it there
# is a wasted afternoon.** A merged job's `timeout-minutes` must cover the
# sum of what it does, so 10+10+12+10 +10+10+10 +5 = 77 becomes
# 10 + 32 + 30 + 5 = 77. The gain is four fewer billed jobs per trigger --
# up to four minutes of rounding, and `quality.yml` fires on the pull
# request *and* on `main` after the merge, so up to about eight minutes
# per change -- plus four `checkout` steps, three `setup-node` steps and
# one duplicated `npm ci` that no longer run at all.
#
# **A failure has to stay attributable, and that is the constraint the
# merge had to respect.** Eight
# jobs each reported their own failure; one job that says only "something
# went red" would be a worse trade than the minutes are worth. So every
# step below is named for what it checks, and every check runs whenever
# *its own* prerequisites succeeded -- `if: always() && steps.<id>.outcome
# == 'success'` -- rather than being skipped because some earlier,
# unrelated step failed first. A broken type therefore no longer hides a
# misspelling, which is what the eight-job split gave for free and what a
# naive merge would have quietly taken away. The guards name a step id
# rather than saying `always()` alone, so that a failed `checkout` or a
# failed `setup-node` still skips everything downstream instead of running
# a dozen steps that cannot possibly work.
# ---------------------------------------------------------------------
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces the
# commit an older run of this workflow is still checking: that run is
# verifying code nobody will ever merge. Three pushes in a quarter of an
# hour cost three full chains of checks before this block, where only the
# last one says anything about what will be merged.
#
# **A push to `main` must never be cancellable, and that is what the
# expression below is shaped around.** `github.head_ref` is the source
# branch of a pull request and is empty for every other event, so a
# `pull_request` run groups with the other runs of the same branch and
# the older one is cancelled -- while a push to `main` falls through to
# `github.run_id`, unique to that one run, which nothing else can ever
# join and therefore nothing can ever cancel. Every commit that reaches
# production stays verified for itself. The obvious shorthand,
# `github.ref`, would do the opposite in silence: two pushes to `main`
# share one ref, so the second would cancel the first one's checks and
# the commit in between would go to production unverified -- D-25, and
# the reason this is pinned by a test that evaluates this exact
# expression against both contexts rather than eyeballing its shape
# (tools/tests/test_workflows.py::
# test_a_push_outside_a_pull_request_can_never_be_cancelled).
#
# `github.workflow` scopes the group to this workflow's own name --
# concurrency groups are shared repository-wide, so without it the five
# workflows carrying this block would cancel each other. Same reasoning
# deploy.yml's own group already states.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    # Every job in this repository declares a ceiling --
    # test_workflows.py::test_every_job_declares_a_timeout guards that.
    #
    # 12, not 10: this job also installs
    # `app/`'s own `node_modules` and runs a whole second-instance build
    # inside `pytest` (see the "Install app" step below). Raised rather
    # than left to run close to the edge -- a timeout that trips on a slow
    # runner is a red build that says nothing about the code.
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The commit-message check reads the range under review, so it needs
          # the commits themselves, not just the merge result. The register
          # check needs more than that: it derives the file from the whole
          # history, so against a shallow clone it would compare the committed
          # register with a truncated derivation and fail for the wrong reason.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.5.x'
          # Caches uv's own download/resolve step, keyed on tools/uv.lock --
          # part of holding this project's self-inflicted Actions-minute
          # cost down. Reduces run time only; changes nothing this job
          # checks.
          enable-cache: true
      - name: Install
        working-directory: tools
        run: uv sync --all-extras
      # `tests/test_site.py` builds the real `site/`
      # project itself (a genuine Eleventy build, into a scratch directory)
      # to sweep the *rendered* event pages for a leaked room link. Nothing
      # cheaper can check that, because a
      # room link never appears in a template's own source under the
      # internal name `zoom_link` (the public feed used to carry it as
      # `registration_link`, and publishes it under no name at
      # all now), so a template-source scan would stay green even with a leak.
      # That build needs `site/`'s own `node_modules`, which this job
      # otherwise never installs -- the `web` job below does, but it never
      # runs `pytest`, and it is a separate runner with a separate
      # workspace, so neither job can lend the other its install. Mixing
      # Python and Node tooling in one job is already this pipeline's own
      # idiom (`publish-vitrine.yml`, `deploy.yml`), not a pattern
      # introduced here.
      #
      # The second install below is there for the same
      # reason. `tests/test_second_instance.py` builds this repository as
      # a *different* instance -- all four bundles, the showcase, the
      # handbook copy, the generated templates, the published feeds and
      # the posters -- and sweeps what comes out for anything of this
      # instance's. That is the property separating the instance from the
      # code rests on, so it has to run on every change rather than
      # only where somebody remembers to look; the build itself takes
      # about ten seconds once `node_modules` is there, and it makes no
      # network call of any kind.
      #
      # These two steps are load-bearing rather than
      # convenient. `tests/test_second_instance.py::_toolchain_absent`
      # skips a missing toolchain on a developer's machine and *fails* it
      # here, because `CI` is set -- so deleting, renaming or reordering
      # either install below turns this job red by name instead of turning
      # the whole check into a row of skips inside a green suite (D-25 --
      # exactly that row of skips has sat inside a green suite here once).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            site/package-lock.json
            app/package-lock.json
      - name: Install site (for tests/test_site.py's own build)
        working-directory: site
        run: npm ci
      - name: Install app (for tests/test_second_instance.py's own build)
        working-directory: app
        run: npm ci
      - name: Lint
        working-directory: tools
        # `../scripts` too: it is Python, holds the one-shot migrations and
        # the schema-doc generator run below, and is not a package of its
        # own with a gate of its own -- `tools/pyproject.toml` is the only
        # ruff config in the repository, and this is the job that has `uv`.
        run: uv run ruff check . ../scripts
      - name: Format check
        working-directory: tools
        run: uv run ruff format --check . ../scripts
      - name: Types
        working-directory: tools
        run: uv run mypy
      - name: Security patterns
        working-directory: tools
        run: uv run bandit -q -r convener_ops
      - name: Dependency audit
        working-directory: tools
        run: uv run pip-audit
      - name: Tests
        working-directory: tools
        run: uv run pytest --cov=convener_ops --cov-report=term-missing
      - name: Integration status
        working-directory: tools
        run: uv run convener-check-config
      - name: Commit messages
        working-directory: tools
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -e
          # Only the commits under review. The oldest commits predate this
          # grammar and do not follow it; a check that demanded the past be
          # rewritten would be turned off instead of obeyed.
          #
          # The range is computed by `commit_format.log_range` rather than
          # here, because a range that quietly resolves to nothing is a green
          # check that read no commit, and shell in a workflow file is the one
          # place nothing can test.
          range="$(uv run convener-commit-range)"
          # Intentional, not an oversight: `commit_format.commit_range()`'s
          # own docstring says the workflow "reads them unquoted into
          # `git log`, so this prints one line and nothing else."
          # `log_range()` returns either one token (`"start..head"`) or two
          # (`"-1 head"`, when there is no commit to subtract from) --
          # quoting `$range` would pass `"-1 head"` to `git log` as a
          # single bad revision instead of two arguments. Found by
          # `actionlint` (the workflow-schema job below), not by this
          # project's own tests: PyYAML has no opinion on shell inside a
          # `run:` block.
          # shellcheck disable=SC2086
          git log --format=%B%x00 $range | uv run convener-check-commits
      - name: Decision register
        working-directory: tools
        # `docs/governance/register.md` is derived from the commit history and
        # rewritten in full by the scheduled job, so a row typed by hand is
        # undone on the next push -- but it is wrong in the repository until
        # then. This is the same derivation run as an assertion: it writes
        # nothing and fails if the committed file is not what the history
        # gives. Byte-comparable because the rendering reads no clock and no
        # data file, only the commits.
        run: uv run convener-register --check
      - name: Schema appendix
        working-directory: tools
        # `docs/reference/schema.md` is derived from `app/src/data/types.ts`,
        # the model both readers share. It was written by hand next to a model
        # that kept moving and drifted every time it moved -- four times over
        # two phases, corrected by hand each time. This is the same derivation
        # run as an assertion: it writes nothing and fails if the committed
        # page is not what the types give, naming the command to run.
        #
        # Unlike the register above, this reads no history at all, only two
        # files in the tree, so it would be satisfied by the shallow clone the
        # other jobs take; it runs here because this is the job that has `uv`.
        run: uv run python ../scripts/generate_schema_doc.py --check
      - name: Standing-up guide
        working-directory: tools
        # `docs/reference/standing-up.md` is derived from `STANDING-UP.yml`,
        # the one declaration of the sequence that turns nothing into a
        # running instance -- read by that page and by the agent that carries
        # the same sequence out. Two documents describing one procedure
        # diverge, and a corrected page beside a forgotten agent is that
        # defect with a longer fuse. Same assertion-only run as the two
        # around it: writes nothing, fails if the committed page is not what
        # the declaration and `config/integrations.yml` give.
        run: uv run python ../scripts/generate_standing_up_doc.py --check
      - name: Standing-up skill
        working-directory: tools
        # The second rendering of that same declaration:
        # `.claude/skills/standing-up/SKILL.md` is the run sheet an agent
        # follows, and it carries each step's order, identifier, title and
        # actor and nothing else -- everything a step says is read out of
        # `STANDING-UP.yml` when the step comes up. A guide corrected without
        # the run sheet beside it is the drift the step above exists to
        # refuse, one artefact further along. Assertion-only, like the rest.
        run: uv run python ../scripts/generate_standing_up_skill.py --check
      - name: Brand tokens and templates
        working-directory: tools
        # site/src/style.css, app/src/design/tokens.css and tokens.ts each
        # carried data/brand.json's colours retyped by hand -- the shape
        # that let the application drift to a reconstruction's palette
        # unnoticed. Same
        # assertion-only run as the schema check above: writes nothing,
        # fails if a committed file is not what the charter derives.
        #
        # It has two more things to fail on beyond the stylesheet. It also
        # derives the two SVG templates a collaborator downloads
        # (docs/assets/), which had drifted onto the same discarded
        # palette where no check could see them; and it recomputes every
        # contrast the charter records, refusing a palette that measures
        # below WCAG AA rather than only one that disagrees with a file.
        # That last clause is what lets the product ship a default palette
        # at all, so it has to run here and not only in pytest.
        run: uv run python ../scripts/generate_brand_css.py --check

  # The former `typescript`, `site` and `spelling` jobs, merged.
  # Three jobs, one Node 20, one checkout -- and `app/`'s own `npm ci` run
  # twice between them. See this file's header for the reasoning, and for
  # why the ceiling below is their sum rather than anything smaller.
  #
  # The three lanes below (`app/`, `site/`, spelling) stay textually
  # separate, and are read that way by the tests that pin them
  # (test_dependency_audit_workflow.py, test_performance_workflow.py):
  # each lane opens with the install step whose `id:` that lane's own
  # checks guard on, so a red lane never silences another.
  web:
    runs-on: ubuntu-latest
    # 10 (`typescript`) + 12 (`site`) + 10 (`spelling`). A merged job has
    # to bound the sum of what it does; see the header -- the saving is in
    # billed jobs, never in this number.
    timeout-minutes: 32
    permissions:
      contents: read
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'
          # Both lock files, the same multi-path cache `a11y.yml` already
          # uses: this one job installs `app/` (for its own checks, and for
          # the island bundles the performance budget weighs) and `site/`.
          cache-dependency-path: |
            app/package-lock.json
            site/package-lock.json

      # ---- app/ ------------------------------------------------------
      # Installed once. This `npm ci` used to run twice, in
      # two jobs, on two runners, for one tree.
      - name: Install app
        id: install-app
        working-directory: app
        run: npm ci
      # `npm audit` reached `site/`'s own steps before it reached
      # `app/`'s -- `app/`'s own tree (React, Vite, the whole
      # application toolchain) went unaudited, and it is the
      # larger surface: `react-router`/`react-router-dom` and `js-yaml` are
      # `dependencies`, not `devDependencies`, so they ship in the built
      # `dist/assets/index-*.js` the operators' cockpit serves at
      # its own published base behind its login screen (App.tsx's `Login`/
      # `useAuth` gate) -- bounded (never reached by a visitor who only
      # loads a public showcase page or one of the two islands, both of
      # which import neither package), but real. `--omit=dev` is the gate:
      # it fails on exactly that shipped surface, and only that surface.
      - name: Dependency audit (production)
        if: always() && steps.install-app.outcome == 'success'
        working-directory: app
        run: npm audit --omit=dev
      # The other 19 findings `npm audit` (no flag) reports today are all
      # in `devDependencies` -- eslint, typescript-eslint, @babel/core,
      # autoprefixer's own postcss/tailwindcss chain -- tooling that runs
      # only on a CI runner or a maintainer's machine, over this
      # repository's own first-party source, and ships in no built output
      # at all. Blocking on those would fail this job on a class of finding
      # that cannot reach the surface this step is actually protecting;
      # never checking them would hide the day one of them stops being
      # theoretical. `continue-on-error` prints the finding and marks the
      # step visibly (D-25: a check that cannot fail is not a check, and
      # the mirror is just as true -- a finding nothing ever surfaces is
      # not reported either) without failing the job or blocking a merge.
      - name: Dependency audit (development tooling, informational)
        continue-on-error: true
        if: always() && steps.install-app.outcome == 'success'
        working-directory: app
        run: npm audit
      - name: Lint app
        if: always() && steps.install-app.outcome == 'success'
        working-directory: app
        run: npm run lint
      - name: Types app
        if: always() && steps.install-app.outcome == 'success'
        working-directory: app
        run: npm run typecheck
      - name: Tests and coverage app
        if: always() && steps.install-app.outcome == 'success'
        working-directory: app
        run: npm run test:cov

      # ---- site/ -----------------------------------------------------
      # Guarded on `node`, never on the app lane above: a red `app/` must
      # not stop the showcase being built and weighed, which is exactly
      # what a separate `site` job used to guarantee for free.
      - name: Install site
        id: install-site
        if: always() && steps.node.outcome == 'success'
        working-directory: site
        run: npm ci
      # site/eslint.config.js, the same minimal, plugin-free flat config
      # services/auth-proxy's own already uses -- Eleventy's own CommonJS
      # config file, plus the accessibility checker's own ES
      # module, the performance-budget checker's own, the shared
      # Paris-offset fixture's own
      # CommonJS check script, and this package's reader
      # of `config/instance.json` and the script that prints what it and
      # `.eleventy.js` resolve, each under its own scoped override in that
      # same config file.
      - name: Lint site
        if: always() && steps.install-site.outcome == 'success'
        working-directory: site
        run: npx --yes eslint@9 .eleventy.js scripts/check-a11y.mjs scripts/check-performance-budget.mjs scripts/check-paris-standing-start.cjs scripts/published.cjs scripts/print-published.cjs
      # The same quality chain this project already holds Python to
      # (`uv run pip-audit`, above) -- `site/`'s own dependencies (Eleventy,
      # axe-core, puppeteer-core) went unaudited until this step existed.
      # Queries npm's own advisory database, the identical shape of network
      # call `pip-audit` already makes in this same chain; not a test, and
      # no account or paid service involved.
      - name: Dependency audit site
        if: always() && steps.install-site.outcome == 'success'
        working-directory: site
        run: npm audit
      # The showcase's templates live in this repository (D-15), and for a
      # while the construction that reads them never ran in CI --
      # this is that construction. `site/src/_data/events.json` is
      # committed as a fixture (see site/README.md), so this build needs
      # no data generated by `tools/`, unlike publish-vitrine.yml's own.
      - name: Build
        id: build-site
        if: always() && steps.install-site.outcome == 'success'
        working-directory: site
        run: npm run build
      # The performance budget below covers two page classes --
      # static pages (site/ alone) and pages carrying a client-side island
      # (event.njk's registration form, verify.njk's own panel) -- so it
      # needs the app's real built islands, the same fixture-based build
      # `a11y.yml` already runs (no real event keys or signing keys exist
      # here, and none are needed: the check below weighs the built
      # `signup.js`/`verify.js` bundles themselves, not their behaviour).
      # The install this build needs is the app lane's own, above -- the
      # duplicate `npm ci` that merging these jobs removed.
      - name: Build app
        id: build-app
        if: always() && steps.install-app.outcome == 'success'
        working-directory: app
        run: npm run build
      # A performance budget, verified
      # automatically against the real built output (D-26), never a source
      # directory or an estimate. See site/scripts/check-performance-
      # budget.mjs's own module comment for the two budgets, the reasoning
      # behind each, and why the self-hosted fonts (D-17) are measured and
      # reported separately rather than folded into a page's own weight.
      #
      # The one step here that needs two lanes green at once: it weighs
      # `site/`'s pages *and* `app/`'s islands, so it is guarded on both
      # builds rather than run against half a build and reported as a
      # budget breach that is really a missing file.
      - name: Performance budget
        if: >-
          always() && steps.build-site.outcome == 'success'
          && steps.build-app.outcome == 'success'
        working-directory: site
        run: npm run check:budget -- --app-dir ../app/dist

      # ---- spelling --------------------------------------------------
      # Needs nothing but Node, and is therefore guarded on nothing but
      # Node: this is the lane the header names, the one a broken type in
      # `app/` must never be allowed to silence.
      - name: Spell check (en-GB)
        if: always() && steps.node.outcome == 'success'
        run: npx --yes cspell@8 lint --no-progress

  # The former `auth-proxy`, `form-relay` and
  # `signup-relay` jobs. One runner, one checkout -- but *two*
  # `setup-node` steps, because `signup-relay` runs on Node 22 and the
  # other two on Node 20. Two `setup-node` steps in one job is still one
  # billed job; putting all three relays on a single Node version to make
  # this file look tidier would change what is tested, which is not a
  # trade a tidy-up is allowed to make. The Node 22 step comes last
  # because `setup-node` changes the version for every step after it.
  relays:
    runs-on: ubuntu-latest
    # 10 + 10 + 10, the three jobs this replaces. See the header: the
    # saving is in billed jobs, not in this number.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: node-20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            services/auth-proxy/package-lock.json
            services/form-relay/package-lock.json

      # ---- services/auth-proxy (Node 20) -----------------------------
      - name: Install auth-proxy
        id: install-auth-proxy
        working-directory: services/auth-proxy
        run: npm ci
      # This relay declares no
      # `dependencies` at all -- `src/` imports nothing from `node_modules`,
      # only the Worker runtime's own standard `fetch` API -- so nothing
      # `npm audit` could find here ever reaches the deployed Worker.
      # `wrangler` (which bundles and deploys it) and `vitest` are its
      # entire dependency tree, exactly `site/`'s own shape (an all-tooling
      # package.json): no flag, never `--omit=dev`, which would exempt
      # every dependency this package declares and pass regardless of what
      # it found (D-25, and `test_the_workflow_audits_site_dependencies`'s
      # own reasoning for `site/`, applied here for the same cause).
      - name: Dependency audit auth-proxy
        if: always() && steps.install-auth-proxy.outcome == 'success'
        working-directory: services/auth-proxy
        run: npm audit
      - name: Lint auth-proxy
        if: always() && steps.install-auth-proxy.outcome == 'success'
        working-directory: services/auth-proxy
        run: npx --yes eslint@9 src test
      - name: Test auth-proxy
        if: always() && steps.install-auth-proxy.outcome == 'success'
        working-directory: services/auth-proxy
        run: npm test

      # ---- services/form-relay (Node 20) -----------------------------
      # Guarded on the Node 20 step, not on the relay above it: three
      # separate jobs used to mean a red auth-proxy said nothing at all
      # about the form relay, and that stays true here.
      - name: Install form-relay
        id: install-form-relay
        if: always() && steps.node-20.outcome == 'success'
        working-directory: services/form-relay
        run: npm ci
      # Same shape as services/auth-proxy's
      # own step above -- no `dependencies`, `wrangler`/`vitest` are the
      # whole tree, no flag, never `--omit=dev` (D-25).
      - name: Dependency audit form-relay
        if: always() && steps.install-form-relay.outcome == 'success'
        working-directory: services/form-relay
        run: npm audit
      - name: Lint form-relay
        if: always() && steps.install-form-relay.outcome == 'success'
        working-directory: services/form-relay
        run: npx --yes eslint@9 src test
      - name: Test form-relay
        if: always() && steps.install-form-relay.outcome == 'success'
        working-directory: services/form-relay
        run: npm test

      # ---- services/signup-relay (Node 22) ---------------------------
      # Node 22, deliberately: this relay is developed and deployed on 22,
      # and a merge that quietly moved it to 20 would be testing something
      # other than what is deployed. Placed last because this step changes
      # the version every step after it sees. Guarded on the checkout
      # rather than on either relay above, so a red form relay does not
      # skip this lane.
      - id: node-22
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: services/signup-relay/package-lock.json
      - name: Install signup-relay
        id: install-signup-relay
        if: always() && steps.node-22.outcome == 'success'
        working-directory: services/signup-relay
        run: npm ci
      # Same shape as services/auth-proxy's
      # own step above -- no `dependencies`, `wrangler`/`vitest` are the
      # whole tree, no flag, never `--omit=dev` (D-25).
      - name: Dependency audit signup-relay
        if: always() && steps.install-signup-relay.outcome == 'success'
        working-directory: services/signup-relay
        run: npm audit
      - name: Lint signup-relay
        if: always() && steps.install-signup-relay.outcome == 'success'
        working-directory: services/signup-relay
        run: npx --yes eslint@9 src test
      - name: Test signup-relay
        if: always() && steps.install-signup-relay.outcome == 'success'
        working-directory: services/signup-relay
        run: npm test

  workflow-schema:
    runs-on: ubuntu-latest
    # Nothing else in this chain checks that a workflow is
    # valid *for GitHub*. `test_workflows.py` and every other check above
    # parse these files with PyYAML, which accepts syntax GitHub's own
    # parser rejects outright -- this project learned that the hard way with a
    # YAML anchor that would have kept the visual-regression workflow from
    # ever triggering, found by reading the file, not by a tool
    # (test_workflows.py's own hand-rolled anchor/alias sweep exists
    # because of that gap, and still guards that one instance; this closes
    # the class). `actionlint` parses against GitHub's real workflow
    # schema instead of PyYAML's permissive one.
    #
    # A pinned release download, not a third-party `uses:` action -- so
    # there is nothing here for the SHA-pin sweep to check, and it reaches
    # the network the same way `npm audit`/`pip-audit`/`cspell` already do
    # elsewhere in this same chain, which is why this is a CI step and
    # never a test (tools/tests/test_workflows.py::
    # test_quality_workflow_validates_workflows_against_github_actions_schema pins
    # the version string below without ever running the tool itself).
    #
    # This job was left alone on purpose while the other seven merged
    # into three: the two tests named in this file's header pin
    # a job *called* `workflow-schema` whose only `uses:` is
    # `actions/checkout`, so folding it into another job means rewriting
    # the guards themselves in exchange for one minute of rounding.
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
      - name: Validate workflows against GitHub's schema
        run: ./actionlint
