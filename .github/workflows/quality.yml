name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.5.x'
      - name: Install
        working-directory: tools
        run: uv sync --all-extras
      - name: Lint
        working-directory: tools
        run: uv run ruff check .
      - name: Format check
        working-directory: tools
        run: uv run ruff format --check .
      - name: Types
        working-directory: tools
        run: uv run mypy
      - name: Security patterns
        working-directory: tools
        run: uv run bandit -q -r convener_ops
      - name: Dependency audit
        working-directory: tools
        run: uv run pip-audit
      - name: Tests
        working-directory: tools
        run: uv run pytest --cov=convener_ops --cov-report=term-missing
