name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.5.x'
      - name: Install
        working-directory: tools
        run: uv sync --all-extras
      - name: Lint
        working-directory: tools
        run: uv run ruff check .
      - name: Format check
        working-directory: tools
        run: uv run ruff format --check .
      - name: Types
        working-directory: tools
        run: uv run mypy
      - name: Security patterns
        working-directory: tools
        run: uv run bandit -q -r convener_ops
      - name: Dependency audit
        working-directory: tools
        run: uv run pip-audit
      - name: Tests
        working-directory: tools
        run: uv run pytest --cov=convener_ops --cov-report=term-missing

  typescript:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Lint
        working-directory: app
        run: npm run lint
      - name: Types
        working-directory: app
        run: npm run typecheck
      - name: Tests and coverage
        working-directory: app
        run: npm run test:cov

  spelling:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Spell check (en-GB)
        run: npx --yes cspell@8 lint --no-progress
