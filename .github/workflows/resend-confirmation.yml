name: Resend a registration confirmation

# The manual resend the risk of silent loss asks for -- a
# confirmation in a spam folder does not exist. `workflow_dispatch`
# rather than a script a volunteer runs locally: `EVENT_PRIVATE_KEY` and
# `email_transport`'s five secrets live only in this repository's own
# secrets (eventkeys.py's module docstring; config/integrations.yml), never
# on a laptop, so re-sending has to happen in a job that already holds
# them -- the same reason `convener-handle-registration` itself only ever runs
# here.
on:
  workflow_dispatch:
    inputs:
      event_id:
        description: 'Event id, exactly as published (e.g. mrg-042)'
        required: true
        type: string
      encrypted_identifier:
        # This input used to
        # be `email`, a bare address -- GitHub renders and retains a
        # workflow_dispatch input's own value on the run page for as long
        # as the run's history exists, so every resend manufactured a
        # fresh, permanent, plaintext copy of the registrant's address
        # (D-24: an operator command names a record, never a person).
        # `registration.py`'s own module docstring still explains why no
        # other identifier for one registration is stored at all ("No
        # stored identifier for whose entry is this"), so an address is
        # still the only handle a resend can name a registration by -- but
        # it now arrives encrypted under this event's own already-
        # published public key, produced on an operator's own machine
        # with `convener-encrypt-identifier` (needs no secret), never as the
        # address itself. `workflow_dispatch` is still restricted to
        # collaborators with repository write access, but that trust
        # boundary is no longer what this input's safety rests on.
        description: >-
          The registrant's e-mail address, encrypted for this event with
          `cd tools && EVENT_ID=<id> REGISTRATION_EMAIL=<address> uv run
          convener-encrypt-identifier` -- never the address itself.
        required: true
        type: string

jobs:
  resend:
    runs-on: ubuntu-latest
    # Checkout, `uv sync`, one decrypt pass over at most 500 entries
    # (registration.py's own module docstring gives the ceiling) and one
    # send attempt -- generous.
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.5.x'
      - name: Resolve the event's key secret
        id: resolve
        working-directory: tools
        env:
          # Built with `toJSON`, not string interpolation, so a stray quote
          # in either input cannot break out of the payload this step
          # hands to `convener-registration-secret-name` -- the same discipline
          # registration.yml already applies to the relayed payload it
          # reads, here applied to a value a trusted operator typed by
          # hand instead of one a stranger's browser produced.
          REGISTRATION_PAYLOAD: ${{ toJSON(inputs) }}
        run: uv run convener-registration-secret-name
      - name: Re-send the confirmation
        working-directory: tools
        env:
          EVENT_ID: ${{ inputs.event_id }}
          EMAIL_ENVELOPE: ${{ inputs.encrypted_identifier }}
          EVENT_PRIVATE_KEY: ${{ secrets[steps.resolve.outputs.secret_name] }}
          CONVENER_MATCHING_SALT: ${{ secrets.CONVENER_MATCHING_SALT }}
          # Same reasoning as registration.yml's own
          # identical addition -- `resend_confirmation` calls
          # `_send_confirmation`, which resolves the room link through
          # `platform_from_env`. Absent here is ordinary D-13.
          CONVENER_MEETING_API_TOKEN: ${{ secrets.CONVENER_MEETING_API_TOKEN }}
          CONVENER_SMTP_HOST: ${{ secrets.CONVENER_SMTP_HOST }}
          CONVENER_SMTP_PORT: ${{ secrets.CONVENER_SMTP_PORT }}
          CONVENER_SMTP_USER: ${{ secrets.CONVENER_SMTP_USER }}
          CONVENER_SMTP_PASSWORD: ${{ secrets.CONVENER_SMTP_PASSWORD }}
          CONVENER_SMTP_FROM: ${{ secrets.CONVENER_SMTP_FROM }}
        run: uv run convener-resend-confirmation
