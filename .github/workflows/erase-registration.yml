name: Erase a registration early

# Task 15: the operator-facing side of spec S:4's "Erasure before the
# deadline" -- a participant's registration removed from
# registrations.enc before the retention window ends, without touching
# any other registrant's own entry (R-31; tools/convener_ops/registration.py::
# erase). Acceptance criterion 7 requires this procedure to be both
# documented and tested; this workflow is what makes it reachable, the
# same way resend-confirmation.yml and revoke-certificate.yml make their
# own manual procedures reachable rather than a script nobody can run.
#
# MATCHING_CODE, in preference to ENCRYPTED_IDENTIFIER (R-32). The code
# is already in the participant's own confirmation e-mail (task 7) and is
# never stored anywhere on our side -- recomputing it and comparing is
# tools/convener_ops/registration.py::find_by_matching_code's own job.
# encrypted_identifier is accepted as a fallback for someone who no
# longer has that e-mail -- the same deliberate, documented exception
# resend-confirmation.yml's own header comment already makes for an
# identical reason.
#
# H1, fix wave 2 (security audit 2026-08-23): this input used to be
# `email`, a bare address -- GitHub renders and retains a
# workflow_dispatch input's own value on the run page for as long as the
# run's history exists, so the one command whose entire purpose is
# erasing someone's address was manufacturing a fresh, permanent,
# plaintext copy of exactly that address every time the fallback was
# used (D-24: an operator command names a record, never a person).
# `encrypted_identifier` is that same address, hybrid-encrypted under
# this event's own already-published public key -- produced on an
# operator's own machine with `convener-encrypt-identifier` (needs no secret:
# `keys/events/<id>.pub` is public data, not a secret) -- so the value
# GitHub renders and retains is ciphertext, decryptable only by whichever
# CI job later holds this event's EVENT_PRIVATE_KEY. workflow_dispatch is
# still restricted to collaborators with repository write access, but
# that trust boundary is no longer what this input's safety rests on.
on:
  workflow_dispatch:
    inputs:
      event_id:
        description: 'Event id, exactly as published (e.g. mrg-042)'
        required: true
        type: string
      matching_code:
        description: >-
          Preferred: the matching code from the participant's own
          confirmation e-mail (e.g. ABCD-2345). Leave blank to use
          encrypted_identifier instead.
        required: false
        type: string
      encrypted_identifier:
        description: >-
          Fallback only, used when no matching code is given: the
          registrant's e-mail address, encrypted for this event with
          `cd tools && EVENT_ID=<id> REGISTRATION_EMAIL=<address> uv run
          convener-encrypt-identifier` -- never the address itself. See this
          file's own header comment for why (R-32, D-24, H1).
        required: false
        type: string

# Important 5: every other writing dispatch workflow in this repository
# has one; this one shares registration.yml's own group name rather than
# a name of its own, deliberately -- registrations.enc is the file both
# workflows write, so an erasure racing a submission for the same event
# is the actual collision to prevent, not merely two erasures racing each
# other. `cancel-in-progress: false`, the same reason as everywhere else
# this repository sets it: a run partway through rewriting the file must
# finish, never be cut off mid-write.
concurrency:
  group: registration-${{ inputs.event_id }}
  cancel-in-progress: false

jobs:
  erase:
    runs-on: ubuntu-latest
    # Checkout, `uv sync`, one decrypt pass over at most 500 entries
    # (registration.py's own module docstring gives the ceiling) and one
    # rewrite -- generous, the same budget resend-confirmation.yml gives
    # an equivalent single-event operation.
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.5.x'
      - name: Resolve the event's key secret
        id: resolve
        working-directory: tools
        env:
          # Built with `toJSON`, not string interpolation -- the same
          # discipline resend-confirmation.yml already applies to a
          # trusted operator's own typed input, so a stray quote in
          # `inputs.event_id` cannot break out of this payload.
          REGISTRATION_PAYLOAD: ${{ toJSON(inputs) }}
        run: uv run convener-registration-secret-name
      - name: Erase the named registration
        env:
          EVENT_ID: ${{ inputs.event_id }}
          MATCHING_CODE: ${{ inputs.matching_code }}
          EMAIL_ENVELOPE: ${{ inputs.encrypted_identifier }}
          EVENT_PRIVATE_KEY: ${{ secrets[steps.resolve.outputs.secret_name] }}
          CONVENER_MATCHING_SALT: ${{ secrets.CONVENER_MATCHING_SALT }}
        # `convener-erase-registration` re-run inside the retry loop, the same
        # shape revoke-certificate.yml's own step already uses: a rejected
        # push resets the working tree back to origin (which, if the push
        # never landed, still carries the un-erased entry), so re-running
        # the command recomputes the identical erasure rather than trying
        # to re-push a commit `git reset --hard` just discarded.
        # `convener_ops.registration.erase` never re-encrypts a surviving
        # entry (R-31), so re-running this against the same starting file
        # twice produces byte-identical output both times.
        run: |
          set -e
          git config user.name "convener-erasure"
          git config user.email "convener-erasure@users.noreply.github.com"

          for attempt in 1 2 3; do
            (cd tools && uv run convener-erase-registration)
            if [ -f "data/events/$EVENT_ID/registrations.enc" ]; then
              git add "data/events/$EVENT_ID/registrations.enc"
            fi
            # Critical 1: convener-erase-registration also rewrites the
            # committed attendance export when the erased person has rows
            # there (R-45, tools/convener_ops/cli.py:1422-1457) -- staging only
            # the registration file left that rewrite dying with the
            # runner while the log reported it committed. Guarded the same
            # way: the file may not exist for an event with no attendance
            # export yet.
            if [ -f "data/events/$EVENT_ID/attendance-import.csv.enc" ]; then
              git add "data/events/$EVENT_ID/attendance-import.csv.enc"
            fi
            if git diff --staged --quiet; then
              echo "::warning::convener-erase-registration ran but wrote nothing -- see this run's own log above for why"
              exit 0
            fi
            git commit -m "data: erase one registration for $EVENT_ID before its retention window ends"
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- re-deriving against the latest $TARGET_BRANCH and retrying"
            git fetch origin "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"
          done
          echo "::error::push failed after 3 attempts -- the erasure was computed but not saved; rerun this workflow"
          exit 1
