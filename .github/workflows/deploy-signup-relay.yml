name: Deploy signup relay

on:
  push:
    branches: [main]
    paths:
      - 'services/signup-relay/**'
      - '.github/workflows/deploy-signup-relay.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Every job in this repository declares a ceiling --
    # test_workflows.py::test_every_job_declares_a_timeout guards that.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: services/signup-relay/package-lock.json
      - name: Install
        working-directory: services/signup-relay
        run: npm ci
      - name: Test
        working-directory: services/signup-relay
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: services/signup-relay/package-lock.json
      # For the two derivations the Deploy step below makes. The relay's
      # own tests need no Python at all.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.5.x'
      - name: Check whether the integration is configured
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN not set - signup relay deploy skipped. This is a normal state until the Cloudflare account is connected."
          elif grep -q "REPLACE_WITH_" services/signup-relay/wrangler.toml; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "services/signup-relay/wrangler.toml still has a placeholder id - signup relay deploy skipped until the KV namespace is created and its id filled in. See services/signup-relay/README.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: steps.gate.outputs.configured == 'true'
        working-directory: services/signup-relay
        run: npm ci
      - name: Deploy
        if: steps.gate.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          # The one origin this worker answers a CORS preflight for, and
          # the one repository it reads keys from, queues submissions on
          # and dispatches into. `services/signup-relay/wrangler.toml`
          # names neither, and `src/index.js` names no repository either --
          # see that configuration's own header, and
          # `services/auth-proxy/wrangler.toml`'s for the origin's
          # reasoning in full -- so both are derived here, from
          # `instance/config.json`, through the Python readers that own the
          # derivations (`published.Published.origin` and
          # `published.Identity.repository`). The same
          # `uv run --project tools python -c` shape `deploy.yml` already
          # uses for the repository it pushes a built site into, rather
          # than a second parser written in shell.
          origin="$(uv run --project tools python -c \
            'from convener_ops.published import load; print(load().origin)')"
          if [ -z "$origin" ]; then
            echo "::error::instance/config.json yielded no origin - refusing to deploy a relay that would answer a CORS preflight for nobody"
            exit 1
          fi
          repository="$(uv run --project tools python -c \
            'from convener_ops.published import load_identity; print(load_identity().repository)')"
          if [ -z "$repository" ]; then
            echo "::error::instance/config.json yielded no repository - refusing to deploy a relay that would dispatch nowhere"
            exit 1
          fi
          # Each --var reaches src/index.js as an env entry exactly as a
          # [vars] entry would, and wrangler clears every var it is not
          # given, so this deploy leaves the worker holding these two and
          # nothing a previous deploy set.
          cd services/signup-relay
          npx wrangler deploy --var "ALLOWED_ORIGIN:$origin" --var "REPOSITORY:$repository"
