name: Revoke a certificate

# R-21 (fix round 2): the operation spec S:7 names by itself
# ("Revocation"), and the one this module always had a tested, correct
# pure function for (`certificate.revoke`) and no caller at all until
# this round. A hand edit of the committed-clear register was ruled out
# (see `tools/convener_ops/cli.py::revoke_certificate`'s own docstring): it
# depends on a volunteer having a working checkout, finding the right
# file, editing the right row, and committing it correctly -- exactly the
# "a collaborator's goodwill or their post" dependency this project
# refuses to build on anywhere else -- and `revoke`'s own guard against
# naming an identifier that is not on record is unreachable from a text
# editor, which is precisely where that mistake gets made.
#
# CERTIFICATE_ID, never an address (R-22; see reissue-certificate.yml's
# own header comment for the full reasoning, which applies here
# unchanged). No signing key and no matching salt: revocation touches the
# register alone -- the token a revoked certificate's holder still
# carries keeps verifying forever; only the register's own `state` column
# says it should no longer be trusted.
on:
  workflow_dispatch:
    inputs:
      event_id:
        description: 'Event id, exactly as published (e.g. mrg-042)'
        required: true
        type: string
      certificate_id:
        description: 'Certificate id to revoke, exactly as printed on the document'
        required: true
        type: string

# Shared with issue-certificates.yml and reissue-certificate.yml -- see
# issue-certificates.yml's own comment on this same group.
concurrency:
  group: certificates-${{ inputs.event_id }}
  cancel-in-progress: false

jobs:
  revoke:
    runs-on: ubuntu-latest
    # Checkout, `uv sync`, one register read-modify-write and the commit
    # retry loop below -- no decrypt, no signature, no attendance fetch,
    # so no private key or platform secret is read at all.
    timeout-minutes: 5
    permissions:
      contents: write
      # Critical A, fix round 3: see issue-certificates.yml's own comment
      # on this same addition -- this job's commit below also pushes with
      # GITHUB_TOKEN and needs `actions: write` to dispatch
      # publish-vitrine.yml directly afterwards.
      actions: write
    env:
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.5.x'
      - name: Revoke the named certificate
        env:
          EVENT_ID: ${{ inputs.event_id }}
          CERTIFICATE_ID: ${{ inputs.certificate_id }}
          # Critical A, fix round 3: see issue-certificates.yml's own
          # comment on this same env var.
          GH_TOKEN: ${{ github.token }}
        # Re-derive rather than rebase on a rejected push, the same shape
        # every other commit-and-push step in this repository uses.
        # `convener-revoke-certificate` is idempotent on an already-revoked
        # entry (it sets `state` to the same value again), so re-running
        # it after a fetch-and-reset-hard reproduces this revocation
        # cleanly alongside whatever a concurrent writer just landed.
        run: |
          set -e
          git config user.name "convener-certificates"
          git config user.email "convener-certificates@users.noreply.github.com"

          for attempt in 1 2 3; do
            (cd tools && uv run convener-revoke-certificate)
            if [ -f "data/events/$EVENT_ID/certificates.yml" ]; then
              git add "data/events/$EVENT_ID/certificates.yml"
            fi
            if git diff --staged --quiet; then
              # Small item 1, fix round 3: see issue-certificates.yml's
              # own comment on this same warning. For revoke this branch
              # is reached only when the named certificate was already
              # revoked -- an idempotent no-op an operator still deserves
              # to see named, not indistinguishable from a genuine
              # revocation.
              echo "::warning::convener-revoke-certificate ran but wrote nothing -- see this run's own log above for why"
              exit 0
            fi
            git commit -m "data: revoke a certificate for $EVENT_ID"
            if git push; then
              # Critical A, fix round 3: see issue-certificates.yml's own
              # comment on this same dispatch.
              gh workflow run publish-vitrine.yml --ref "$TARGET_BRANCH" ||
                echo "::warning::failed to trigger publish-vitrine.yml -- rerun it manually from the Actions tab"
              # Critical 1, fix round 1 (task 13): see
              # issue-certificates.yml's own comment on this same
              # addition -- publish-vitrine.yml alone never rebuilt the
              # file the verification page fetches; deploy.yml does. A
              # revocation is exactly the case this matters most for: the
              # holder's own signature still verifies (spec S:7's own
              # "la signature reste valide"), and only the register's own
              # state can tell a visitor it was revoked.
              gh workflow run deploy.yml --ref "$TARGET_BRANCH" ||
                echo "::warning::failed to trigger deploy.yml -- rerun it manually from the Actions tab"
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- re-deriving against the latest $TARGET_BRANCH and retrying"
            git fetch origin "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"
          done
          echo "::error::push failed after 3 attempts -- the revocation was computed but not saved"
          exit 1
