name: Sweep elapsed events

# Critical A, fix round 3: the commit step below pushes with this job's
# own GITHUB_TOKEN, which cannot fire publish-vitrine.yml's `push`-
# triggered `paths:` trigger (`data/speakers.yml` is one of the paths it
# names) -- GitHub's recursion guard. The re-review found `events-public.json`
# has therefore never been republished after a nightly sweep, a live
# phase-3 defect fixed here alongside the identical one in the three
# certificate workflows (see issue-certificates.yml's own comment on the
# same mechanism).
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # See this file's own header comment: dispatching
      # publish-vitrine.yml needs `actions: write`, the same as the three
      # certificate workflows.
      actions: write
    env:
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.5.x'
      - name: Sweep
        working-directory: tools
        run: uv run convener-sweep
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "convener-sweep"
          git config user.email "convener-sweep@users.noreply.github.com"
          git add data/speakers.yml
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "data: sweep elapsed events and expired vote windows"
          for attempt in 1 2 3; do
            if git push; then
              gh workflow run publish-vitrine.yml --ref "$TARGET_BRANCH" ||
                echo "::warning::failed to trigger publish-vitrine.yml -- rerun it manually from the Actions tab"
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- rebasing onto latest and retrying"
            git pull --rebase
          done
          echo "::error::push failed after 3 attempts -- sweep result was not saved"
          exit 1
