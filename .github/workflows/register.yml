# `docs/governance/register.md` is derived, never authored: this job rewrites
# it in full from the commit history, so a row added by hand does not survive
# the next push. It commits only when the derivation actually changed.

name: Derive the decision register

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    # Minor 2 (fix round 1, task 16): closes the project-wide gap
    # test_workflows.py::test_every_job_declares_a_timeout now guards.
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The register is a function of the whole history, not of the push
          # that triggered this run. A shallow clone would silently derive a
          # truncated register and commit it as if it were complete.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.5.x'
      - name: Derive
        working-directory: tools
        run: uv run convener-register
      - name: Commit
        run: |
          set -e
          git config user.name "convener-register"
          git config user.email "convener-register@users.noreply.github.com"
          git add docs/governance/register.md
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "docs: regenerate the decision register"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- rebasing onto latest and retrying"
            git pull --rebase
            # The rebase brought commits this register has never seen, and one
            # of them may be a decision. Deriving again is what keeps "the
            # register is a function of the history" true after a race; a plain
            # retry would push a register that is already out of date.
            (cd tools && uv run convener-register)
            git add docs/governance/register.md
            if ! git diff --staged --quiet; then
              git commit --amend --no-edit
            fi
          done
          echo "::error::push failed after 3 attempts -- the register was not saved"
          exit 1
