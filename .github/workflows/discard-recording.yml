name: Discard a recording

# The other route beside recording.yml: for
# a recording that must never be retrieved, because retrieving it (per
# release_recording's own guard) means converting it to MP4, and a
# converted file stays publicly reachable at its own URL forever, even
# after the conference is deleted -- verified against the provider, not
# assumed. Two cases only, both named in
# tools/convener_ops/journey/platform_fcc.py's module docstring's "Which recordings
# take which route" section: the discussion segment, recorded on purpose
# by the hosting runbook's three-step discipline but never published; and
# a talk whose publication consent was withheld.
#
# `convener-discard-recording` asks for no proof of retrieval at all -- none
# may exist, on purpose -- and instead requires `confirm_discard` to be
# typed exactly as "discard <event_id>" (e.g. "discard mrg-042"), the same
# "type the name to confirm" discipline a repository-deletion UI uses for
# its own irreversible action. It never reads the runbook's retrieval
# tick and never accepts it as a substitute: ticking that box cannot make
# this workflow decide there is nothing to affirm.
#
# This workflow never downloads the recording and never triggers a
# conversion, the same as recording.yml.
on:
  workflow_dispatch:
    inputs:
      event_id:
        description: 'Event id, exactly as published (e.g. mrg-042)'
        required: true
        type: string
      conference_id:
        description: >-
          The FreeConferenceCall conference id for this event (visible in
          its own web-interface URL for the conference).
        required: true
        type: string
      confirm_discard:
        description: >-
          Type exactly: discard <event_id> -- e.g. "discard mrg-042". This
          deletes the recording WITHOUT retrieving it. Irreversible.
        required: true
        type: string

# Shares its group name with recording.yml's own, deliberately: the two
# workflows touch the same underlying FCC conference recording and must
# never race each other through get_recording / delete_recording /
# get_recording again, whichever route is running. Queued, not cancelled
# -- a run mid-delete must finish.
concurrency:
  group: recording-${{ inputs.event_id }}
  cancel-in-progress: false

jobs:
  discard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.5.x'
      - name: Discard the recording, without retrieving it
        working-directory: tools
        env:
          EVENT_ID: ${{ inputs.event_id }}
          CONVENER_FCC_CONFERENCE_ID: ${{ inputs.conference_id }}
          CONFIRM_DISCARD: ${{ inputs.confirm_discard }}
          # Absent is D-13's ordinary state: with no token configured,
          # convener-discard-recording finds the manual implementation instead,
          # which holds no recording storage of its own, and exits 0.
          CONVENER_MEETING_API_TOKEN: ${{ secrets.CONVENER_MEETING_API_TOKEN }}
        run: uv run convener-discard-recording
