name: Deploy app

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-app.yml'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Test
        working-directory: app
        run: npm test -- --run

      - name: Build
        working-directory: app
        run: npm run build

      - name: Publish to gh-pages /app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Copy build output to a temp location before switching branches
          mkdir -p /tmp/app-dist
          cp -r app/dist/. /tmp/app-dist/

          # Switch to gh-pages (create orphan if it doesn't exist yet)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch origin gh-pages:gh-pages
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
            git commit --allow-empty -m "init gh-pages"
          fi

          rm -rf app
          mkdir -p app
          cp -r /tmp/app-dist/. app/
          touch app/.nojekyll

          git add app
          if git diff --staged --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "deploy: app"
            git push origin gh-pages
          fi
