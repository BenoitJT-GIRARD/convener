name: Publish vitrine data

# R-19 (fix round 1, task 12): a revocation is a change to
# data/events/<id>/certificates.yml, and until this trigger named that
# path, such a change would not even fire this workflow at all. The
# `paths:` trigger below still names certificates.yml for that reason,
# even though nothing in this job's own steps depends on that path any
# more -- see the Minor 5 comment further down for what changed and why.
#
# Critical A (fix round 3): the `paths:` trigger above is still correct,
# but it is unreachable in the one case it exists for. GitHub does not
# start a new workflow run from a push made with the checkout's own
# `GITHUB_TOKEN` -- the recursion guard -- and issue-certificates.yml,
# reissue-certificate.yml, revoke-certificate.yml and sweep.yml all commit
# with exactly that token (zero-cost: no new secret). So `workflow_dispatch`
# is added here, and each of those four jobs invokes it directly as their
# own last step once they have actually changed something --
# `workflow_dispatch` is one of the documented exceptions to the recursion
# guard, so the caller's own `GITHUB_TOKEN` is enough. See any of those
# workflows' own "Trigger public data publication" step for the other half
# of this fix.
#
# Minor 5 (fix round 1, task 13): this workflow used to also write
# `public-data/certificates-public.json` to the showcase's own
# `src/_data/certificates.json` -- a file no Eleventy template in that
# repository ever reads (`grep -rn certificates src/` there is empty).
# That write was removed: it made the three certificate workflows *look*
# like they refreshed the public register, which is how the register
# going stale survived three earlier fix rounds. What actually serves the
# register a verifier reads is `deploy.yml`'s own "Build public data"
# step, which ships `certificates.json` inside the app's own built
# `dist/` -- see that workflow's own comment for why that, and not a
# second write here, is the one writer for that file.
#
# The three certificate workflows still dispatch this workflow too
# (beside their own new deploy.yml dispatch, Critical 1) even though
# nothing they change affects `events-public.json` either -- the ruling
# for that fix asked for the new dispatch beside the existing one, not in
# place of it, so removing it is left alone as out of this change's own
# scope. Such a dispatch now finds nothing changed here and exits as a
# no-op, the ordinary D-13 shape, not a defect -- flagged in this round's
# own report rather than pruned unasked.
on:
  push:
    branches: [main]
    paths:
      - 'data/speakers.yml'
      - 'data/events/*/certificates.yml'
      - 'tools/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # Minor 2 (fix round 1, task 16): closes the project-wide gap
    # test_workflows.py::test_every_job_declares_a_timeout now guards.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.5.x'
      - name: Build public data
        working-directory: tools
        run: uv run convener-public-data
      - name: Push to example-showcase
        env:
          DEPLOY_TOKEN: ${{ secrets.VITRINE_DEPLOY_TOKEN }}
        run: |
          set -e
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "VITRINE_DEPLOY_TOKEN not set — skipping push (set up the secret to enable)."
            exit 0
          fi
          git config --global user.name "convener-publisher"
          git config --global user.email "convener-publisher@users.noreply.github.com"
          git clone --depth 1 \
            "https://x-access-token:${DEPLOY_TOKEN}@github.com/example-instance/example-showcase.git" /tmp/vit
          mkdir -p /tmp/vit/src/_data
          cp public-data/events-public.json /tmp/vit/src/_data/events.json
          cd /tmp/vit
          git add src/_data/events.json
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "data: refresh public events"
          # This job and Deploy app both clone example-showcase fresh and each
          # only ever stages its own disjoint subtree (src/_data/ here,
          # app/ there) -- but that makes the *commits* conflict-free, not
          # the *push*. git push is branch-atomic, not path-atomic: two
          # runs can each clone before the other pushes, and the loser's
          # push is a plain non-fast-forward rejection. A rebase is safe
          # here precisely because the subtrees never overlap, so replaying
          # this commit on top of the other's can never conflict.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- rebasing onto latest and retrying"
            git pull --rebase
          done
          echo "::error::push failed after 3 attempts -- the public events feed was not published"
          exit 1
