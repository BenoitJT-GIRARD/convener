name: Publish vitrine

# A revocation is a change to
# data/events/<id>/certificates.yml, and until this trigger named that
# path, such a change would not even fire this workflow at all. The
# `paths:` trigger below still names certificates.yml for that reason,
# even though nothing in this job's own steps depends on that path any
# more -- see the comment further down for what changed and why.
#
# The `paths:` trigger above is still correct,
# but it is unreachable in the one case it exists for. GitHub does not
# start a new workflow run from a push made with the checkout's own
# `GITHUB_TOKEN` -- the recursion guard -- and issue-certificates.yml,
# reissue-certificate.yml, revoke-certificate.yml and sweep-and-notify.yml all commit
# with exactly that token (zero-cost: no new secret). So `workflow_dispatch`
# is added here, and each of those four jobs invokes it directly as their
# own last step once they have actually changed something --
# `workflow_dispatch` is one of the documented exceptions to the recursion
# guard, so the caller's own `GITHUB_TOKEN` is enough. See any of those
# workflows' own "Trigger public data publication" step for the other half
# of this fix.
#
# This workflow used to also write
# `public-data/certificates-public.json` to the showcase's own
# `src/_data/certificates.json` -- a file no Eleventy template in that
# repository ever reads (`grep -rn certificates src/` there is empty).
# That write was removed: it made the three certificate workflows *look*
# like they refreshed the public register, which is how the register
# going stale survived three earlier fix rounds. What actually serves the
# register a verifier reads is `deploy.yml`'s own "Build public data"
# step, which ships `certificates.json` inside the app's own built
# `dist/` -- see that workflow's own comment for why that, and not a
# second write here, is the one writer for that file.
#
# The three certificate workflows used to
# still dispatch this workflow too, beside their own deploy.yml dispatch,
# even though nothing they change affects
# `events-public.json` either. That dead motion outlived the fix that
# added the deploy.yml dispatch, because that fix asked for the new
# dispatch beside the existing one and not for a scope to remove it in.
# It is gone: `issue-certificates.yml`, `reissue-certificate.yml` and
# `revoke-certificate.yml` no longer dispatch this workflow at all --
# each dispatched run used to find nothing changed here and exit as a
# no-op (the ordinary D-13 shape, not a defect, but motion with no
# effect all the same). `sweep-and-notify.yml` and `retention.yml` still dispatch
# this workflow, unaffected: the sweep genuinely can change
# `data/speakers.yml`, this workflow's own input.
#
# Renamed from "Publish vitrine data" when
# the showcase's own templates (`index.njk`, `layout.njk`, `style.css`,
# `.eleventy.js`, fonts) moved from the published repository into this repository's own
# `site/`, so that repository holds no source any more (D-15: private
# source, public artefact). This job used to copy one generated data file
# into a checkout of the published repository; it now builds the whole site here and
# pushes the built output to that repository's root, which is exactly
# what its already-active GitHub Pages setting ("branch main, folder
# root") serves -- the same root `deploy.yml` already publishes `app/`
# into. `site/**` joins the `paths:` trigger below for the same reason
# `tools/**` is already there: a change with no effect on
# `events-public.json` still has to rebuild and republish the site.
on:
  push:
    branches: [main]
    paths:
      - 'data/speakers.yml'
      - 'data/events/*/certificates.yml'
      - 'tools/**'
      - 'site/**'
      # `site/.eleventy.js` reads the one address this
      # project is published at from here, so every internal link and
      # every absolute URL this build emits depends on it. Without this
      # entry, changing that address would leave the showcase published at
      # the old one until some unrelated commit happened to run this.
      - 'config/instance.json'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # Every job in this repository declares a ceiling --
    # test_workflows.py::test_every_job_declares_a_timeout guards that.
    # 15 rather than 10, because this job also runs `npm ci` and
    # an Eleventy build, the same allowance deploy.yml's own mixed
    # Python/Node job already gets.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.5.x'
      - name: Build public data
        working-directory: tools
        run: uv run convener-public-data
      # site/src/_data/events.json is committed as a build fixture
      # only (see site/README.md) -- overwritten here from the file the
      # step above just generated, so the build below always reflects
      # the current private data, never the fixture a contributor last
      # committed.
      - name: Refresh site data
        run: cp public-data/events-public.json site/src/_data/events.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json
      - name: Install site
        working-directory: site
        run: npm ci
      # The registration island this build
      # mounts (event.njk) posts straight to the signup relay from this
      # same document, so site/src/_data/csp.js's own connect-src needs
      # that relay's origin at build time -- the identical repository
      # variable deploy.yml already forwards into the application build,
      # read here rather than a second, hand-typed copy of the same
      # address (D-14). Absent (a private fork, a run before the relay is
      # deployed) is D-13's ordinary state: csp.js omits the origin
      # rather than naming one nothing will ever call.
      - name: Build site
        working-directory: site
        env:
          VITE_SIGNUP_RELAY_URL: ${{ vars.VITE_SIGNUP_RELAY_URL }}
        run: npm run build
      # The rule is absolute -- no room
      # link on any public page, ever; it is delivered only by the
      # confirmation e-mail, and the event page is what
      # replaces it in every announcement instead.
      # `tools/tests/test_site.py` already proves the templates keep a
      # room link off a build made from a committed fixture, on every
      # push; this is the same check, run once more here against the
      # *real* room links this job is seconds away from publishing
      # alongside, the same "prove it against what is actually about to
      # ship, not only a fixture" argument the D-25 empty-build guard
      # further down this file already makes for a different failure
      # mode. A field can be non-empty in production and still be empty
      # in every fixture a test happens to carry.
      #
      # Reads `data/speakers.yml`'s own `zoom_link`
      # directly, never `public-data/events-public.json` -- that file no
      # longer carries the room link under any name. It used to, as
      # `registration_link` (`public_data.py::PUBLIC_FIELD_SOURCES`), a
      # name that read as exactly the opposite of what it carried once
      # the event page gained its own registration form. Somebody working
      # on that page nearly rendered it believing it was the address to
      # register at. The mapping is gone rather than renamed, so the one
      # place left to learn what a leak would look like is the private
      # record the room link actually lives in.
      - name: Refuse to publish a page that leaks the room link
        run: |
          set -e
          links=$(uv run --project tools python -c '
          from convener_ops.paths import repo_root
          from convener_ops.yaml_safe import safe_load

          speakers = safe_load(
              (repo_root() / "data" / "speakers.yml").read_text(encoding="utf-8")
          )
          for entry in speakers:
              if isinstance(entry, dict) and entry.get("zoom_link"):
                  print(entry["zoom_link"])
          ')
          if [ -z "$links" ]; then
            echo "no speaker record carries a room link -- nothing to check"
            exit 0
          fi
          leaked=0
          while IFS= read -r link; do
            [ -z "$link" ] && continue
            hits=$(grep -rlF -- "$link" site/_site || true)
            if [ -n "$hits" ]; then
              echo "::error::room link leaked into: $hits"
              leaked=1
            fi
          done <<< "$links"
          if [ "$leaked" -ne 0 ]; then
            echo "::error::refusing to publish -- a room link reached the built site"
            exit 1
          fi
      - name: Push to the published repository
        env:
          DEPLOY_TOKEN: ${{ secrets.VITRINE_DEPLOY_TOKEN }}
        run: |
          set -e
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "VITRINE_DEPLOY_TOKEN not set — skipping push (set up the secret to enable)."
            exit 0
          fi
          git config --global user.name "convener-publisher"
          git config --global user.email "convener-publisher@users.noreply.github.com"
          # Where the built output is pushed. Derived from
          # `config/instance.json`'s own `published_url`, never named here:
          # GitHub Pages serves a project repository at
          # `https://<owner>.github.io/<repository>/` and nowhere else, so
          # the address a visitor sees and the repository this push writes
          # into are one fact, not two. They used to be
          # two, and changing the declared address moved every public URL
          # while still publishing into the previous instance's repository.
          # Read through the Python reader that owns the derivation
          # (`published.Published.publish_repository`, which refuses rather
          # than guessing for an address that is not a Pages one) -- the
          # same `uv run --project tools python -c` shape the room-link
          # guard above already uses, rather than a fourth parser written
          # in shell.
          target="$(uv run --project tools python -c \
            'from convener_ops.published import load; print(load().publish_repository)')"
          git clone --depth 1 \
            "https://x-access-token:${DEPLOY_TOKEN}@github.com/${target}.git" /tmp/vit
          SITE_OUTPUT="$GITHUB_WORKSPACE/site/_site"

          # D-25: "a control that cannot fail loudly is not a
          # control." Eleventy exits 0 on "Wrote 0 files" -- a wrong
          # dir.input, a template error that skips every page, or any config
          # change that makes the build emit nothing all "succeed" as far as
          # the step above is concerned. Without this guard, the wipe below
          # would then remove the published site and commit an empty
          # publication over a working one. Checked once, before the wipe
          # ever starts touching /tmp/vit -- a build that cannot replace what
          # it would remove must never be allowed to begin removing it.
          if [ ! -f "$SITE_OUTPUT/index.html" ]; then
            echo "::error::$SITE_OUTPUT/index.html is missing -- refusing to publish; the vitrine's published root was left untouched"
            exit 1
          fi
          # A file-count floor beside the index.html check: passthrough
          # copies (fonts, style.css, .nojekyll) can survive a build that
          # broke template rendering in a way that still writes an
          # index.html left over from a previous run in a re-used
          # workspace -- unlikely on a fresh runner, but this floor is the
          # cheap second check that does not rely on that being true. Five,
          # not the current count of eight: low enough that adding a page
          # never needs this number touched, high enough
          # that a build producing only one or two files still trips it.
          site_file_count=$(find "$SITE_OUTPUT" -type f | wc -l)
          if [ "$site_file_count" -lt 5 ]; then
            echo "::error::$SITE_OUTPUT only holds $site_file_count file(s) -- refusing to publish; the vitrine's published root was left untouched"
            exit 1
          fi

          # Wipe everything this job owns at the vitrine's root -- every
          # entry except .git and app/, Deploy app's own disjoint subtree --
          # then lay the fresh build over it whole. A wipe-then-copy, not a
          # diff, so a page removed from site/ disappears from the
          # publication too. New pages extend this by appearing under
          # site/, never by editing this step.
          refresh_published_site() {
            find /tmp/vit -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'app' -exec rm -rf {} +
            cp -r "$SITE_OUTPUT/." /tmp/vit/
          }

          refresh_published_site
          cd /tmp/vit
          # --force: git add still honours the target repository's own
          # .gitignore, and a rule there matching a built asset name would
          # silently drop it from the publication with no error.
          git add --force -A
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "site: refresh published build"
          # This job and Deploy app both clone the published repository fresh and each
          # only ever stages its own disjoint subtree (the site's own
          # root-level files here, app/ there) -- but that makes the
          # *commits* conflict-free, not the *push*. git push is
          # branch-atomic, not path-atomic: two runs can each clone before
          # the other pushes, and the loser's push is a plain
          # non-fast-forward rejection.
          #
          # The retry re-derives rather than rebases -- the same defence
          # deploy.yml's own "Commit survey status" step uses, and for the
          # identical reason: this commit is a wholesale rewrite of
          # generated files (built HTML, a stylesheet, binary fonts), not
          # an append. `git rebase` replays a diff computed against a base
          # that may no longer be the parent, which on a full-file rewrite
          # is exactly where it conflicts instead of applying. Re-copying
          # the already-built site/_site over a freshly reset tree
          # reproduces the identical output on every attempt: nothing here
          # depends on what is currently on the vitrine's main branch.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- re-deriving against the latest main and retrying"
            git fetch origin main
            git reset --hard origin/main
            refresh_published_site
            git add --force -A
            git commit -m "site: refresh published build"
          done
          echo "::error::push failed after 3 attempts -- the published site was not updated"
          exit 1
