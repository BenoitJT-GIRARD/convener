# Detects, never prevents (see tools/convener_ops/governance/dispatch_alert.py's own module
# docstring for the full reasoning). A security review asked for
# every sensitive secret to be scoped behind a GitHub `environment:` with a
# deployment branch policy -- real prevention: a `workflow_dispatch` against
# a branch the policy does not allow would be refused the secret before any
# step ran. That control requires GitHub Team or GitHub Pro on a private
# repository (verified against GitHub's own documentation, not assumed),
# and this repository is on
# GitHub Free. The zero-cost constraint does not suspend for security, so
# this workflow is what zero cost actually buys instead: a loud, fast
# report once a sensitive workflow has already run against a branch other
# than `main`, close enough behind the run itself to matter, but never
# before it.
#
# `types: [requested]` fires within seconds of the triggering run being
# queued -- not after it finishes -- because `completed` would mean this
# workflow's own alert can only ever confirm something that is already long
# over. The `workflow_run` event itself is what is cheap to receive; the
# job below decides, from the payload alone, whether anything is worth
# starting a runner for. See its own comment for what that decision used
# to cost. Nothing here calls the Actions API to cancel that run: a "best
# effort" cancel step was considered and deliberately left out. GitHub gives
# no guarantee about the race between a monitor's own cancel call and a
# fast, single-step exfiltration with no checkout ahead of it, and a step
# named anything close to "stop the run" reads as prevention to anyone
# skimming the Actions tab -- exactly the failure this audit keeps finding
# elsewhere in this project. A control that cannot be described
# unambiguously in its own YAML does not go in this file.
#
# The `workflows:` list below is every workflow this repository's own tests
# (tools/tests/repository/test_workflows.py) confirm declares a secret
# beyond GITHUB_TOKEN, checked structurally against every `.github/
# workflows/*.yml` file rather than trusted to stay hand-matched to this
# list. Adding a workflow that declares a new secret without adding its
# `name:` here fails that test, by name, in CI -- see that module for the
# mutation this is proven against. This workflow does not, and must not,
# watch itself: `workflow_run` re-triggering on its own run would be a
# self-loop, and there is nothing sensitive in what it reads (CONVENER_NOTIFY_
# THREAD and CONVENER_NOTIFY_MENTION are an issue number and a team handle, not
# credentials -- see docs/operating/operations.md, "Board notifications").
#
# `workflow_run` only ever runs the copy of *this* file committed to the
# default branch (GitHub's own documented behaviour), regardless of which
# branch the triggering run used -- so, unlike every workflow it watches,
# this one cannot be edited or suppressed by a branch push. Only a change
# actually merged to `main` can touch it.
name: Monitor secret-bearing workflow runs

on:
  workflow_run:
    workflows:
      - Deliver a certificate
      - Mint event keys
      - Tell the registrants of a cancelled edition
      - Deploy app
      - Deploy auth relay
      - Deploy form relay
      - Deploy signup relay
      - Discard a recording
      - Erase a registration early
      - Handle proposal
      - Handle registration
      - Invite the post-event survey
      - Issue certificates
      - Match attendance
      - Publish showcase
      - Reissue a certificate
      - Release a recording
      - Resend a registration confirmation
      - Retention sweep
      - Sweep and notify the board
    types: [requested]

concurrency:
  # Keyed on the triggering run's own id, never on this workflow's own: two
  # different sensitive runs happening around the same time (routine -- a
  # scheduled job and an operator command can easily overlap) must never
  # cancel or wait on each other's alert.
  group: secret-workflow-monitor-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  monitor:
    # This workflow asks exactly one question -- was the triggering run
    # requested against a ref other than `main`? -- and the answer is in
    # the event payload. So it is read there, for nothing, instead of
    # being read by a runner.
    #
    # **The guard this replaces, and what it cost.** It skipped two
    # events (`schedule`, `repository_dispatch`) on the documented
    # platform behaviour that GitHub starts those only from the default
    # branch, and deliberately kept watching `push` -- because "skip
    # `push` too" would have rested on a property of *the nineteen
    # watched files* (that none loses its `branches: [main]`) rather than
    # on anything the platform promises. That argument was right about
    # the guard it was refusing, and it is still right: a guard on the
    # triggering *event name* is a proxy for the branch, and a proxy can
    # come apart from the fact it stands for.
    #
    # `head_branch` is not a proxy. It is the branch the run was actually
    # requested against, reported by the platform for the run in hand,
    # and it is the very value `dispatch_alert.alert_message` decides on:
    # that function returns `None` **exactly when `head_branch ==
    # "main"`** and reports every other value. Hoisting its own condition
    # into this expression cannot lose a detection the function would
    # have made -- there is no watched-file property in it to come apart.
    # A watched workflow that loses its `branches: [main]` and runs on
    # some other branch still arrives here with that branch in the
    # payload, and this guard is true.
    #
    # **Written `!= 'main'`, never `== 'main'` negated elsewhere**, so the
    # one case that must never read as safe stays loud: GitHub omits
    # `head_branch` for a run whose branch has since been deleted, and an
    # absent value compares unequal here, runs the job, and reaches
    # `alert_message`'s own "(branch unknown -- see the run itself)". The
    # direction of this comparison is the whole safety property.
    #
    # **What it cost, measured** on the instance this product was derived
    # for, over 400 runs on 2026-09-13: this workflow took 465 of 874
    # minutes -- 53% of everything the repository spent -- across 123 runs
    # of which 21 succeeded. It fires once per *watched* workflow a push
    # starts, and an ordinary push starts four of them, so a volunteer
    # ticking one runbook box paid for four full Python toolchain
    # installs to compute that `head_branch` was `main`. At 289 seconds
    # against a `timeout-minutes: 5` ceiling, 56 of those runs had
    # already failed on the timeout *before* the account ran out of
    # included minutes. An alarm that cries on every push is an alarm
    # nobody reads, so this was not only a cost: it was the control
    # degrading into noise.
    #
    # A skipped job starts no runner and is billed nothing. On `main`
    # this job now costs what it is worth, which is nothing, and off
    # `main` it runs alone with the whole ceiling to itself.
    #
    # `'main'` is spelled here and in `dispatch_alert.MAIN_BRANCH`.
    # `tools/tests/repository/test_workflows.py` holds the two together,
    # refuses a guard that narrows on the triggering event name instead of
    # reading the branch, and runs `alert_message` itself to prove the
    # silence this guard is built on is still the function's own.
    if: github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-latest
    # Ten, not five. The ceiling this job used to share with three
    # siblings on every push is now its own, and the failure mode that
    # matters here is the alarm not being raised -- never the alarm
    # taking a minute longer than usual to raise itself.
    timeout-minutes: 10
    permissions:
      contents: read
      # The one thing this workflow is allowed to do to the outside world,
      # the same scope sweep-and-notify.yml already carries for the same
      # reason.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.5.x'
      - name: Evaluate
        id: evaluate
        working-directory: tools
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ACTOR: ${{ github.event.workflow_run.actor.login }}
          CONVENER_NOTIFY_THREAD: ${{ secrets.CONVENER_NOTIFY_THREAD }}
          CONVENER_NOTIFY_MENTION: ${{ secrets.CONVENER_NOTIFY_MENTION }}
        # Always exits 0 -- see convener_ops.cli.alert_secret_workflow_run's own
        # docstring for why failing the job is this workflow's own decision,
        # made in the last step below, and not this command's.
        run: uv run --frozen convener-alert-secret-workflow-run
      - name: Post to the board channel, if one is configured
        # Bonus, not the control: a channel that is not configured must
        # never make the failure below disappear -- see the last step.
        if: hashFiles('notify-body.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          THREAD: ${{ secrets.CONVENER_NOTIFY_THREAD }}
        run: gh issue comment "$THREAD" --body-file notify-body.md
      - name: Fail -- this run was requested against a ref other than main
        if: steps.evaluate.outputs.off_main == 'true'
        run: |
          echo "::error::${{ github.event.workflow_run.name }} was requested against '${{ github.event.workflow_run.head_branch }}', not main -- see this run's own log above, and this workflow's own header comment for what that does and does not mean"
          exit 1
