name: Reissue a certificate

# An operator's deliberate correction to one
# already-issued certificate -- a mis-typed name fixed in a re-submitted
# registration, a corrected attendance export -- mints a fresh identifier
# and never touches the row it replaces, and requires that row to already
# be revoked (`revoke-certificate.yml`). Reusing
# `convener-issue-certificates`'s own idempotent lookup for this would let a
# routine re-run silently resurrect a correction nobody asked for; see
# `tools/convener_ops/certificate.py::reissue`'s own docstring.
#
# The input is CERTIFICATE_ID, never an address. A
# `workflow_dispatch` input is rendered on the run page and retained with
# the run for as long as its own history exists -- longer than the
# 14-day artefact this project uses everywhere else it has to carry
# personal data at all. That exposure is why the input is not an address.
# The certificate identifier is random, public by design, already
# printed on the document and already published in
# certificates-public.json -- it names exactly one certificate without
# naming a person. `convener-reissue-certificate` resolves it to a
# registration the same way `certificate.issue` does, run in reverse: see
# that command's own docstring in tools/convener_ops/cli.py.
#
# It also takes an optional `conference_id`, the
# same provider identifier -- never an address -- `recording.yml` and
# `issue-certificates.yml` already take. Without it, the
# FCC path (CONVENER_MEETING_API_TOKEN configured) could not resolve any
# attendance at all; see issue-certificates.yml's own comment for the
# full reasoning, shared verbatim by both workflows' underlying command
# through `cli.py::_conference_ids_from_env`.
on:
  workflow_dispatch:
    inputs:
      event_id:
        description: 'Event id, exactly as published (e.g. mrg-042)'
        required: true
        type: string
      certificate_id:
        description: 'Certificate id to correct, exactly as printed on the document'
        required: true
        type: string
      conference_id:
        description: >-
          The FreeConferenceCall conference id for this event (only needed
          with CONVENER_MEETING_API_TOKEN configured). Leave blank for the
          manual implementation.
        required: false
        type: string

# Shared with issue-certificates.yml and revoke-certificate.yml -- see
# that workflow's own comment on this same group.
concurrency:
  group: certificates-${{ inputs.event_id }}
  cancel-in-progress: false

jobs:
  reissue:
    runs-on: ubuntu-latest
    # Checkout, `uv sync`, one decrypt pass, one attendance fetch, one
    # signature, plus the commit retry loop below.
    timeout-minutes: 10
    permissions:
      contents: write
      # See issue-certificates.yml's own comment
      # on this same addition -- this job's commit below also pushes with
      # GITHUB_TOKEN and needs `actions: write` to dispatch deploy.yml
      # directly afterwards.
      actions: write
    env:
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.5.x'
      - name: Resolve the event's key secret
        id: resolve
        working-directory: tools
        env:
          REGISTRATION_PAYLOAD: ${{ toJSON(inputs) }}
        run: uv run convener-registration-secret-name
      - name: Reissue the named certificate
        env:
          EVENT_ID: ${{ steps.resolve.outputs.event_id }}
          EVENT_PRIVATE_KEY: ${{ secrets[steps.resolve.outputs.secret_name] }}
          # Same two deliberate D-13 exceptions as issue-certificates.yml
          # -- see that workflow's own comment on CONVENER_SIGNING_KEY and
          # CONVENER_MATCHING_SALT.
          CONVENER_SIGNING_KEY: ${{ secrets.CONVENER_SIGNING_KEY }}
          CONVENER_MATCHING_SALT: ${{ secrets.CONVENER_MATCHING_SALT }}
          CONVENER_MEETING_API_TOKEN: ${{ secrets.CONVENER_MEETING_API_TOKEN }}
          # See issue-certificates.yml's own
          # comment on this same env var.
          CONVENER_FCC_CONFERENCE_ID: ${{ inputs.conference_id }}
          # A public certificate identifier, never an address -- see this
          # workflow's own header comment.
          CERTIFICATE_ID: ${{ inputs.certificate_id }}
          # See issue-certificates.yml's own
          # comment on this same env var.
          GH_TOKEN: ${{ github.token }}
        # Re-derive rather than rebase on a rejected push, the same shape
        # registration.yml and issue-certificates.yml both use.
        # `convener-reissue-certificate` mints a fresh random identifier on
        # every call, so a retry after a fetch-and-reset-hard produces a
        # *different* new identifier than the discarded attempt did --
        # correct, not merely tolerated: nothing about the discarded
        # attempt's own identifier was ever committed, pushed or handed
        # to anyone, so there is nothing for a second, genuinely fresh one
        # to contradict.
        run: |
          set -e
          git config user.name "convener-certificates"
          git config user.email "convener-certificates@users.noreply.github.com"

          for attempt in 1 2 3; do
            (cd tools && uv run convener-reissue-certificate)
            if [ -f "instance/data/events/$EVENT_ID/certificates.yml" ]; then
              git add "instance/data/events/$EVENT_ID/certificates.yml"
            fi
            if git diff --staged --quiet; then
              # See issue-certificates.yml's
              # own comment on this same warning -- an absent
              # CONVENER_SIGNING_KEY or CONVENER_MATCHING_SALT is the only way this
              # branch is reached for reissue (a resolved correction
              # always writes).
              echo "::warning::convener-reissue-certificate ran but wrote nothing -- see this run's own log above for why"
              exit 0
            fi
            git commit -m "data: reissue a certificate for $EVENT_ID"
            if git push; then
              # See issue-certificates.yml's own
              # comment on this same dispatch. There is no
              # publish-vitrine.yml dispatch beside this one any
              # more -- see issue-certificates.yml's own comment on why
              # that was dead motion for every certificate workflow.
              gh workflow run deploy.yml --ref "$TARGET_BRANCH" ||
                echo "::warning::failed to trigger deploy.yml -- rerun it manually from the Actions tab"
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- re-deriving against the latest $TARGET_BRANCH and retrying"
            git fetch origin "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"
          done
          echo "::error::push failed after 3 attempts -- the correction was computed but not saved"
          exit 1
