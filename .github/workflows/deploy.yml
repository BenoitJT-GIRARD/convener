name: Deploy handbook + app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install app deps
        working-directory: app
        run: npm ci

      - name: Test app
        working-directory: app
        run: npm test -- --run

      - name: Build app
        working-directory: app
        run: npm run build

      - name: Copy app bundle into MkDocs assets
        run: |
          rm -rf docs/assets/app
          mkdir -p docs/assets/app
          cp -r app/dist/* docs/assets/app/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install mkdocs-material mkdocs-git-revision-date-localized-plugin pyyaml

      - run: mkdocs gh-deploy --force
