name: Deploy app

on:
  push:
    branches: [main]
  workflow_dispatch:

# Three other workflows push to main, so two "Deploy app" runs overlapping is
# ordinary, not exotic. That is a different race from the one the retry loop
# below handles: this job and `publish-vitrine.yml` write disjoint subtrees
# of example-showcase (`app/` here, `src/_data/` there), so a rebase between them
# always replays cleanly and both pushes must land -- which is exactly what
# that loop is for, and it is untouched. Two *deploy* runs are not disjoint:
# both rewrite all of `app/`, so a rebase between them either conflicts on
# `index.html` (different hashed asset names from the same base, a red job)
# or replays cleanly and lets the *older* build silently overwrite the
# newer one -- worse, because nothing reports it.
#
# `cancel-in-progress: true` removes that case by construction rather than
# serialising the two runs and hoping the order holds: once a newer commit
# has started its own deploy, the older run's build has no reason to exist
# any more, so cancelling it is correct, not just cheaper (though it is also
# cheaper -- no runner minutes spent building something about to be
# overwritten). The group is scoped to `github.workflow`, this workflow's
# own name, so pasting this block into a future workflow file gives that
# workflow its own group automatically instead of silently colliding with
# this one -- and it is deliberately not shared with `publish-vitrine.yml`,
# which would serialise two jobs where only their pushes need ordering.
concurrency:
  group: deploy-app-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Minor 2 (fix round 1, task 16): closes the project-wide gap
    # test_workflows.py::test_every_job_declares_a_timeout now guards.
    timeout-minutes: 15
    permissions:
      # write, not read (fix round 2, R-41): this job now commits
      # public-data/survey-status.json back to this repository itself --
      # see the "Commit survey status" step below for why.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.5.x'
      # Task 13 (certificate verification page): `certificates.json`, part
      # of the app's own `public/` -- so it ships inside `app/dist/` and
      # `deploy.yml`'s existing "Push to example-showcase" step below carries it
      # into the showcase for free, with no second, separate write into
      # that repo's `app/` subtree to race against this workflow's own
      # wholesale refresh of it. Needs no secret: `convener-certificates-public-data`
      # only ever reads committed `data/events/*/certificates.yml` files.
      # An event with no certificates yet is a normal state (`cli.py`'s own
      # `certificates_public_data`), so this step never fails for want of
      # one -- `scripts/copy-certificates.mjs`, below, is equally tolerant
      # of this step never having run at all.
      #
      # Critical 1 (fix round 1, task 13): this step is what actually
      # keeps the register a verifier reads current, and it only runs when
      # this workflow does -- which a certificate issuance or revocation's
      # own push (made with the checkout's own GITHUB_TOKEN) can never
      # trigger via the `push:` clause above (the same recursion guard
      # `publish-vitrine.yml`'s own header comment explains). Each of
      # issue-certificates.yml, reissue-certificate.yml and
      # revoke-certificate.yml now dispatches this workflow directly with
      # `gh workflow run deploy.yml` as its own last step, alongside its
      # existing `publish-vitrine.yml` dispatch (which, after Minor 5,
      # no longer touches certificate data at all -- see that workflow's
      # own comment). Before this, only publish-vitrine.yml was dispatched,
      # which rebuilt a file the showcase never served; this step, and
      # this dispatch, are what a verifier's page actually depends on.
      - name: Build public data
        working-directory: tools
        run: uv run convener-certificates-public-data
      # R-37 (fix round 1, task 16): the post-event survey's per-event
      # switch, published as an operational fact rather than baked into
      # SurveyForm.tsx's own knowledge -- see convener_ops.cli.survey_status_
      # public_data's own docstring for why this is a second file and a
      # second step rather than folded into "Build public data" above.
      # scripts/copy-survey-status.mjs (part of the app's own `npm run
      # build`, below) is what actually bakes public-data/survey-status.json
      # into dist/, the same two-step shape copy-certificates.mjs already
      # uses for certificates.json.
      - name: Build survey status
        working-directory: tools
        run: uv run convener-survey-status-public-data
      # R-41 (fix round 2): committed here, not only baked into dist/ --
      # services/signup-relay reads this exact file, at this exact path,
      # through the GitHub Contents API against this repository (the same
      # credential and the same call shape it already uses for
      # keys/events/<id>.pub), because checking a deployed example-showcase URL
      # made the relay's answer depend on a deployment that was never
      # wired up, and made "the switch is on" true at a build-to-live lag
      # the relay has no business inheriting. `.gitignore` carries a
      # deliberate exception for this one file (see its own comment) --
      # every other file `public-data/` collects stays generated-only.
      #
      # `uv run convener-survey-status-public-data` above is deterministic given
      # the same data/speakers.yml (a sorted, deduplicated id list), so
      # `git diff --staged --quiet` below is a real no-op check, not a
      # formality: a run where no event's switch changed commits nothing.
      # The retry-on-rebase loop mirrors survey.yml's own, for the
      # identical reason -- this job's own push can race another push to
      # main, and a plain non-fast-forward rejection here must not fail
      # the whole deploy over one file neither Node build step depends on
      # having just been pushed (copy-survey-status.mjs reads the local
      # working copy written above, not what is on origin).
      - name: Commit survey status
        run: |
          set -e
          git config user.name "convener-publisher"
          git config user.email "convener-publisher@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add public-data/survey-status.json
            if git diff --staged --quiet; then
              echo "no change to commit"
              break
            fi
            git commit -m "data: refresh the published survey switch list"
            if git push; then
              break
            fi
            echo "push rejected (attempt $attempt/3) -- rebasing onto latest and retrying"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if [ "$attempt" = "3" ]; then
              echo "::error::push failed after 3 attempts -- survey-status.json was not published to this repo"
              exit 1
            fi
          done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Test
        working-directory: app
        run: npm test -- --run
      - name: Build
        working-directory: app
        env:
          VITE_AUTH_PROXY_URL: ${{ vars.VITE_AUTH_PROXY_URL }}
          VITE_GITHUB_APP_CLIENT_ID: ${{ vars.VITE_GITHUB_APP_CLIENT_ID }}
          VITE_SIGNUP_RELAY_URL: ${{ vars.VITE_SIGNUP_RELAY_URL }}
        run: npm run build
      - name: Push to example-showcase
        env:
          DEPLOY_TOKEN: ${{ secrets.VITRINE_DEPLOY_TOKEN }}
        run: |
          set -e
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "VITRINE_DEPLOY_TOKEN not set — skipping push (set up the secret to enable)."
            exit 0
          fi
          git config --global user.name "convener-publisher"
          git config --global user.email "convener-publisher@users.noreply.github.com"
          git clone --depth 1 \
            "https://x-access-token:${DEPLOY_TOKEN}@github.com/example-instance/example-showcase.git" /tmp/vit
          rm -rf /tmp/vit/app
          mkdir -p /tmp/vit/app
          cp -r app/dist/. /tmp/vit/app/
          cd /tmp/vit
          # --force: `git add` still honours the *target* repository's own
          # .gitignore, and a rule there matching a built asset name would
          # silently drop it from the deploy with no error.
          git add --force app
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "app: refresh build"
          # This job and Publish vitrine data both clone example-showcase fresh
          # and each only ever stages its own disjoint subtree (app/ here,
          # src/_data/ there) -- but that makes the *commits* conflict-free,
          # not the *push*. git push is branch-atomic, not path-atomic: two
          # runs can each clone before the other pushes, and the loser's
          # push is a plain non-fast-forward rejection. A rebase is safe
          # here precisely because the subtrees never overlap, so replaying
          # this commit on top of the other's can never conflict.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- rebasing onto latest and retrying"
            git pull --rebase
          done
          echo "::error::push failed after 3 attempts -- the build was not published"
          exit 1
