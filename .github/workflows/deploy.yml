name: Deploy app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Test
        working-directory: app
        run: npm test -- --run
      - name: Build
        working-directory: app
        env:
          VITE_AUTH_PROXY_URL: ${{ vars.VITE_AUTH_PROXY_URL }}
          VITE_GITHUB_APP_CLIENT_ID: ${{ vars.VITE_GITHUB_APP_CLIENT_ID }}
        run: npm run build
      - name: Push to example-showcase
        env:
          DEPLOY_TOKEN: ${{ secrets.VITRINE_DEPLOY_TOKEN }}
        run: |
          set -e
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "VITRINE_DEPLOY_TOKEN not set — skipping push (set up the secret to enable)."
            exit 0
          fi
          git config --global user.name "convener-publisher"
          git config --global user.email "convener-publisher@users.noreply.github.com"
          git clone --depth 1 \
            "https://x-access-token:${DEPLOY_TOKEN}@github.com/example-instance/example-showcase.git" /tmp/vit
          rm -rf /tmp/vit/app
          mkdir -p /tmp/vit/app
          cp -r app/dist/. /tmp/vit/app/
          cd /tmp/vit
          # --force: `git add` still honours the *target* repository's own
          # .gitignore, and a rule there matching a built asset name would
          # silently drop it from the deploy with no error.
          git add --force app
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "app: refresh build"
          # This job and Publish vitrine data both clone example-showcase fresh
          # and each only ever stages its own disjoint subtree (app/ here,
          # src/_data/ there) -- but that makes the *commits* conflict-free,
          # not the *push*. git push is branch-atomic, not path-atomic: two
          # runs can each clone before the other pushes, and the loser's
          # push is a plain non-fast-forward rejection. A rebase is safe
          # here precisely because the subtrees never overlap, so replaying
          # this commit on top of the other's can never conflict.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- rebasing onto latest and retrying"
            git pull --rebase
          done
          echo "::error::push failed after 3 attempts -- the build was not published"
          exit 1
