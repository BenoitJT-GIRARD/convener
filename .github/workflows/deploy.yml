name: Deploy app

on:
  push:
    branches: [main]
    # `paths-ignore:`, never `paths:`, and the
    # direction is the whole decision.
    #
    # This build's inputs cover very nearly the whole repository:
    # `app/package.json`'s own `prebuild` copies `assets/fonts/`, `docs/` (the
    # handbook, through `app/src/content/registry.ts`), `instance/keys/events/`,
    # `instance/keys/signing/`, `instance/public-data/certificates-public.json` and
    # `instance/public-data/survey-status.json` into the bundle, and the job's own
    # first steps run two `tools/` commands over `instance/data/`. A `paths:` list
    # for that is a list of nearly everything, and a path left out of it
    # publishes a stale bundle in silence -- D-25, the exact failure
    # `a11y.yml`'s own header comment spends twenty lines refusing.
    #
    # `paths-ignore:` fails the other way: a path forgotten here merely
    # runs this workflow when it did not strictly have to. For a workflow
    # whose *absence* is the defect, that is the only safe direction, so
    # this list holds only what provably cannot reach the bundle -- the
    # showcase (`site/`, published by `publish-showcase.yml`), the relays
    # (each with its own deploy workflow), and the three repository-root
    # files nothing under `app/` reads.
    # Nothing under `docs/` is on it any more, which is the plainest
    # statement of what `copy-handbook.mjs`'s registry allowlist already
    # decided: `docs/` is an input in full, and which of its pages ship is
    # that allowlist's answer, never this list's.
    #
    # `config/**` was on this list until the one
    # address this project is published at moved into `instance/config.json`,
    # which `app/vite.config.ts` now reads for every bundle's `base`.
    # `test_workflows.py::test_no_path_the_deploy_ignores_can_reach_the_
    # deployed_bundle` is what noticed, and it is exactly right to: with
    # that entry still here, changing the published address would have
    # published nothing and gone green. The cost of removing it is that
    # editing an unrelated threshold now runs this workflow -- which is
    # the direction this list is chosen to fail in.
    #
    # The rendering harness was an entry here, as `visuals/**`, and left
    # when it moved under `tools/`. This job runs two commands with
    # `tools/` as their working directory, so the whole of that directory
    # is an input to what they do, and an entry carving one subtree out of
    # it is the `config/**` shape again: a filter asserting something the
    # derivation cannot confirm. `test_workflows.py::test_no_path_the_
    # deploy_ignores_can_reach_the_deployed_bundle` is what noticed, on
    # the same reading that removed `config/**`. The cost is that editing
    # the renderer now runs this workflow, which is the direction this
    # list is chosen to fail in.
    #
    # An untracked working directory was a fourteenth entry here, and it
    # filtered nothing, on any machine: an untracked directory
    # -- `git ls-files` returns nothing for it -- and `paths-ignore:` is
    # evaluated against the files a push carries, which are tracked by
    # definition. It read like a decision, enforced nothing, and passed
    # its own check only because the check asked the working tree it was
    # written on rather than the repository.
    #
    # A `docs/` subtree was an entry here too, and went the same way for
    # the same reason once nothing was tracked under it: an entry matching
    # no tracked file reads like a decision and filters nothing on a
    # runner, which only ever sees tracked files.
    paths-ignore:
      - 'site/**'
      - 'services/**'
      - 'cspell.json'
      - 'README.md'
  workflow_dispatch:

# Three other workflows push to main, so two "Deploy app" runs overlapping is
# ordinary, not exotic. That is a different race from the one the retry loop
# below handles: this job and `publish-showcase.yml` write disjoint subtrees
# of the published repository (`app/` here, the site's own root-level files there --
# `index.html`, `style.css`, `fonts/`, `.nojekyll`), so re-deriving
# against a push made by the other one always reproduces cleanly and both
# pushes must land -- which is exactly what that loop (now re-deriving
# rather than rebasing) is for. Two *deploy* runs are not
# disjoint: both rewrite all of `app/`, so racing here either conflicts on
# `index.html` (different hashed asset names from the same base, a red job,
# under a rebase) or lets the *older* build silently overwrite the newer
# one -- worse, because nothing reports it.
#
# `cancel-in-progress: true` removes that case by construction rather than
# serialising the two runs and hoping the order holds: once a newer commit
# has started its own deploy, the older run's build has no reason to exist
# any more, so cancelling it is correct, not just cheaper (though it is also
# cheaper -- no runner minutes spent building something about to be
# overwritten). The group is scoped to `github.workflow`, this workflow's
# own name, so pasting this block into a future workflow file gives that
# workflow its own group automatically instead of silently colliding with
# this one -- and it is deliberately not shared with `publish-showcase.yml`,
# which would serialise two jobs where only their pushes need ordering.
concurrency:
  group: deploy-app-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Every job in this repository declares a ceiling --
    # test_workflows.py::test_every_job_declares_a_timeout guards that.
    timeout-minutes: 15
    permissions:
      # write, not read: this job commits
      # instance/public-data/survey-status.json back to this repository itself --
      # see the "Commit survey status" step below for why.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.5.x'
      # The certificate verification page reads `certificates.json`, part
      # of the app's own `public/` -- so it ships inside `app/dist/` and
      # `deploy.yml`'s existing "Push to the published repository" step below carries it
      # into the showcase for free, with no second, separate write into
      # that repo's `app/` subtree to race against this workflow's own
      # wholesale refresh of it. Needs no secret: `convener-certificates-public-data`
      # only ever reads committed `instance/data/events/*/certificates.yml` files.
      # An event with no certificates yet is a normal state (`cli/`'s own
      # `certificates_public_data`), so this step never fails for want of
      # one -- `scripts/copy-certificates.mjs`, below, is equally tolerant
      # of this step never having run at all.
      #
      # This step is what actually
      # keeps the register a verifier reads current, and it only runs when
      # this workflow does -- which a certificate issuance or revocation's
      # own push (made with the checkout's own GITHUB_TOKEN) can never
      # trigger via the `push:` clause above (the same recursion guard
      # `publish-showcase.yml`'s own header comment explains). Each of
      # issue-certificates.yml, reissue-certificate.yml and
      # revoke-certificate.yml dispatches this workflow directly with
      # `gh workflow run deploy.yml` as its own last step. The
      # `publish-showcase.yml` dispatch each of those three used to send
      # alongside it is gone, once and for all: that workflow no longer
      # touches certificate data at all,
      # so the dispatch was always a no-op run there, never a second
      # publication anything depended on. This step, and this dispatch,
      # are what a verifier's page actually depends on.
      - name: Build public data
        working-directory: tools
        run: uv run convener-certificates-public-data
      # The post-event survey's per-event
      # switch, published as an operational fact rather than baked into
      # SurveyForm.tsx's own knowledge -- see convener_ops.cli.survey_status_
      # public_data's own docstring for why this is a second file and a
      # second step rather than folded into "Build public data" above.
      # scripts/copy-survey-status.mjs (part of the app's own `npm run
      # build`, below) is what actually bakes instance/public-data/survey-status.json
      # into dist/, the same two-step shape copy-certificates.mjs already
      # uses for certificates.json.
      - name: Build survey status
        working-directory: tools
        run: uv run convener-survey-status-public-data
      # Committed here, not only baked into dist/ --
      # services/signup-relay reads this exact file, at this exact path,
      # through the GitHub Contents API against this repository (the same
      # credential and the same call shape it already uses for
      # instance/keys/events/<id>.pub), because checking a deployed public URL
      # made the relay's answer depend on a deployment that was never
      # wired up, and made "the switch is on" true at a build-to-live lag
      # the relay has no business inheriting. `.gitignore` carries a
      # deliberate exception for this one file (see its own comment) --
      # every other file `instance/public-data/` collects stays generated-only.
      #
      # This step must stay before "Build" and "Push to the published repository"
      # below -- load-bearing, not incidental: the retry loop's own
      # `git reset --hard` can only ever discard *this* step's own
      # commit, never a build that has not happened yet. Moving this step
      # after "Build" would let a reset silently discard app/dist along
      # with it.
      #
      # The retry on a rejected push is a fetch-and-reset-
      # hard followed by *re-running the projection command*, not `git
      # rebase` -- the same rule `registration.yml`'s own retry loop
      # follows, and for the identical reason (see that workflow's own
      # comment at length). `instance/public-data/survey-status.json` is a
      # generated JSON array, the same shape `registrations.enc` is:
      # `git rebase` replays a diff over that array's own closing lines,
      # which is a defect this repository has already had once -- two runs each rewriting
      # the array's tail, `git rebase` returns 1 on the conflict, and
      # `set -e` kills the step before the `::error::` line below is ever
      # reached, leaving the tree mid-rebase with no annotation at all.
      # Re-running `uv run convener-survey-status-public-data` instead is safe
      # specifically because it is a pure function of `instance/data/speakers.yml`
      # (deterministic, sorted, deduplicated): discarding the local
      # commit and re-deriving against whatever landed on `main` in the
      # meantime reproduces the identical file, never a conflict to
      # resolve by hand. `git diff --staged --quiet` below is a real
      # no-op check on every attempt, not only the first: a run where no
      # event's switch changed commits nothing, on the first pass or any
      # retry.
      - name: Commit survey status
        run: |
          set -e
          git config user.name "convener-publisher"
          git config user.email "convener-publisher@users.noreply.github.com"

          for attempt in 1 2 3; do
            (cd tools && uv run convener-survey-status-public-data)
            git add instance/public-data/survey-status.json
            if git diff --staged --quiet; then
              echo "no change to commit"
              exit 0
            fi
            git commit -m "data: refresh the published survey switch list"
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- re-deriving against the latest $GITHUB_REF_NAME and retrying"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
          done
          echo "::error::push failed after 3 attempts -- survey-status.json was not published to this repo"
          exit 1
      # The registration lane cutoffs, published the same
      # way and to the same reader. `services/signup-relay` decides whether
      # an arriving registration waits for the daily drain or is dispatched
      # at once, and the only thing that decides is the distance to the
      # event -- so it needs one instant per event, and it cannot get that
      # from `instance/data/speakers.yml` (YAML, in a worker with no parser for it)
      # or re-derive Europe/Paris start times of its own. It reads this
      # file instead, with the credential and the call shape it already
      # uses for `instance/keys/events/<id>.pub` and `instance/public-data/survey-status.json`
      # just above.
      #
      # A step here rather than a workflow, a job or a schedule of its own,
      # for the reason this whole phase exists: those would each cost a
      # billed run. This one costs two `uv run`s of a pure projection.
      #
      # Same retry shape and same reasoning as "Commit survey status": a
      # fetch-and-reset-hard followed by *re-running the projection*, never
      # `git rebase` over generated JSON. `registration_routing.
      # to_routing_data` is a pure, sorted function of `instance/data/speakers.yml`
      # and `instance/registration-lanes.yml`, so re-deriving against whatever
      # landed on the branch in the meantime reproduces the identical file.
      #
      # Note what this file's *staleness* can and cannot cost, because it
      # is the one thing worth knowing before editing the threshold:
      # editing the threshold starts this workflow now that `config/**`
      # is off `paths-ignore` above, so the change lands on
      # the next push rather than at the next unrelated run. Nothing was
      # lost by the lag it used to carry either -- a stale cutoff only
      # routes a registration to the wrong *lane*, and
      # `registration_routing.floor_hours` is what keeps the slow lane
      # safe either way.
      - name: Commit registration routing
        run: |
          set -e
          git config user.name "convener-publisher"
          git config user.email "convener-publisher@users.noreply.github.com"

          for attempt in 1 2 3; do
            (cd tools && uv run convener-registration-routing-public-data)
            git add instance/public-data/registration-routing.json
            if git diff --staged --quiet; then
              echo "no change to commit"
              exit 0
            fi
            git commit -m "data: refresh the published registration lane cutoffs"
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- re-deriving against the latest $GITHUB_REF_NAME and retrying"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
          done
          echo "::error::push failed after 3 attempts -- registration-routing.json was not published to this repo"
          exit 1
      # The internal agenda feed -- everything the
      # public `/agenda.ics` carries (site/, built entirely on the
      # JavaScript side) plus the preparation deadlines `notify.due_date`
      # is already tracking, generated from `instance/data/speakers.yml` directly
      # rather than the redacted public projection. Same shape as "Commit
      # survey status" just above, and for the identical reason: this
      # commits `instance/public-data/agenda-internal.ics` back to *this*
      # repository over the checkout's own `GITHUB_TOKEN` (`contents:
      # write`, already granted above), never into the published
      # repository's clone the "Push to the published repository" step further down builds --
      # `.gitignore` and `.gitattributes` both carry a deliberate, named
      # exception for this one path (see their own comments), and nothing
      # in `app/scripts/` or in the "Push to the published repository" step below ever
      # names it, which is what keeps this feed off both published
      # bundles. `tools/tests/publication/test_agenda.py` sweeps every copy script and
      # every workflow's own push step to prove that absence holds, not
      # merely that it holds today.
      - name: Commit internal agenda
        run: |
          set -e
          git config user.name "convener-publisher"
          git config user.email "convener-publisher@users.noreply.github.com"

          for attempt in 1 2 3; do
            (cd tools && uv run convener-agenda-internal)
            git add instance/public-data/agenda-internal.ics
            if git diff --staged --quiet; then
              echo "no change to commit"
              exit 0
            fi
            git commit -m "data: refresh the internal agenda feed"
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- re-deriving against the latest $GITHUB_REF_NAME and retrying"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
          done
          echo "::error::push failed after 3 attempts -- agenda-internal.ics was not published to this repo"
          exit 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Test
        working-directory: app
        run: npm test -- --run
      - name: Build
        working-directory: app
        env:
          VITE_AUTH_PROXY_URL: ${{ vars.VITE_AUTH_PROXY_URL }}
          VITE_GITHUB_APP_CLIENT_ID: ${{ vars.VITE_GITHUB_APP_CLIENT_ID }}
          VITE_SIGNUP_RELAY_URL: ${{ vars.VITE_SIGNUP_RELAY_URL }}
        run: npm run build
      - name: Push to the published repository
        env:
          DEPLOY_TOKEN: ${{ secrets.SHOWCASE_DEPLOY_TOKEN }}
        run: |
          set -e
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "SHOWCASE_DEPLOY_TOKEN not set — skipping push (set up the secret to enable)."
            exit 0
          fi
          git config --global user.name "convener-publisher"
          git config --global user.email "convener-publisher@users.noreply.github.com"
          # Where the built output is pushed. Derived from
          # `instance/config.json`'s own `published_url`, never named here:
          # GitHub Pages serves a project repository at
          # `https://<owner>.github.io/<repository>/` and nowhere else, so
          # the address a visitor sees and the repository this push writes
          # into are one fact, not two. They used to be
          # two, and changing the declared address moved every public URL
          # while still publishing into the previous instance's repository.
          # Read through the Python reader that owns the derivation
          # (`published.Published.publish_repository`, which refuses rather
          # than guessing for an address that is not a Pages one) -- the
          # same `uv run --project tools python -c` shape
          # `publish-showcase.yml`'s own room-link guard already uses, rather
          # than a fourth parser written in shell.
          target="$(uv run --project tools python -c \
            'from convener_ops.declaration.published import load; print(load().publish_repository)')"
          # Refuse a target that is the repository this build came from.
          # `publish_repository` derives `<owner>/<repository>` from the
          # declared address and nothing else, so a repository served at
          # its own GitHub Pages address derives *itself* -- and the wipe
          # below would then remove the source and commit a built site
          # over it. The comparison is folded because the owner arrives
          # from the host, which GitHub lower-cases, while
          # `GITHUB_REPOSITORY` carries the capitalisation the account was
          # registered with. D-25: nothing inside the run that did it can
          # put the source back, so this refuses rather than warning.
          here="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if [ "$(echo "$target" | tr '[:upper:]' '[:lower:]')" = "$here" ]; then
            echo "::error::the published address derives $target, which is the repository this build came from -- refusing to publish a build over its own source"
            exit 1
          fi
          git clone --depth 1 \
            "https://x-access-token:${DEPLOY_TOKEN}@github.com/${target}.git" /tmp/vit
          cd /tmp/vit

          # --force: `git add` still honours the *target* repository's own
          # .gitignore, and a rule there matching a built asset name would
          # silently drop it from the deploy with no error.
          refresh_app_subtree() {
            rm -rf app
            mkdir -p app
            cp -r "$GITHUB_WORKSPACE/app/dist/." app/
            git add --force app
          }

          refresh_app_subtree
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "app: refresh build"
          # This job and Publish showcase both clone the published repository fresh and
          # each only ever stages its own disjoint subtree (app/ here, the
          # site's own root-level files there) -- but that makes the
          # *commits* conflict-free, not the *push*. git push is
          # branch-atomic, not path-atomic: two runs can each clone before
          # the other pushes, and the loser's push is a plain
          # non-fast-forward rejection.
          #
          # The retry re-derives rather than rebases, the same shape
          # publish-showcase.yml's own "Publish" step uses for the identical
          # race. A rebase would in fact replay cleanly
          # here -- the two subtrees never overlap, so there is nothing for
          # it to conflict on -- but it stays a second shape for a problem
          # this repository solves one way everywhere else, and re-deriving
          # costs nothing extra: `cp -r` over a freshly reset tree
          # reproduces the identical commit on every attempt.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- re-deriving against the latest main and retrying"
            git fetch origin main
            git reset --hard origin/main
            refresh_app_subtree
            git commit -m "app: refresh build"
          done
          echo "::error::push failed after 3 attempts -- the build was not published"
          exit 1
