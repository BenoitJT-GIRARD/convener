name: Deploy auth relay

on:
  push:
    branches: [main]
    paths:
      - 'services/auth-proxy/**'
      - '.github/workflows/deploy-auth-proxy.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Every job in this repository declares a ceiling --
    # test_workflows.py::test_every_job_declares_a_timeout guards that.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: services/auth-proxy/package-lock.json
      - name: Install
        working-directory: services/auth-proxy
        run: npm ci
      - name: Test
        working-directory: services/auth-proxy
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: services/auth-proxy/package-lock.json
      # For the one derivation the Deploy step below makes. The relay's own
      # tests need no Python at all.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.5.x'
      - name: Check whether the integration is configured
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN not set - auth relay deploy skipped. This is a normal state until the Cloudflare account is connected."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: steps.gate.outputs.configured == 'true'
        working-directory: services/auth-proxy
        run: npm ci
      - name: Deploy
        if: steps.gate.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          # The one origin this worker answers a CORS preflight for.
          # `services/auth-proxy/wrangler.toml` names no origin at all --
          # see its own header for why the copy that used to be there is
          # gone -- so it is derived here, from `instance/config.json`,
          # through the Python reader that owns the derivation
          # (`published.Published.origin`). The same
          # `uv run --project tools python -c` shape `deploy.yml` already
          # uses for the repository it pushes a built site into, rather
          # than a second parser written in shell.
          origin="$(uv run --project tools python -c \
            'from convener_ops.declaration.published import load; print(load().origin)')"
          if [ -z "$origin" ]; then
            echo "::error::instance/config.json yielded no origin - refusing to deploy a relay that would answer a CORS preflight for nobody"
            exit 1
          fi
          # --var reaches src/index.js as env.ALLOWED_ORIGIN exactly as a
          # [vars] entry would, and wrangler clears every var it is not
          # given, so this deploy leaves the worker holding this one and
          # nothing a previous deploy set.
          cd services/auth-proxy
          npx wrangler deploy --var "ALLOWED_ORIGIN:$origin"
