name: Issue certificates

# Task 12 fix round 2's own finding: spec S:7's certificate design had no
# observable effect until something in CI actually called
# certificate.issue -- until this workflow, nothing did (1604 green tests,
# and no caller for any of it). The signing key lives only in this
# repository's own secrets and is used only in continuous integration
# (spec S:7: "n'est utilisee qu'en integration continue"), so issuing has
# to happen here, on an operator's own decision once an event's attendance
# data is ready -- run `convener-match-attendance` by hand first to review the
# join before certificates are minted from it
# (docs/reference/operations.md).
#
# No input carries an address: `EVENT_ID` is the only thing an operator
# names. Attendance and eligibility are both re-derived from data already
# on file (registrations.enc, decrypted here; the platform's own
# attendance API, or -- with no CONVENER_MEETING_API_TOKEN configured -- the
# committed manual export), the same "recalcule sans reinscrire" (spec
# S:8) every scheduled job in this repository already relies on.
on:
  workflow_dispatch:
    inputs:
      event_id:
        description: 'Event id, exactly as published (e.g. mrg-042)'
        required: true
        type: string

# Shared with reissue-certificate.yml and revoke-certificate.yml,
# deliberately: all three read and write the same certificates.yml for one
# event, the same reasoning discard-recording.yml shares its own group
# with recording.yml for the one FCC conference recording those two
# touch. Queued, not cancelled: a run mid-write must finish before another
# one reads the file it is writing.
concurrency:
  group: certificates-${{ inputs.event_id }}
  cancel-in-progress: false

jobs:
  issue:
    runs-on: ubuntu-latest
    # Checkout, `uv sync`, one decrypt pass over at most 500 registrations
    # (registration.py's own ceiling), one attendance fetch and up to that
    # many signatures, plus the commit retry loop below.
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # See registration.yml's own comment on this same pattern: read
      # once, used by both the checkout below and the retry loop, so the
      # two can never name different branches.
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.5.x'
      - name: Resolve the event's key secret
        id: resolve
        working-directory: tools
        env:
          # Same idiom resend-confirmation.yml already uses for a typed,
          # trusted operator input: `toJSON`, never string interpolation,
          # so a stray quote in `event_id` cannot break out of the payload.
          REGISTRATION_PAYLOAD: ${{ toJSON(inputs) }}
        run: uv run convener-registration-secret-name
      - name: Issue certificates for this event
        env:
          EVENT_ID: ${{ steps.resolve.outputs.event_id }}
          EVENT_PRIVATE_KEY: ${{ secrets[steps.resolve.outputs.secret_name] }}
          # Absent is D-13's ordinary state for CONVENER_SIGNING_KEY
          # (config/integrations.yml's own signing_key row) -- and, unlike
          # every other secret in this file, also for CONVENER_MATCHING_SALT
          # here: certificate.py's own module docstring explains why a
          # certificate fingerprint may never be computed without it.
          # convener-issue-certificates treats both the same way outwardly --
          # nothing issued, a clean exit -- for the stronger reason the
          # phase's own global constraints name: an absent key forbids
          # writing, it does not license writing insecurely.
          CONVENER_SIGNING_KEY: ${{ secrets.CONVENER_SIGNING_KEY }}
          CONVENER_MATCHING_SALT: ${{ secrets.CONVENER_MATCHING_SALT }}
          # Absent is ordinary D-13 too: platform_from_env falls back to
          # ManualPlatform, reading
          # data/events/<id>/attendance-import.csv -- which R-24 (fix
          # round 2) records this repository cannot populate in CI at all
          # yet (see docs/superpowers/deferred-work.md).
          CONVENER_MEETING_API_TOKEN: ${{ secrets.CONVENER_MEETING_API_TOKEN }}
        # Same shape as registration.yml's own commit step: re-derive
        # rather than rebase on a rejected push. `convener-issue-certificates`
        # re-reads every input from the checked-out tree on each attempt,
        # so re-running it after a fetch-and-reset-hard reproduces
        # whatever a concurrent writer just landed, plus this run's own
        # certificates, rather than replaying a diff that file's own
        # closing lines would conflict on (task 6's own lesson, spelled
        # out in full in registration.yml).
        run: |
          set -e
          git config user.name "convener-certificates"
          git config user.email "convener-certificates@users.noreply.github.com"

          for attempt in 1 2 3; do
            (cd tools && uv run convener-issue-certificates)
            if [ -f "data/events/$EVENT_ID/certificates.yml" ]; then
              git add "data/events/$EVENT_ID/certificates.yml"
            fi
            if git diff --staged --quiet; then
              echo "no change to commit"
              exit 0
            fi
            git commit -m "data: issue certificates for $EVENT_ID"
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- re-deriving against the latest $TARGET_BRANCH and retrying"
            git fetch origin "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"
          done
          echo "::error::push failed after 3 attempts -- certificates were computed but not saved"
          exit 1
