name: Issue certificates

# The certificate design had no
# observable effect until something in CI actually called
# certificate.issue -- until this workflow, nothing did (1604 green tests,
# and no caller for any of it). The signing key lives only in this
# repository's own secrets and is used only in continuous integration
# ("is used only in continuous integration"), so issuing has
# to happen here, on an operator's own decision once an event's attendance
# data is ready -- run match-attendance.yml first to review the join
# before certificates are minted from it (docs/operating/operations.md).
# This used to say "run convener-match-attendance by hand",
# which nobody could ever actually do -- EVENT_PRIVATE_KEY never touches a
# laptop by design -- until that command had a workflow of its own.
#
# No input carries an address: `EVENT_ID` and, optionally, `conference_id`
# are the only things an operator names -- a provider identifier, not
# personal data, so the "never an address" reasoning does not apply to it
# (see `conference_id`'s own description below). Attendance and
# eligibility are both re-derived from data already on file
# (registrations.enc, decrypted here; the platform's own attendance API,
# or -- with no CONVENER_MEETING_API_TOKEN configured -- the committed manual
# export), the same "recalculated without re-registering" rule every
# scheduled job in this repository already relies on.
on:
  workflow_dispatch:
    inputs:
      event_id:
        description: 'Event id, exactly as published (e.g. mrg-042)'
        required: true
        type: string
      conference_id:
        description: >-
          The FreeConferenceCall conference id for this event (only needed
          with CONVENER_MEETING_API_TOKEN configured; see recording.yml's own
          input of the same name). Leave blank for the manual
          implementation.
        required: false
        type: string
      resend_all:
        description: >-
          By default the delivery step below mails
          only the certificates this run's own issuance step just minted
          or reproduced -- never every past attendee again. Tick this for
          a deliberate batch retry (e.g. after fixing outbound mail) that
          re-sends every currently eligible attendee's certificate. A
          choice an operator makes, never the default.
        required: false
        type: boolean
        default: false

# Shared with reissue-certificate.yml and revoke-certificate.yml,
# deliberately: all three read and write the same certificates.yml for one
# event, the same reasoning discard-recording.yml shares its own group
# with recording.yml for the one FCC conference recording those two
# touch. Queued, not cancelled: a run mid-write must finish before another
# one reads the file it is writing.
concurrency:
  group: certificates-${{ inputs.event_id }}
  cancel-in-progress: false

jobs:
  issue:
    runs-on: ubuntu-latest
    # Checkout, `uv sync`, one decrypt pass over at most 500 registrations
    # (registration.py's own ceiling), one attendance fetch and up to that
    # many signatures, plus the commit retry loop below.
    timeout-minutes: 10
    permissions:
      contents: write
      # This job's own commit below pushes with
      # this same job's `GITHUB_TOKEN`, which cannot fire deploy.yml's own
      # `push` trigger (GitHub's recursion guard). `workflow_dispatch` is
      # the documented exception to that guard, and dispatching one
      # requires `actions: write` -- see the commit step's own final line
      # below.
      actions: write
    env:
      # See registration.yml's own comment on this same pattern: read
      # once, used by both the checkout below and the retry loop, so the
      # two can never name different branches.
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.5.x'
      - name: Resolve the event's key secret
        id: resolve
        working-directory: tools
        env:
          # Same idiom resend-confirmation.yml already uses for a typed,
          # trusted operator input: `toJSON`, never string interpolation,
          # so a stray quote in `event_id` cannot break out of the payload.
          REGISTRATION_PAYLOAD: ${{ toJSON(inputs) }}
        run: uv run convener-registration-secret-name
      - name: Issue certificates for this event
        # `id` so the delivery step below can read this
        # step's own `issued_ids` output (written by
        # convener-issue-certificates itself, straight to $GITHUB_OUTPUT --
        # the runner provides that env var to every step already, no
        # entry needed in the `env:` block below for it).
        id: issue
        env:
          EVENT_ID: ${{ steps.resolve.outputs.event_id }}
          EVENT_PRIVATE_KEY: ${{ secrets[steps.resolve.outputs.secret_name] }}
          # Absent is D-13's ordinary state for CONVENER_SIGNING_KEY
          # (config/integrations.yml's own signing_key row) -- and, unlike
          # every other secret in this file, also for CONVENER_MATCHING_SALT
          # here: certificate.py's own module docstring explains why a
          # certificate fingerprint may never be computed without it.
          # convener-issue-certificates treats both the same way outwardly --
          # nothing issued, a clean exit -- for the stronger reason the
          # phase's own global constraints name: an absent key forbids
          # writing, it does not license writing insecurely.
          CONVENER_SIGNING_KEY: ${{ secrets.CONVENER_SIGNING_KEY }}
          CONVENER_MATCHING_SALT: ${{ secrets.CONVENER_MATCHING_SALT }}
          # Absent is ordinary D-13 too: platform_from_env falls back to
          # ManualPlatform, reading
          # instance/data/events/<id>/attendance-import.csv -- which this
          # repository cannot populate in CI at all yet, and that gap is
          # known rather than overlooked.
          CONVENER_MEETING_API_TOKEN: ${{ secrets.CONVENER_MEETING_API_TOKEN }}
          # Folded into `conference_ids` by
          # `cli.py::_conference_ids_from_env`, the same way
          # recording.yml's own `conference_id` input already reaches
          # `release_recording`. Blank when the operator leaves
          # the input empty -- the ordinary D-13 shape for the manual
          # implementation, which never reads this at all.
          CONVENER_FCC_CONFERENCE_ID: ${{ inputs.conference_id }}
          # Authenticates the `gh workflow run`
          # call at the end of the script below. `github.token` is this
          # job's own `GITHUB_TOKEN`, scoped by `permissions:` above --
          # `workflow_dispatch` is one of the documented exceptions to the
          # recursion guard, so no new secret is needed.
          GH_TOKEN: ${{ github.token }}
        # Same shape as registration.yml's own commit step: re-derive
        # rather than rebase on a rejected push. `convener-issue-certificates`
        # re-reads every input from the checked-out tree on each attempt,
        # so re-running it after a fetch-and-reset-hard reproduces
        # whatever a concurrent writer just landed, plus this run's own
        # certificates, rather than replaying a diff that file's own
        # closing lines would conflict on (the reasoning is spelled
        # out in full in registration.yml).
        run: |
          set -e
          git config user.name "convener-certificates"
          git config user.email "convener-certificates@users.noreply.github.com"

          for attempt in 1 2 3; do
            (cd tools && uv run convener-issue-certificates)
            if [ -f "instance/data/events/$EVENT_ID/certificates.yml" ]; then
              git add "instance/data/events/$EVENT_ID/certificates.yml"
            fi
            if git diff --staged --quiet; then
              # An operator pressed this
              # button and nothing was written -- no eligible attendee
              # yet, or CONVENER_SIGNING_KEY / CONVENER_MATCHING_SALT not
              # configured. Right for a scheduled job, wrong for one a
              # human dispatched by hand: a warning, not a failure (D-13
              # still holds -- see convener-issue-certificates's own message
              # above this line for the actual reason).
              echo "::warning::convener-issue-certificates ran but wrote nothing -- see this run's own log above for why"
              exit 0
            fi
            git commit -m "data: issue certificates for $EVENT_ID"
            if git push; then
              # This push used GITHUB_TOKEN, so
              # it cannot have fired deploy.yml's own `push` trigger
              # (GitHub's recursion guard) -- dispatch it directly
              # instead. Only reached once a change was genuinely pushed,
              # never on the no-op branch above. deploy.yml is what
              # regenerates app/dist/certificates.json from
              # instance/data/events/*/certificates.yml and pushes it into
              # the published repository's own app/ -- see that workflow's own "Build public
              # data" step; it is the one file the verification page
              # actually fetches. A
              # failure here does not fail this job: the certificates
              # themselves are already safely committed and pushed; only
              # the public register's refresh would need a manual rerun
              # of deploy.yml.
              #
              # This used to *also* dispatch
              # publish-vitrine.yml. Deliberately not, any more: nothing
              # this job writes touches instance/data/speakers.yml, the only input
              # publish-vitrine.yml's own "Build public data" step turns
              # into anything it pushes (events.json) -- a certificate
              # change was always a no-op run there ("no changes", exit
              # 0), never a second publication this dispatch was actually
              # needed for. Dead motion, kept once for consistency with
              # the dispatch above rather than for any effect of its own;
              # removing it removes only the no-op run, not a guarantee.
              gh workflow run deploy.yml --ref "$TARGET_BRANCH" ||
                echo "::warning::failed to trigger deploy.yml -- rerun it manually from the Actions tab"
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- re-deriving against the latest $TARGET_BRANCH and retrying"
            git fetch origin "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"
          done
          echo "::error::push failed after 3 attempts -- certificates were computed but not saved"
          exit 1
      # Deliver every currently eligible attendee's certificate by
      # e-mail. Delivery is by e-mail and never by a named document
      # placed in a repository. Runs after the step above, in
      # the same job and the same checkout, so convener-deliver-certificates
      # reads whatever certificates.yml this run's own commit just wrote
      # (or, on a re-run, whatever an earlier run already committed) --
      # never a second, independent write of its own; this step never
      # touches git at all. A failed delivery is reported in this step's
      # own summary, by identifier, never stashed anywhere: an operator
      # names a specific failure to convener-deliver-certificate, or ticks
      # resend_all above for a deliberate batch retry
      # -- which is why this step carries no retry loop of its own the way
      # the commit-and-push step above does.
      #
      # `continue-on-error: true` -- a transient
      # platform failure here (the same re-derived attendance fetch the
      # issuance step above already made) must not mark the whole run red
      # after the certificates were already committed and pushed. The
      # issuance step's own outcome is what matters for the job's overall
      # status; this step's own summary line still reports its result.
      - name: Deliver certificates for this event
        working-directory: tools
        continue-on-error: true
        env:
          EVENT_ID: ${{ steps.resolve.outputs.event_id }}
          EVENT_PRIVATE_KEY: ${{ secrets[steps.resolve.outputs.secret_name] }}
          # Same two deliberate D-13 exceptions as the issuance step above
          # -- see that step's own comment on CONVENER_SIGNING_KEY and
          # CONVENER_MATCHING_SALT.
          CONVENER_SIGNING_KEY: ${{ secrets.CONVENER_SIGNING_KEY }}
          CONVENER_MATCHING_SALT: ${{ secrets.CONVENER_MATCHING_SALT }}
          CONVENER_MEETING_API_TOKEN: ${{ secrets.CONVENER_MEETING_API_TOKEN }}
          CONVENER_FCC_CONFERENCE_ID: ${{ inputs.conference_id }}
          # Restrict this run to what the issuance step
          # above just minted or reproduced -- never every past attendee
          # again -- unless the operator explicitly ticked resend_all.
          # Identifiers are public by design (certificate.py's own module
          # docstring); nothing personal crosses this boundary.
          DELIVER_ONLY: ${{ steps.issue.outputs.issued_ids }}
          RESEND_ALL: ${{ inputs.resend_all }}
          # email_transport's five secrets (config/integrations.yml) --
          # absent is ordinary D-13 here too: every attempt this step makes
          # is simply reported as not sent, in the printed counts, never a
          # failed step. See delivery.py's own module docstring for why an
          # unsent certificate is never written anywhere -- the same
          # "reported, not retained" rule an unsent registration
          # confirmation follows too
          # (`confirmation.py`'s own module docstring).
          CONVENER_SMTP_HOST: ${{ secrets.CONVENER_SMTP_HOST }}
          CONVENER_SMTP_PORT: ${{ secrets.CONVENER_SMTP_PORT }}
          CONVENER_SMTP_USER: ${{ secrets.CONVENER_SMTP_USER }}
          CONVENER_SMTP_PASSWORD: ${{ secrets.CONVENER_SMTP_PASSWORD }}
          CONVENER_SMTP_FROM: ${{ secrets.CONVENER_SMTP_FROM }}
        run: uv run convener-deliver-certificates
