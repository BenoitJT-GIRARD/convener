# Which dependency trees Dependabot watches, and what a duplicate does with
# this file.
#
# Every surface with a lockfile is audited, and only two were updated
# ------------------------------------------------------------------
# Seven dependency trees are committed here, and every one of them already
# gets an audit on the way in: `.github/workflows/quality.yml` runs `npm
# audit` over `app/`, `site/` and the three relays under `services/`, and
# `pip-audit` over `tools/`; `visuals.yml` and `visuals-production.yml`
# audit `tools/visuals/` in both jobs that install it. That rule is written into
# those files in as many words -- "every surface with a lockfile gets an
# audit in this same quality chain".
#
# This file watched two of the seven. An audit that reports a vulnerable
# package while nothing opens the pull request replacing it is half a
# control: the finding arrives, and then it stays, because bumping a
# lockfile by hand is the work nobody does. So the list below is the same
# seven, and `tools/tests/repository/test_public_repository.py` derives it from `git
# ls-files` rather than reading it -- a manifest committed without an entry
# here fails that test instead of going unwatched until somebody notices.
#
# What this costs, accepted rather than discovered
# ------------------------------------------------
# One grouped pull request per directory per month, each running the same
# gates a human pull request runs. `groups:` is what keeps that to one per
# directory rather than one per package, and `interval: monthly` to twelve
# rounds a year rather than fifty-two. Measured against the allowance
# `instance/actions-budget.yml` reads, that is the price of not carrying a
# known-vulnerable package from one advisory to the next time somebody
# thinks to look, and it is worth paying here.
#
# What a duplicate does with this file, and where that is written
# ---------------------------------------------------------------
# Not here. Every manifest and every lockfile named below belongs to the
# **product** by `declarations/boundary.yml`'s default, so a duplicate whose
# Dependabot bumps one of them has edited a product file and bought a
# monthly conflict with upstream's own bump of it -- and the operator who
# has to switch that off never opens this file. The paragraph that used to
# stand here was addressed to them and reached nobody.
#
# It is a step of the standing-up sequence now:
# `declarations/standing-up.yml`, step `dependency_updates`, in the stage
# that creates the two repositories.
# That declaration is rendered into `docs/operating/standing-up.md` for a
# person and `docs/operating/standing-up-for-an-agent.md` for an agent, and
# it carries what the step costs to skip beside what it does, which a
# comment in a configuration file cannot.

version: 2
updates:
  # `directories:` rather than six near-identical entries: one statement of
  # the schedule and the grouping, six paths under it. Dependabot still
  # opens one pull request per directory, so this is a shorter file and not
  # a cheaper one.
  #
  # The last three of them pin the same two versions -- `vitest` and
  # `wrangler` -- in three `package.json`, and that is a literal copy this
  # repository forbids in prose and tolerates here. It is a decision and
  # not an oversight: npm workspaces would remove it and would cost more
  # than it saves at three packages of one source file each, while the
  # three lines below already hand the three trees to the same machine on
  # the same schedule under the same group, so a bump one of them missed
  # is a bump this file proposes again next month. What the three did not
  # need to share by copy is their lint configuration, and they no longer
  # do: `services/eslint.config.base.mjs`.
  - package-ecosystem: npm
    directories:
      - /app
      - /site
      - /tools/visuals
      - /services/auth-proxy
      - /services/form-relay
      - /services/signup-relay
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ['*']
    # Three majors, held back, because a group is one pull request
    # ------------------------------------------------------------
    # `groups:` is what keeps this to one pull request per directory, and
    # one pull request is also what it costs: a single package that needs
    # source changed before it can build blocks every other bump in the
    # same branch, and the same branch comes back next month carrying the
    # same blockage. The first grouped npm round proposed twenty updates
    # and three of them were source migrations, so none of the other
    # seventeen could merge.
    #
    # A major of these three is proposed on its own terms instead -- by
    # hand, in a branch that can be read as the migration it is -- and
    # everything else goes on arriving monthly. Minors and patches of all
    # three still come through this group; only
    # `version-update:semver-major` is held, and each line below says what
    # to look at before lifting it.
    ignore:
      # Nothing here can lift this one. `typescript-eslint` 8.70.0 is
      # `latest`, and it and `@typescript-eslint/parser` both declare
      # `peerDependencies.typescript: ">=4.8.4 <6.1.0"`; the `canary`
      # line (8.70.1-alpha.0) declares the identical range. No published
      # line admits TypeScript 7, or even 6.1, so a tree holding both
      # ends at `npm error ERESOLVE` -- before a compiler runs, and with
      # nothing in this repository that could answer it.
      #
      # Watch `npm view typescript-eslint peerDependencies`. The day that
      # upper bound opens past `<6.1.0`, deleting these two lines is the
      # whole of the migration.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # v5 is three separate breaks in one bump. Its ESM build exports no
      # default, so `import yaml from 'js-yaml'` fails at load in every
      # file that writes it -- including the two `app/scripts/*.mjs`
      # `app/vite.config.ts` imports, which means the Vite config does not
      # load and every app gate reports a startup error rather than a
      # finding. `noArrayIndent` is renamed `seqNoIndent`, and v5 ignores
      # the old spelling in silence rather than refusing it, which moves
      # every block sequence two columns and breaks the byte-for-byte
      # agreement with PyYAML that `tools/tests/fixtures/speakers-from-app.yml`
      # pins. And `load('')` raises where v4 returned `undefined`, which
      # is a question about what an empty `instance/data/speakers.yml`
      # means rather than about a parser.
      #
      # Nothing upstream will lift this one either: it is source work,
      # and it is ours.
      - dependency-name: js-yaml
        update-types: ['version-update:semver-major']
      # Held for review rather than for work. Measured on this tree, v7
      # costs nothing at all -- no type error, and the whole suite green
      # -- once `app/tests/helpers/setup.ts` takes the matchers from
      # `@testing-library/jest-dom/vitest` rather than from the package
      # root, which it does, and which `vitest` 5 required of v6 just as
      # much as of v7.
      #
      # What a major of this package changes is the vocabulary every
      # assertion in `app/` is written in, and a matcher that quietly
      # changes meaning inside a grouped bump of twenty packages is a
      # failure nobody would attribute to the bump that caused it. So it
      # arrives alone. To lift it: read the release's own list of removed
      # and renamed matchers, then `npm install -D
      # @testing-library/jest-dom@latest`, `npm run typecheck`,
      # `npm test`.
      - dependency-name: '@testing-library/jest-dom'
        update-types: ['version-update:semver-major']
  - package-ecosystem: uv
    directory: /tools
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ['*']
  # Not a lockfile, and watched for the same reason the trees above are: a
  # pinned action is a dependency with a digest instead of a version, and
  # `.github/workflows/` pins every one of them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ['*']
