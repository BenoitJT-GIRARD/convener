<!-- cspell:ignore currentColor color
  Convener — the mark and the wordmark.

  **One file for every surface.** The ink is `currentColor`, so it takes the
  colour of whatever it is placed in — set `color: #fff` on a dark ground and it
  turns white, with no second file to keep in step.

  The navy default is a `svg:root` rule, not a `color` attribute, and the
  difference is the whole point: an attribute would win over inheritance and the
  mark would stay navy on a dark ground. `svg:root` matches only when this file
  is the document — opened on its own, or loaded through `<img>`. Inlined into a
  page, it does not match, and inheritance decides.

  The mark is measured, not traced: radii, stroke widths and one 81° opening read
  off the original raster and rebuilt as two arcs and a circle. It overlaid that
  raster exactly.

  The wordmark is Archivo at weight 400, converted to outlines — the face and
  weight `data/brand.json` declares as `body`, shipped here under the SIL Open
  Font License 1.1 (`fonts/`, `Archivo-LICENSE.txt`). It is **not** the face of
  the original raster, which was never identified; see README.md for why
  imitating it was the wrong trade.

  Coral #fd6b52 is an accent on the ink, never text on white — 2.84:1 there.
  Navy #012765 on white is 14.23:1. README.md carries both measurements.
-->
