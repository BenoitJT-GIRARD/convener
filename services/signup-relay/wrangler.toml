name = "convener-signup-relay"
main = "src/index.js"
compatibility_date = "2026-01-01"

# The application's origin -- the only one this worker answers CORS
# preflights for. Origin carries no path, so the app being served from a
# subpath of this host does not change it. Not a secret -- it ships in
# every CORS response header already.
#
# This is the one address `config/instance.json`
# declares this project is published at, and it is written out here
# because a Worker deploys from this file and can read nothing else --
# TOML has no include, and this package has no parser for the declaration
# that would not be a new dependency. `test/index.test.js` reads both and
# refuses them disagreeing, so the copy cannot drift even though it has
# to exist. services/auth-proxy/wrangler.toml carries the same value for
# the same reason, held by its own suite the same way.
[vars]
ALLOWED_ORIGIN = "https://example-instance.github.io"

# The survey switch was once checked against a plain
# public HTTPS URL here (SURVEY_STATUS_URL), because it seemed like the
# cheaper read: no token, no GitHub API budget. That is gone:
# the URL pointed at a published deployment this project had never
# actually wired up, so the check depended on a site that did not exist,
# carried a build-to-live latency the relay had no reason to inherit on
# top of the handler's, and was a hardcoded cross-origin literal nothing
# derived. `surveyEnabled` in src/index.js now reads
# `public-data/survey-status.json` through the same GitHub Contents API
# credential (CONVENER_DISPATCH_TOKEN, below) this worker already spends one
# read of for `keys/events/<id>.pub` -- one more read on an already
# ceiling-capped route, in exchange for an answer that agrees with the
# handler's by construction rather than by build timing. There is no var
# to bind here any more: the repository (`REPO`, a source constant) and
# the token cover both reads.

# CONVENER_DISPATCH_TOKEN is a Wrangler secret, set with
# `npx wrangler secret put CONVENER_DISPATCH_TOKEN` -- never here. See README.md.

# SIGNUP_RELAY_KV backs the per-event registration ceiling (README.md,
# "Abuse protection"). Not a secret -- a namespace id is not sensitive -- but
# it is specific to the Cloudflare account this worker deploys to, so it
# cannot be filled in until that namespace exists:
#
#   npx wrangler kv namespace create SIGNUP_RELAY_KV
#
# paste the "id" it prints below before the first deploy.
# deploy-signup-relay.yml's own gate refuses to deploy while this is still
# the placeholder, rather than letting `wrangler deploy` fail on it.
[[kv_namespaces]]
binding = "SIGNUP_RELAY_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# SIGNUP_RATE_LIMITER -- the per-event burst limiter (README.md, "Abuse
# protection"). Unlike SIGNUP_RELAY_KV above, `namespace_id` needs no
# `wrangler ... create` step and no account-specific value: Cloudflare's own
# docs describe it as "a positive integer that uniquely defines this rate
# limiting namespace within your Cloudflare account," chosen by the
# developer, not allocated. "1" is safe to commit as-is because this is the
# only rate limiter declared anywhere in this Cloudflare account today; if a
# second one is ever added (in this worker or another), it must use a
# different integer, or the two will silently share one bucket.
[[ratelimits]]
name = "SIGNUP_RATE_LIMITER"
namespace_id = "1"

  [ratelimits.simple]
  limit = 30
  period = 60

# GLOBAL_RATE_LIMITER -- a second binding,
# not a second key on SIGNUP_RATE_LIMITER above, because Cloudflare's
# Workers Rate Limiting binding applies one limit/period to every key
# checked against it; a global ceiling distinct from the per-event one
# needs a binding of its own. Closes the gap a caller varying event_id on
# every request could otherwise use to evade SIGNUP_RATE_LIMITER entirely
# (README.md, "Abuse protection") -- see src/index.js's own
# GLOBAL_RATE_LIMITER_KEY comment for the full reasoning. "2" is the next
# unused rate-limiter namespace id on this account; services/form-relay's
# own FORM_RATE_LIMITER takes "3", so no two limiters
# declared anywhere in this account silently share one bucket.
[[ratelimits]]
name = "GLOBAL_RATE_LIMITER"
namespace_id = "2"

  [ratelimits.simple]
  # Generous enough that a real announcement's traffic -- several events
  # open for registration at once, each drawing its own legitimate burst
  # up to SIGNUP_RATE_LIMITER's own 30/60s -- is never refused here first,
  # while still capping this worker's total request rate to roughly
  # 3,600/hour: comfortably inside CONVENER_DISPATCH_TOKEN's own 5,000/hour
  # authenticated GitHub API budget even at sustained maximum throughput,
  # leaving headroom for the survey route sharing the same token and the
  # same budget.
  limit = 60
  period = 60
