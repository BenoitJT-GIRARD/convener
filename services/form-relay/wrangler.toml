name = "convener-form-relay"
main = "src/index.js"
compatibility_date = "2026-01-01"

# There is no `[vars]` table here, and the absence is the decision.
#
# This worker sends one `repository_dispatch`, and the repository it sends
# it to is the one `instance/config.json` declares under
# `identity.repository`. That value used to sit in `src/index.js` as a
# literal, because a Worker deploys from this package and can read nothing
# else. It was a copy in product source: the published product carried the
# example instance's repository name, and a duplicate that corrected only
# the declaration had a relay dispatching at somebody else's repository
# with nothing to say so.
#
# `.github/workflows/deploy-form-relay.yml` derives it and hands it to
# `wrangler deploy --var REPOSITORY:<owner/name>`, which reaches
# `src/index.js` as `env.REPOSITORY` exactly as an entry here would.
# `services/auth-proxy/wrangler.toml`'s header carries the reasoning in
# full for the origin this followed, including the
# generator-with-a---check it was chosen over.
#
# `src/index.js` refuses every request with 502 when `REPOSITORY` is
# unset -- before it spends the dispatch -- so a deploy that dropped the
# flag fails closed instead of answering 502 for a reason an operator
# would read as an expired token (D-25). `tools/tests/declaration/test_published.py`
# holds both halves: no `services/*/src/index.js` names a repository, and
# each deploy workflow that needs one derives it.

# TALLY_WEBHOOK_SECRET and CONVENER_DISPATCH_TOKEN are Wrangler secrets, set with
# `npx wrangler secret put <NAME>` -- never here. See README.md.

# FORM_RELAY_KV backs the whole-lifetime
# cumulative submission ceiling (README.md, "Abuse protection"). Not a
# secret -- a namespace id is not sensitive -- but it is specific to the
# Cloudflare account this worker deploys to, so it cannot be filled in
# until that namespace exists:
#
#   npx wrangler kv namespace create FORM_RELAY_KV
#
# paste the "id" it prints below before the first deploy.
# deploy-form-relay.yml's own gate refuses to deploy while this is still
# the placeholder, rather than letting `wrangler deploy` fail on it.
[[kv_namespaces]]
binding = "FORM_RELAY_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# FORM_RATE_LIMITER -- the burst limiter (README.md, "Abuse
# protection"). `namespace_id` needs no `wrangler ... create` step and no
# account-specific value: Cloudflare's own docs describe it as "a positive
# integer that uniquely defines this rate limiting namespace within your
# Cloudflare account," chosen by the developer, not allocated.
# services/signup-relay/wrangler.toml already uses "1" for its own
# SIGNUP_RATE_LIMITER and "2" for the GLOBAL_RATE_LIMITER beside it
# (same file, same account) -- "3" here keeps every rate
# limiter this account declares on a distinct namespace id, so none of
# them silently share one bucket.
[[ratelimits]]
name = "FORM_RATE_LIMITER"
namespace_id = "3"

  [ratelimits.simple]
  limit = 10
  period = 60
