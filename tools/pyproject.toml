[project]
name = "convener-ops"
version = "0.1.0"
description = "Operational tooling for the TEC Monthly Reading Group"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.2"]

[project.scripts]
convener-validate = "convener_ops.cli:validate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["convener_ops"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
