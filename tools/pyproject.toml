[project]
name = "convener-ops"
version = "0.1.0"
description = "Operational tooling for a seminar series run from its own repository"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0.2",
  # zoneinfo has no bundled tz database; Windows (and minimal Linux images)
  # have none on disk, so this ships one. Required for sweep.py's DST handling.
  "tzdata>=2025.1; sys_platform == 'win32'",
  # No asymmetric primitive exists in the standard library (hashlib, hmac and
  # secrets are hashing and symmetric only), and eventkeys.py's whole design
  # depends on one: the browser only ever holds the public half, which is
  # only true if a public key cannot decrypt -- a property no symmetric
  # scheme has. The choice was between this well-audited library and
  # hand-rolling RSA in the one module that handles other people's personal
  # data; see tools/convener_ops/journey/eventkeys.py for the rest of that reasoning.
  "cryptography>=43",
  # A certificate carries a machine-readable code, and the delivery step's
  # own ruling requires the library that draws it to be pure Python, no
  # binary wheel, no Pillow -- verified before adding it, not assumed: segno
  # ships one universal wheel (py3-none-any, checked directly against the
  # built artefact, not only the classifier), has zero required dependencies
  # for this project's Python floor (its one dependency,
  # importlib-metadata, is conditional on python_version < '3.10'; this
  # project requires >=3.12), is BSD-3-Clause (the licence file itself, not
  # only the PyPI classifier), and renders SVG natively through
  # `svg_inline()` -- an embeddable `<svg>...</svg>` fragment, no Pillow, no
  # raster step at all. See tools/convener_ops/journey/delivery.py for where it is used
  # and why HTML+SVG rather than a raster format.
  "segno>=1.6",
]

