[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["convener_ops"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "mypy>=1.14",
  # Kept beside ruff rather than folded into it, on a measurement rather
  # than on the assumption that a port covers its original: ruff's own `S`
  # rules see neither `B404` nor a `subprocess.run` whose argv is entirely
  # literal. The comparison, finding by finding, is in `[tool.ruff.lint]`'s
  # comment below, and `tools/tests/test_workflows.py::test_the_security_
  # scanner_is_declared_run_and_reads_its_own_suppressions` is what stops
  # this line and `quality.yml`'s own step from being removed one without
  # the other.
  "bandit>=1.8",
  "pip-audit>=2.7",
  "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# `S` (flake8-bandit) is absent, and that is a measured decision rather
# than an omission. Ruff's `S` rules are a port of bandit, so enabling
# them would remove a tool, a dependency and a `quality.yml` step -- which
# is worth doing only if the port sees what the original sees. It does
# not. Both were run over `convener_ops` (bandit 1.9.4, ruff 0.16.3):
#
#   bandit -q -r convener_ops        0 findings
#   bandit --ignore-nosec           31  B603x14 B607x11 B404x3 B310x2 B506x1
#   ruff --select S                 32  S607x11 S603x10 S105x6 S310x4 S506x1
#
# The zero is what twenty `# nosec` comments in `convener_ops` account
# for; the second line is the set the two tools have to be compared on.
# Every count here is re-measured rather than carried forward: the
# previous set said eighteen, twenty-seven and thirty, and each had gone
# stale as the package grew subprocess call sites. The shape of the
# argument did not move; the arithmetic under it did, twice, unnoticed.
#
# Seven of those thirty-one have no equivalent under `select = ["S"]`,
# and that is what settles it. `B404` (`import subprocess`, in cli.py,
# repository.py and derivation_guard.py -- three) is `S404` in ruff, and
# `S404` is a preview rule: selecting it prints "has no effect because
# preview is not enabled", and nothing in this project runs ruff in
# preview. `B603` fires on every `subprocess.run` -- fourteen; `S603`
# deliberately does not fire when every element of the argv is a string
# literal, which is exactly the four calls it passes over
# (`derivation_guard.py`'s `git cat-file --batch-check` at 695 and 1235,
# its `git cat-file --batch` at 1266, and its `git rev-parse --git-dir`
# at 752). Ruff is the better-aimed rule on those four and bandit is the
# only one that sees the import at all, so neither tool contains the
# other.
#
# Ruff sees eight findings bandit misses, in two kinds, and neither pays
# for the swap. `S310` also flags `urllib.request.Request` (bandit's
# `B310` blacklist names `urlopen` and `urlretrieve` only), which is two
# more findings on `platform_fcc.py`'s existing pair. `S105` flags six
# `Final`-annotated constants -- `_TOKEN`, `_PASSWORD_ENV`, `TOKEN`,
# `SECRET`, `TOKEN_ENV`, `SECRET_NAME` -- that hold a regex fragment, an
# environment variable's *name* or a category label, never a password;
# bandit's `B105` reads `Assign` and not `AnnAssign`, so it never sees
# them at all.
#
# The swap would also cost more than the step it removes. `# nosec` is
# bandit's syntax and ruff reads `# noqa`, so all twenty suppressions
# would have to be rewritten and eight more added for the false positives
# above. And `select` applies to everything CI lints (`ruff check .`
# from `tools/`), not only to the package bandit is pointed at: `S` finds
# 6,302 there, 6,171 of them `S101` -- `assert`, in this project's own
# tests -- so it would need a `per-file-ignores` block bandit never
# needed.
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
# `scripts` and `migrations` sit beside the package rather than inside
# it -- the wheel ships `convener_ops` alone -- and are imported by their
# tests. Named here rather than reached through `mypy_path`, so that the
# same list states what is checked and where the modules are found.
files = ["convener_ops", "tests", "scripts", "migrations"]

[tool.coverage.run]
# `branch` belongs here, not under [tool.coverage.report] -- coverage.py
# only recognises it as a [run] option (a misplaced copy is silently
# ignored, with a warning, not an error). Verified by running the suite
# with and without this section and comparing the Branch/BrPart columns.
branch = true

[tool.coverage.report]
# 90, not the actual figure. On this branch's head, actual is 99.77%
# (2178 of 2183 measured statements and branch exits covered). Before this
# branch the floor was 85 against an actual of 95.98% -- a third of the
# tests could have been deleted and the gate would still have passed. That
# decorative gap is what raising the floor is for.
#
# 90 is not sharp either. coverage.py's percentage is statements *plus*
# branch exits together (2183 of them here), not statements alone -- a
# ninety-point estimate of the slack comes from applying the percentage
# gap to the statement count alone (1503) and missing the 680 branches in
# the real denominator. Measured against the real total: 90% of 2183 is
# 1965, and 2178 are covered today, so 213 currently-covered statements or
# branches could go uncovered before the gate would fail -- gross
# regression, a chunk of untested code landing at once, and nothing finer
# than that. A test that exercises a line without asserting anything
# meaningful about it satisfies this gate exactly as well as one that
# doesn't exist here at all. Compare app/vite.config.ts, which enforces
# 90/90/85/90 while the app actually sits at 98.21/94.15/99.34/98.94 --
# same shape of gap, same limits to what a floor this far below the truth
# can catch.
#
# The real guard against a weak test is mutation testing -- breaking the
# line or branch a test claims to cover and checking the test then fails --
# and a reviewer who spot-checks that a new test actually bites, not this
# number. fail_under is a backstop against a large regression, never a
# claim that passing it means the suite is any good. (This comment names a
# specific slack figure, and got it wrong once already -- recompute rather
# than edit the words if the number ever needs to change again.)
fail_under = 90
show_missing = true
