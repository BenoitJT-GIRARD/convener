[project]
name = "convener-ops"
version = "0.1.0"
description = "Operational tooling for the TEC Monthly Reading Group"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0.2",
  # zoneinfo has no bundled tz database; Windows (and minimal Linux images)
  # have none on disk, so this ships one. Required for sweep.py's DST handling.
  "tzdata>=2025.1; sys_platform == 'win32'",
  # No asymmetric primitive exists in the standard library (hashlib, hmac and
  # secrets are hashing and symmetric only), and eventkeys.py's whole design
  # depends on one: the browser only ever holds the public half, which is
  # only true if a public key cannot decrypt -- a property no symmetric
  # scheme has. The choice was between this well-audited library and
  # hand-rolling RSA in the one module that handles other people's personal
  # data; see tools/convener_ops/eventkeys.py for the rest of that reasoning.
  "cryptography>=43",
]

[project.scripts]
convener-validate = "convener_ops.cli:validate"
convener-check-config = "convener_ops.cli:check_config"
convener-sweep = "convener_ops.cli:sweep"
convener-public-data = "convener_ops.cli:public_data"
convener-handle-proposal = "convener_ops.cli:handle_proposal"
convener-check-commits = "convener_ops.commit_format:check_commits"
convener-commit-range = "convener_ops.commit_format:commit_range"
convener-register = "convener_ops.cli:register"
convener-notify-immediate = "convener_ops.cli:notify_immediate"
convener-notify-digest = "convener_ops.cli:notify_digest"
convener-registration-secret-name = "convener_ops.cli:resolve_registration_secret"
convener-handle-registration = "convener_ops.cli:handle_registration"
convener-send-confirmation = "convener_ops.cli:send_confirmation"
convener-resend-confirmation = "convener_ops.cli:resend_confirmation"
convener-match-attendance = "convener_ops.cli:match_attendance"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["convener_ops"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "mypy>=1.14",
  "bandit>=1.8",
  "pip-audit>=2.7",
  "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["convener_ops", "tests"]
# The one-shot migrations under scripts/ are outside the package but are
# imported by their tests, and are held to the same strictness.
mypy_path = "../scripts"

[tool.coverage.run]
# `branch` belongs here, not under [tool.coverage.report] -- coverage.py
# only recognises it as a [run] option (a misplaced copy is silently
# ignored, with a warning, not an error). Verified by running the suite
# with and without this section and comparing the Branch/BrPart columns.
branch = true

[tool.coverage.report]
# 90, not the actual figure. On this branch's head, actual is 99.77%
# (2178 of 2183 measured statements and branch exits covered). Before this
# branch the floor was 85 against an actual of 95.98% -- a third of the
# tests could have been deleted and the gate would still have passed. That
# decorative gap is what raising the floor is for.
#
# 90 is not sharp either. coverage.py's percentage is statements *plus*
# branch exits together (2183 of them here), not statements alone -- a
# ninety-point estimate of the slack comes from applying the percentage
# gap to the statement count alone (1503) and missing the 680 branches in
# the real denominator. Measured against the real total: 90% of 2183 is
# 1965, and 2178 are covered today, so 213 currently-covered statements or
# branches could go uncovered before the gate would fail -- gross
# regression, a chunk of untested code landing at once, and nothing finer
# than that. A test that exercises a line without asserting anything
# meaningful about it satisfies this gate exactly as well as one that
# doesn't exist here at all. Compare app/vite.config.ts, which enforces
# 90/90/85/90 while the app actually sits at 98.21/94.15/99.34/98.94 --
# same shape of gap, same limits to what a floor this far below the truth
# can catch.
#
# The real guard against a weak test is mutation testing -- breaking the
# line or branch a test claims to cover and checking the test then fails --
# and a reviewer who spot-checks that a new test actually bites, not this
# number. fail_under is a backstop against a large regression, never a
# claim that passing it means the suite is any good. (This comment names a
# specific slack figure, and got it wrong once already -- recompute rather
# than edit the words if the number ever needs to change again.)
fail_under = 90
show_missing = true
