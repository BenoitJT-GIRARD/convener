# Which paths belong to the instance, and which belong to the product.
#
# This repository is meant to be duplicated. For a duplicate, an update is a
# **merge**: it succeeds when upstream's commits and the instance's commits
# never touch the same **region of a file**, and it fails into a field of
# conflicts otherwise -- at which point people stop updating. So "instance"
# cannot stay an intention. It is a set of paths, and this file is where that
# set is written down once.
#
# `region` rather than `file`, and the difference is not pedantry
# ---------------------------------------------------------------
# This paragraph said "the same file" for a long time, which is stricter than
# git and than this repository. Measured on a real duplicate's first merge:
# eleven product paths carry a value that is the instance's, none of them
# named below, and the list above would call every one of them a fork. Git
# calls four of them nothing at all.
#
# They divide by *how much of the file* each side writes, which is the
# question that decides whether a merge is readable:
#
#   Four are one line. `.github/CODEOWNERS`'s catch-all rule names the
#   Board's own team; each relay's `wrangler.toml` carries a KV namespace id
#   -- both shipped as `REPLACE_WITH_KV_NAMESPACE_ID`, which is the
#   product's own word for a value it cannot supply; and
#   `.github/dependabot.yml` carries whatever a duplicate did to stop
#   version updates. Upstream can rewrite the rest of any of those files
#   without ever reaching the line, and on most releases does.
#
#   Seven are written whole, by `tools/scripts/generate_brand_css.py` and
#   `generate_motif.py`, from the charter in force. A change to either
#   generator rewrites the file on both sides at once, so these conflict
#   every time and conflict unreadably. They are also the only ones with a
#   resolution that needs no judgement: take either side, re-run the
#   generator, and `--check` -- in `gates.sh` and in `quality.yml` -- proves
#   it was done.
#
# Neither group is declared below, and neither should be: handing a
# generated file to the instance would freeze that instance's own design
# against every correction upstream makes to the generator, remeasured
# contrasts included. What they needed was the resolution written down, and
# `docs/operating/taking-an-update.md` is where it now is.
#
# The default is the product
# --------------------------
# Everything not named below belongs to the product: upstream writes it,
# upstream updates it, and a duplicate that edits it is forking rather than
# tracking. The list below is the exception, deliberately short, and it is
# read -- `tools/convener_ops/declaration/boundary.py` parses this file and
# `tools/tests/declaration/test_boundary.py` holds the repository against what it says.
# Nothing restates it in prose; `docs/engineering/content-rules.md` names this file
# as the home of the notion rather than copying the list, for the reason that
# document's own first rule gives.
#
# Ownership is a property of a *file*, not of a value
# ---------------------------------------------------
# Because a merge is a file-level event. A file holding one instance-owned
# value is an instance file even when its other values would have made
# perfectly good product defaults: upstream cannot ship half a file. That is
# the rule that settled this directory, which held both owners under its
# old name `config/` until the four files that were the instance's moved
# into `instance/` beside its records.
#
# The list below names directories, and a configuration file is not one of
# them: each states its own answer in its own header, next to the argument
# for it -- see `owner:` in `instance/config.json`,
# `instance/actions-budget.yml`, `instance/queue-drain.yml`,
# `instance/registration-lanes.yml`, `declarations/integrations.yml`, and in this
# file itself. `boundary.CONFIG_DIRS` is where those two directories are
# named and `boundary.states_its_own_owner` is the same set seen from the
# other end: `test_boundary.py` refuses such a file named in the list below,
# so the two halves can never disagree. Which side a file is on is now also
# where it sits, and `test_instance_directory.py` is what holds that.
#
# What used to be here and is not any more
# ----------------------------------------
# `site/src/_data/site.json` was an entry in the list below: four keys --
# the series' title, its tagline, its forum, its proposal form -- read by
# the showcase's build through Eleventy's global-data convention. All four
# were folded into `instance/config.json`'s own `identity`,
# alongside the organisation's name, and `site/.eleventy.js` composes them
# from there for every template. The file entry went with the file. That is
# one-notion-one-home applied
# to this declaration itself: leaving four identity keys in `site/` and
# putting the rest in `declarations/` would have given one notion two homes and
# a duplicate two files to edit before its first build. Nothing under
# `site/` is the instance's now.
#
# `instance/config.json` is JSON rather than YAML for a reason that is not
# taste: it is the one declaration of this project's
# published address, and Python, the application's build and the showcase's
# build all read it. JSON is the only format all three parse without a
# dependency `site/` and `services/` do not have. `boundary.py` reads both
# formats for exactly this file's sake, so that a format nobody enumerated
# cannot become a file in this directory whose owner nothing ever asks
# for.
#
# `examples/the-example-collective/` is the product's, and looks exactly like it is not
# ---------------------------------------------------------------------
# That directory holds one file for each path an instance owns, at the same
# relative path -- so `examples/the-example-collective/instance/` mirrors `instance/`,
# down to an invented instance's `config.json`, `config.yml` and
# `speakers.yml`. It holds no `brand.json`: that instance's declaration
# names one of the product's own charters instead, which is the first of
# the three answers `tools/convener_ops/publication/brand.py::source`
# gives, and that directory's own README says what naming one costs. It
# is still the product's, by the default
# above: upstream ships it and upstream maintains it, and nothing reads it
# at run time. `tools/tests/repository/test_second_instance.py` copies this
# repository, deletes everything the list below hands to the instance,
# lays those files into the holes, builds the result and refuses anything
# of this instance in the output. So the list below is not only a
# statement about merges any more -- a path carrying identity that nobody
# declared here survives that deletion, and the sweep finds it.
#
# `retired:` -- where the instance's paths used to be
# ---------------------------------------------------
# `instance:` above is present tense. It answers "is this path the
# instance's *now*", which is the question the runtime, the settings
# screen and the second-instance build have. Anything reading this
# repository's **history** has a different one -- "was this path ever the
# instance's" -- and for two years the two were answered by the same
# call. `instance/data/speakers.yml` lived at `data/speakers.yml` until
# the move above, so every earlier version of this instance's records
# read as the product's, and a derived public repository would have
# carried all of them.
#
# So the second question gets a second list. Entries have the shape the
# ones above have, `kept:` included, and the same parser reads them; what
# is different is that no entry here names a path that exists, and no
# entry here is a path `instance:` still hands over -- one of the two
# would be a copy of the other, and `boundary.retired_from_data` refuses
# it. `Boundary.ever_owned` is `owner_of` widened by this list, and only
# something reading this repository's *history* has any use for it:
# whose a path is today and whose its blobs have ever been are two
# questions. The two JavaScript readers do not mirror it, because neither
# of them ever asks about a commit.
#
# `site/src/_data/site.json` is the entry that is not a move. Its four
# identity keys were folded into `instance/config.json` and the file was
# deleted, which removed it from the working tree and from nothing else:
# its blobs are reachable from every commit that added them. It was
# instance data with no entry anywhere from the day it went, which is the
# hole this list closes as well as the one the move opened.
#
# A *product* path that moves needs no entry here, and adding one does
# real damage rather than none. The reflex is the wrong way round: this
# list widens **instance** ownership, and whatever decides what a public
# repository may not carry reads it, so retiring `assets/brand/` on
# the day it becomes `assets/brand/` would take every earlier version
# of the product's own charters out of that repository. Nothing about
# such an entry looks wrong -- it names a path that existed, does not
# exist now, and is not handed to the instance, which is all the parser
# can see -- so two readings stand behind the parser:
# `boundary.retirements_must_land_where_the_instance_is` refuses an entry
# whose `became:` is not a path the instance owns today, and the blobs
# themselves answer the rest, an entry being wrong whenever the bytes
# ever stored under the retired path are tracked now at a path the
# product owns. `config/` becoming
# `declarations/`, `examples/` becoming `examples/` and `assets/brand/` and
# `fonts/` moving under `assets/` are all that shape, and none of them
# is below.
#
# `became:` -- a retirement is a move, and a move ends somewhere
# --------------------------------------------------------------
# That measurement reads the *tip*, twice: a blob still tracked at a
# product path, and a `git show -M` rename target. Both readings ask
# where the files are now, so both pass in silence over a path that was
# **deleted** rather than renamed -- there is no tip copy to find and no
# rename to detect. Measured, on this repository: adding
# `- path: tools/migrations/` below, on the day the six one-shot
# migrations were deleted, kept every gate green and took the derivation
# from 24 paths never leaving to 30. Six product files' whole history
# stripped out of the public repository, and the only trace a count on a
# plan nobody diffs.
#
# So each entry says where its content went. `became:` is that path, and
# it has to be one `instance:` or a configuration header hands to the
# instance **today** -- `boundary.retirements_must_land_where_the_instance_is`
# refuses anything else, at load, which is before the derivation reads a
# single commit. The claim an entry here makes is that this instance's
# own files sat at a path; every such claim has a present-tense
# counterpart, because the files did not evaporate. A path with no such
# counterpart was deleted, not retired, and the product deletes its own
# files all the time.
#
# It is declared rather than inferred, and that is the measurement's
# doing rather than a preference. Asking git where each retired path's
# files went answers for six of the eight entries below and for neither
# of the other two: `keys/` moved with only the product's own `kept:`
# readme surviving the move, and `site/src/_data/site.json` was never
# moved at all -- its four identity keys were folded into
# `instance/config.json` and the file deleted. Both entries are correct,
# and a control that fires on a correct entry is one somebody turns off.
# What can be measured without an exemption is the declaration against
# the move, and `tools/tests/declaration/test_retired_paths.py` measures
# exactly that: every rename git can see out of a retired path has to land
# at or under that entry's `became:`, and the commit that emptied the
# retired path has to be the commit that wrote `became:`.
#
# That second reading used to be about *lines* -- something of what was
# stored under the path had to still be readable at its destination --
# and that was not evidence of anything. `examples/the-example-collective/`
# holds one file per path the instance owns, at the same relative path,
# so a file there resembles an instance file by construction: retiring
# `examples/the-example-collective/instance/data/brand.json` with
# `became: instance/data/` shared lines with `instance/data/brand.json`
# for no better reason than both being a `brand.json`, passed every
# reading, took the derivation from 24 paths never leaving to 25, and
# withheld the worked example's own charter -- the product's -- from the
# repository the product is published from. A move is one act: the place
# it leaves goes empty in the same commit the place it arrives at is
# written, and a resemblance cannot forge that. `tools/migrations/` was
# deleted in a commit that wrote nothing the instance owns, and the
# example's charter in a commit that wrote nothing under
# `instance/data/`, so no `became:` saves either of them.

# `kept:` -- the product's own files inside a directory the instance owns
# ----------------------------------------------------------------------
# Two directories hand their *contents* to the instance while still carrying
# one file upstream owns and maintains. Naming them here is not an escape
# hatch: each entry is a file that exists, is tracked, and is checked, and
# each one is a candidate for being moved somewhere unambiguous later. What
# is not allowed is an entry nobody can justify, which is why the reason sits
# beside the path rather than in a document.
owner: product
v: 1

instance:
  - path: instance/data/
    reason: >-
      The instance's own records and its governance configuration: the board
      and its thresholds (config.yml), the speakers and events (speakers.yml),
      the visual identity's measured values (brand.json), and every ledger the
      scheduled jobs write back (actions-usage.yml, retention-last-run.yml,
      queue-watch.yml, queue-ledger.yml, survey-invitations.yml,
      event-key-destructions.yml). None of it is a value upstream could ship
      correctly for anybody else.
    kept:
      - path: instance/data/schema.md
        reason: >-
          A three-line stub pointing a reader at docs/engineering/schema.md,
          which tools/scripts/generate_schema_doc.py derives from
          app/src/data/types.ts. It describes the product's model, not this
          instance's records, and no duplicate has any reason to edit it.
  - path: instance/keys/
    reason: >-
      The instance's cryptographic material: the published public half of
      each event key (instance/keys/events/,
      tools/convener_ops/journey/eventkeys.py) and of each certificate signing key
      (instance/keys/signing/, tools/convener_ops/journey/signing.py). Both
      directories are empty of keys in this repository today and stay empty
      in a fresh duplicate -- generating one is an operator's act, never
      upstream's.
    kept:
      - path: instance/keys/events/README.md
        reason: >-
          The naming of an event key file, what one key per event buys and
          why a file here is never renamed. Product documentation at the
          path where the keys go, so that an operator opening an empty
          directory meets the contract rather than nothing. Upstream
          maintains it; an instance never edits it.
      - path: instance/keys/signing/README.md
        reason: >-
          The wire format and the directory's contract, which the verification
          page depends on. It is product documentation that happens to live
          where the keys go, so that an operator opening the directory meets
          it. Upstream maintains it; an instance never edits it.
  - path: docs/handbook/governance/register.md
    regenerated: true
    reason: >-
      The decision register: a total re-rendering of this repository's own
      commit history, written by .github/workflows/derive-decision-register.yml on every
      push (tools/convener_ops/governance/register.py, cli/governance.py::register) and never by hand
      -- the file's own preamble says so, and convener-register --check fails
      the build if anybody tries. It sits under docs/ because it is written
      for a volunteer to read and because two handbook pages link to it and
      the cockpit publishes it, all of which would break if it moved; it is
      the instance's because its every row is this series' own governance,
      and upstream ships it filled in with rows a duplicate has no reason
      to inherit. It is the one entry here that upstream's own runs also
      write, which is what regenerated: above is for.
  - path: instance/public-data/
    reason: >-
      Everything the instance publishes about itself, derived from
      instance/data/ by the product's own commands and committed by
      .github/workflows/deploy.yml. Upstream ships no projection here at
      all -- the directory holds no data in a fresh clone, and .gitignore's
      own exceptions name the files a running instance commits into it.
    kept:
      - path: instance/public-data/README.md
        reason: >-
          Which command writes each projection, who reads it, and what is
          refused entry. Product documentation at the path the projections
          land in, so that an operator opening an empty directory meets the
          contract. Upstream maintains it; an instance never edits it.

retired:
  - path: data/
    became: instance/data/
    reason: >-
      Where instance/data/ was until 2026-08-28: the board and its
      thresholds (config.yml), the speakers and events (speakers.yml and,
      before the v6 unification, events.yml), the charter's measured
      values (brand.json) and the scheduled jobs' ledgers. Twenty-eight
      versions of speakers.yml and thirty-two of config.yml are reachable
      here, and every one of them holds names, affiliations and
      addresses.
    kept:
      - path: data/schema.md
        reason: >-
          The same three-line stub instance/data/schema.md is, at the
          path it had before the move. It described the product's model
          then as it does now, so a derived repository keeps its history
          rather than starting it at the move.
  - path: keys/
    became: instance/keys/
    reason: >-
      Where instance/keys/ was until 2026-08-28. One published signing
      key is reachable under it, and a fresh duplicate has no reason to
      inherit this instance's.
    kept:
      - path: keys/signing/README.md
        reason: >-
          The wire format and the directory's contract, at the path it
          had before the move. Product documentation then as now.
  - path: config/instance.json
    became: instance/config.json
    reason: >-
      Where instance/config.json was until 2026-08-28: this series'
      published address, its organisation, its name in every form the
      templates print, and the repository the showcase is pushed into.
      A configuration file states its own owner in its own header, and a
      file that is not there any more states nothing -- which is why a
      retired configuration path is named here and a live one may not be.
  - path: config/actions-budget.yml
    became: instance/actions-budget.yml
    reason: >-
      Where instance/actions-budget.yml was until 2026-08-28: this
      organisation's GitHub Actions allowance and the thresholds it is
      watched against.
  - path: config/queue-drain.yml
    became: instance/queue-drain.yml
    reason: >-
      Where instance/queue-drain.yml was until 2026-08-28: how fast this
      instance drains its submission queue.
  - path: config/registration-lanes.yml
    became: instance/registration-lanes.yml
    reason: >-
      Where instance/registration-lanes.yml was until 2026-08-28: the
      lanes this instance routes registrations through.
  - path: docs/governance/register.md
    became: docs/handbook/governance/register.md
    reason: >-
      Where docs/handbook/governance/register.md was until 2026-08-31,
      when docs/ was split into one tree per reader. Every version
      reachable at this path is a re-rendering of this series' own
      governance -- the rows the live entry above says a duplicate has
      no reason to inherit -- so a history read through the present
      tense alone would hand all of them over as the product's.
  - path: site/src/_data/site.json
    became: instance/config.json
    reason: >-
      Four identity keys the showcase's build read through Eleventy's
      global-data convention -- the series' title, its tagline, its
      forum, its proposal form. They were folded into
      instance/config.json's own identity and the file was deleted, so
      this is a retirement rather than a move: no path today holds these
      bytes, and nothing but this entry says they were the instance's.
