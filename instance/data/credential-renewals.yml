# When each credential this instance holds stops working.
#
# Read by `tools/convener_ops/maintenance/credential_expiry.py` on the daily
# sweep, which posts to the board thread a fortnight before a date and turns
# the run red once one has passed. That module's own docstring carries the
# argument for why these are declared here rather than discovered: GitHub
# reports a fine-grained token's expiry only to the account that owns it, so
# no workflow of this repository's can read the date of the token it is
# running under -- let alone of a credential held at a third party.
#
# Empty here, and that is the worked example rather than an omission: this
# repository's instance is an invented one holding no credential that
# expires. A shipped date would be a date that goes stale, and every
# duplicate would inherit an alarm about a token nobody ever minted.
#
# What an entry looks like, and the three keys are all required:
#
#   renewals:
#     - secret: CONVENER_MEETING_API_TOKEN
#       expires: 2026-10-13
#       renewed_by: docs/operating/operations.md, Meeting platform
#
# `expires` is ISO 8601, YYYY-MM-DD, and nothing else.
#
# `renewed_by` points at the procedure rather than repeating it. Every
# integration in `docs/operating/operations.md` carries its own, and a line
# copied here would be a second home for it -- which this repository's own
# content rules refuse, and which would go out of date in exactly the way a
# renewal procedure must not.
#
# **Write the new date back in the same sitting as the renewal.** That is
# the whole cost of this file and the only one that buys anything: a date
# nobody wrote down is a date nobody can be reminded of, which is the state
# this file exists to leave.
v: 1
renewals: []
